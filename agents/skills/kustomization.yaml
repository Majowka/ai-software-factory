# Builds the requirements-skill and code-review-skill ConfigMaps from the SKILL.md files: kubectl apply -k agents/skills
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: requirements-skill
    files:
      - SKILL.md=requirements/SKILL.md
  - name: code-review-skill
    files:
      - SKILL.md=code-review/SKILL.md
