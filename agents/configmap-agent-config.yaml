apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: agents
data:
  # Prints a GitHub App installation token (valid 1h). Run it right before every step that talks to GitHub.
  gh-app-token.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
    # Rebuild the PEM with 64-character lines: OpenSSL 3 rejects a key stored on one line (spaces or literal \n
    # instead of line breaks), which is how a secret store may hand it over. A key without BEGIN/END lines is
    # wrapped according to the detected format: PKCS#8 -> PRIVATE KEY, PKCS#1 -> RSA PRIVATE KEY (GitHub App keys).
    pem_normalize() {
      local kind body
      kind="$(printf '%s' "$1" | sed -nE 's/.*-----BEGIN ([A-Z ]+)-----.*/\1/p' | head -n 1)"
      body="$(printf '%s' "$1" | sed -E 's/\\n/ /g; s/-----(BEGIN|END) [A-Z ]+-----//g' | tr -d ' \t\r\n')"
      if [ -z "$kind" ]; then
        if printf '%s' "$body" | openssl base64 -d -A 2>/dev/null | openssl asn1parse -inform DER 2>/dev/null \
          | sed -n 3p | grep -q 'SEQUENCE'; then kind="PRIVATE KEY"; else kind="RSA PRIVATE KEY"; fi
      fi
      printf -- '-----BEGIN %s-----\n%s\n-----END %s-----\n' "$kind" "$(printf '%s' "$body" | fold -w 64)" "$kind"
    }
    now="$(date +%s)"
    header="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
    payload="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$GITHUB_APP_ID" | b64url)"
    signature="$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign <(pem_normalize "$GITHUB_APP_PRIVATE_KEY") | b64url)"
    # Retries: a GitHub 5xx while minting the token failed whole runs (2026-11-25)
    curl -fsS --retry 4 --retry-all-errors --retry-delay 5 -X POST \
      -H "Authorization: Bearer ${header}.${payload}.${signature}" \
      -H "Accept: application/vnd.github+json" \
      "https://api.github.com/app/installations/${GITHUB_APP_INSTALLATION_ID}/access_tokens" | jq -er .token
  # Title and issue keyword of the pull request opened by `publish`. The agent proposes them in .agent-pr.txt
  # (moved to /workspace/out/pr.txt by the agent step):  "title: <type>(<scope>): <subject>"  and optionally
  # "scope: partial". Usage: source /config/pr-meta.sh; pr_meta "<fallback title>"  -> sets PR_TITLE and PR_KEYWORD.
  # A title that is not a valid Conventional Commits header falls back to the given default; "scope: partial"
  # writes "Refs #<issue>" instead of "Closes #<issue>", so a partial change does not close the issue.
  pr-meta.sh: |
    pr_meta() {
      local file=/workspace/out/pr.txt title="" scope=""
      if [ -f "$file" ]; then
        title="$(sed -nE 's/^[[:space:]]*title:[[:space:]]*//p' "$file" | head -n 1 | tr -d '\r' | sed -E 's/[[:space:]]+$//')"
        scope="$(sed -nE 's/^[[:space:]]*scope:[[:space:]]*//p' "$file" | head -n 1 | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
      fi
      local re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^[:space:]][^[:cntrl:]]*$'
      # Count characters, not bytes: the step has no UTF-8 locale, so ${#title} would reject valid titles with Polish letters
      local title_chars
      title_chars="$(printf '%s' "$title" | python3 -c 'import sys; print(len(sys.stdin.buffer.read().decode("utf-8", "replace")))')"
      if [ "$title_chars" -le 100 ] && printf '%s' "$title" | grep -qE "$re"; then
        PR_TITLE="$title"
      else
        [ -n "$title" ] && echo "pr-meta: rejected title proposed by the agent: $title" >&2
        PR_TITLE="$1"
      fi
      case "$scope" in partial*) PR_KEYWORD="Refs" ;; *) PR_KEYWORD="Closes" ;; esac
      echo "pr-meta: title='$PR_TITLE' keyword=$PR_KEYWORD"
    }
  # Description of the pull request opened by `publish` (GitHub showed only "Closes #N" before). Usage, after pr_meta
  # (PR_KEYWORD): source /config/pr-body.sh; pr_body <issue> > <file>. Reads the agent's summary from summary.agent.md
  # (publish copies it there before putting the verify note in front of summary.md for the issue reply).
  # Sections: issue link, the agent's summary (what changed and why, testing, known limitations), the pipeline's build
  # verification, the CI gates of the verify script (ci-gates.md), the regression-test check, the self-review verdict, the plan, the engines used. Each part is capped
  # so the body stays below GitHub's 65536-character limit.
  pr-body.sh: |
    pr_body() {
      local issue="$1" out=/workspace/out part
      # Cut at a byte limit; iconv drops a multi-byte character cut in half (when the image has it)
      cap() { if command -v iconv >/dev/null 2>&1; then head -c "$1" | iconv -f utf-8 -t utf-8 -c; else head -c "$1"; fi; }
      printf '%s #%s\n\n' "${PR_KEYWORD:-Closes}" "$issue"
      if [ "${PR_KEYWORD:-Closes}" = "Refs" ]; then
        printf '> [!NOTE]\n> The agent marked this change as partial: it covers only part of the issue, so the issue stays open.\n\n'
      fi
      if [ -s "$out/summary.agent.md" ]; then
        cap 20000 < "$out/summary.agent.md"; printf '\n\n'
      else
        printf '_The agent left no summary; see the diff and the issue._\n\n'
      fi
      printf '### Verification (pipeline)\n\n'
      if [ -s "$out/verify-note.md" ]; then
        cap 15000 < "$out/verify-note.md"; printf '\n'
      else
        printf 'Build verification did not run (no verify command for this repository).\n'
      fi
      # The verify note carries the CI gates table (verify-build); older notes without it get it here
      if [ -s "$out/ci-gates.md" ] && ! grep -q '<summary>CI gates' "$out/verify-note.md" 2>/dev/null; then
        printf '\n### CI gates (verify)\n\n'
        cap 6000 < "$out/ci-gates.md"; printf '\n'
      fi
      if [ -s "$out/self-review.md" ] && ! grep -q '<summary>Self-review</summary>' "$out/verify-note.md" 2>/dev/null; then
        part="$(head -n 3 "$out/self-review.md" | grep -ioE 'VERDICT:[[:space:]]*(ok|fix)' | head -n 1 || true)"
        printf '\n### Self-review\n\n**%s**\n\n<details><summary>Self-review</summary>\n\n' "${part:-no verdict}"
        cap 15000 < "$out/self-review.md"
        printf '\n</details>\n'
      elif [ ! -s "$out/self-review.md" ] && [ -s "$out/verify-note.md" ] && ! grep -q 'self-review' "$out/verify-note.md"; then
        printf '\n### Self-review\n\nNo self-review ran for this change.\n'
      fi
      if [ -s "$out/plan.md" ]; then
        printf '\n<details><summary>Plan</summary>\n\n'; cap 6000 < "$out/plan.md"; printf '\n</details>\n'
      fi
      if [ -s "$out/engines.txt" ]; then
        printf '\n---\n_Opened by the AI factory. Agents: %s._\n' "$(sort -u "$out/engines.txt" | paste -sd ',' | sed 's/,/, /g')"
      else
        printf '\n---\n_Opened by the AI factory._\n'
      fi
    }
  # Which engine runs which agent task. Change it here and apply the ConfigMap; the next run picks it up.
  # A label on the issue / PR overrides it for that issue: engine:claude, engine:opencode, engine-implement:opencode, ...
  # Tasks: PLAN (plan steps of all three event pipelines), IMPLEMENT (agent steps), FIX (build-fix attempts in
  # verify-build), CI_FIX (pr-comment-agent started by a red CI check), REQUIREMENTS (requirements-agent analysis),
  # REVIEW (pr-review-agent, `@ai review`; best on another engine than IMPLEMENT, so the author does not review itself).
  # Values: opencode | claude. Label for one task: engine-<task>:<engine>, e.g. engine-ci-fix:opencode.
  routing.env: |
    AGENT_ENGINE_DEFAULT=opencode
    # Claude Code (subscription) where DeepSeek flash was inaccurate: the plan of every run and the code of bug fixes.
    # Everything else stays on OpenCode; Claude falls back to OpenCode on the subscription's limits (agent-run.sh).
    AGENT_ENGINE_PLAN=claude
    AGENT_ENGINE_IMPLEMENT=opencode
    AGENT_ENGINE_IMPLEMENT_BUG=claude
    AGENT_ENGINE_FIX=opencode
    AGENT_ENGINE_CI_FIX=opencode
    AGENT_ENGINE_REQUIREMENTS=opencode
    AGENT_ENGINE_REVIEW=opencode
    # Models per engine. OpenCode: provider/model (OpenCode Go: opencode-go/<model-id>, list with
    # curl -H "Authorization: Bearer $OPENCODE_API_KEY" https://opencode.ai/inference/go/v1/models).
    # Claude Code: an alias (sonnet, opus, haiku) or a full model id. Per-task overrides: OPENCODE_MODEL_<TASK>, CLAUDE_MODEL_<TASK>
    # (bug issues: <VAR>_<TASK>_BUG first).
    OPENCODE_MODEL=opencode-go/deepseek-v4.1-flash
    # Reasoning effort of OpenCode (`opencode run --variant`), per task: OPENCODE_VARIANT_<TASK>, default OPENCODE_VARIANT
    # (empty = the provider's default). The values are the model's variants in OpenCode's model list
    # (`opencode models opencode-go --verbose`): deepseek-v4.1-flash has low, high and max. Thinking hard pays off where the
    # agent has to find the cause or judge code (plan, review, build fixes); writing the code (IMPLEMENT) keeps the default.
    OPENCODE_VARIANT_PLAN=high
    OPENCODE_VARIANT_REVIEW=high
    OPENCODE_VARIANT_FIX=high
    OPENCODE_VARIANT_CI_FIX=high
    CLAUDE_MODEL=sonnet
    CLAUDE_MODEL_PLAN=opus
    # How many agent tasks may talk to one engine at the same time (all runs together); the rest wait in a FIFO queue
    # (llm-slot.sh). 0 = no limit. More parallel calls than the provider allows end in HTTP 429: OpenCode Go
    # (deepseek-v4.1-flash) took 9-11 parallel tasks without 429 and answered "Rate limit exceeded" from 13 on
    # (2026-11-25). OpenCode retries a 429 by itself (it only shows in its own log), so the run gets slow, not red.
    LLM_SLOTS_OPENCODE=8
    # Claude Max 5x: the limit is usage per 5 h window, not parallel calls; Claude falls back to OpenCode when it hits it.
    LLM_SLOTS_CLAUDE=3
    # On HTTP 429 / overload from the provider: how many times a task runs again, and the first wait in seconds (doubles)
    LLM_RATE_RETRIES=4
    LLM_RATE_BACKOFF=30
  # Runs one agent task with the engine chosen in routing.env: agent-run.sh <task> <timeout> <log file> <prompt>.
  # Returns the engine's exit code (124 on timeout). Credentials come from the environment of the step:
  # OPENCODE_API_KEY (secret opencode-go) and CLAUDE_CODE_OAUTH_TOKEN (secret claude-code-oauth).
  # Bug issues (is_bug in regression-test.sh) look up <VAR>_<TASK>_BUG before <VAR>_<TASK>, e.g. AGENT_ENGINE_IMPLEMENT_BUG.
  # Claude falls back to OpenCode when there is no token, or when Claude Code fails on the subscription's usage or rate
  # limit, an overloaded API or a refused token (many runs share one subscription); a timeout or another error does not.
  agent-run.sh: |
    #!/usr/bin/env bash
    set -uo pipefail
    task="$(printf '%s' "$1" | tr '[:lower:]-' '[:upper:]_')"; limit="$2"; log="$3"; prompt="$4"
    set -a; source /config/routing.env; set +a
    bug=""
    if [ -f /config/regression-test.sh ]; then source /config/regression-test.sh; is_bug && bug=1; fi
    pick() {
      local v
      if [ -n "$bug" ]; then v="${1}_${task}_BUG"; if [ -n "${!v:-}" ]; then printf '%s' "${!v}"; return; fi; fi
      v="${1}_${task}"; if [ -n "${!v:-}" ]; then printf '%s' "${!v}"; else v="$1"; printf '%s' "${!v:-$2}"; fi
    }
    engine="$(pick AGENT_ENGINE "${AGENT_ENGINE_DEFAULT:-opencode}")"
    # GitHub labels of the issue / PR (written by the prepare steps) win over routing.env:
    # engine-<task>:<engine> for one task (e.g. engine-implement:opencode), engine:<engine> for all tasks.
    if [ -s /workspace/agent-labels ]; then
      t="$(printf '%s' "$task" | tr '[:upper:]_' '[:lower:]-')"
      label="$(grep -xE "engine-${t}:(opencode|claude)" /workspace/agent-labels | head -n1 || true)"
      [ -n "$label" ] || label="$(grep -xE 'engine:(opencode|claude)' /workspace/agent-labels | head -n1 || true)"
      if [ -n "$label" ]; then engine="${label#*:}"; echo "Engine from label ${label}" | tee -a "$log"; fi
    fi
    mkdir -p "$(dirname "$log")"
    # At most LLM_SLOTS_<ENGINE> tasks talk to one engine at a time; the rest wait in a FIFO queue (llm-slot.sh).
    # Waiting in the queue does not count against the task's timeout.
    llm_slot_acquire() { :; }; llm_slot_release() { :; }
    [ -f /config/llm-slot.sh ] && source /config/llm-slot.sh
    # Seconds of a timeout(1) duration: 90, 90s, 15m, 3h, 1d
    secs() { local n="${1%[smhd]}"; case "$1" in *m) echo $((n * 60));; *h) echo $((n * 3600));; *d) echo $((n * 86400));; *) echo "$n";; esac; }
    # Provider rate limit / overload in the engine's output: the task waits and runs again (LLM_RATE_RETRIES times,
    # backoff LLM_RATE_BACKOFF seconds doubled each time, plus jitter), within the task's own time limit.
    rate_re='(HTTP|status|error|code)[^0-9]{0,20}429|too many requests|rate[ _-]?limit|overloaded|(HTTP|status|error|code)[^0-9]{0,20}529'
    run_opencode() { # $1: note for the header
      local model variant attempt=0 out deadline left wait
      model="$(pick OPENCODE_MODEL '')"
      variant="$(pick OPENCODE_VARIANT '')"
      llm_slot_acquire opencode "$log"
      deadline=$(( $(date +%s) + $(secs "$limit") ))
      while :; do
        echo "=== ${task}: opencode ${model}${variant:+ (variant ${variant})}${1:+ $1}$([ "$attempt" -gt 0 ] && echo " (retry ${attempt})") ===" | tee -a "$log"
        left=$(( deadline - $(date +%s) )); [ "$left" -gt 0 ] || left=1
        out="$(mktemp)"
        OPENCODE_CONFIG=/config/opencode.json timeout "$left" opencode run ${model:+-m "$model"} ${variant:+--variant "$variant"} \
          "$prompt" 2>&1 | tee -a "$log" "$out"
        rc=${PIPESTATUS[0]}
        if [ "$rc" -ne 124 ] && { [ "$rc" -ne 0 ] || [ "$(wc -c < "$out")" -lt 500 ]; } && grep -qiE "$rate_re" "$out" \
           && [ "$attempt" -lt "${LLM_RATE_RETRIES:-4}" ]; then
          attempt=$((attempt + 1))
          wait=$(( ${LLM_RATE_BACKOFF:-30} * (1 << (attempt - 1)) + RANDOM % 15 ))
          if [ $(( $(date +%s) + wait + 60 )) -lt "$deadline" ]; then
            echo "opencode hit the provider's rate limit (exit ${rc}): retry ${attempt} in ${wait}s" | tee -a "$log"
            rm -f "$out"; sleep "$wait"; continue
          fi
        fi
        rm -f "$out"; break
      done
      llm_slot_release
      used="opencode${model:+ ${model}}"
    }
    case "$engine" in
      opencode)
        run_opencode "" ;;
      claude)
        if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
          echo "No CLAUDE_CODE_OAUTH_TOKEN (secret claude-code-oauth): falling back to OpenCode" | tee -a "$log"
          run_opencode "(fallback from claude: no token)"
        else
          model="$(pick CLAUDE_MODEL sonnet)"
          llm_slot_acquire claude "$log"
          echo "=== ${task}: claude ${model}${bug:+ (bug)} ===" | tee -a "$log"
          out="$(mktemp)"
          timeout "$limit" claude -p "$prompt" --model "$model" --settings /config/claude-settings.json \
            --output-format text 2>&1 | tee -a "$log" "$out"
          rc=${PIPESTATUS[0]}
          llm_slot_release
          used="claude ${model}"
          # Usage / rate limit of the subscription, overloaded API, refused token: the run goes on with OpenCode.
          limit_re='usage limit|rate[ _-]?limit|limit reached|hit your limit|limit will reset|API Error: (401|403|429|529)|overloaded|authentication_error|invalid (api key|bearer token)|OAuth token (has )?(expired|revoked)|credit balance'
          if [ "$rc" -ne 124 ] && { [ "$rc" -ne 0 ] || [ "$(wc -c < "$out")" -lt 500 ]; } && grep -qiE "$limit_re" "$out"; then
            echo "Claude Code hit a usage/rate limit or was refused (exit ${rc}): falling back to OpenCode" | tee -a "$log"
            run_opencode "(fallback from claude)"
          fi
          rm -f "$out"
        fi ;;
      *)
        echo "Unknown engine '${engine}' for task ${task} (routing.env)" | tee -a "$log"; rc=2 ;;
    esac
    [ "$rc" -eq 0 ] || echo "${engine} exited with ${rc} (timeout or error)" | tee -a "$log"
    # Engine that actually ran each task (after a fallback too), for the pull request description
    if [ -n "${used:-}" ] && [ -d /workspace/out ]; then
      printf '%s %s\n' "$(printf '%s' "$task" | tr '[:upper:]_' '[:lower:]-')" "$used" >> /workspace/out/engines.txt 2>/dev/null || true
    fi
    exit "$rc"
  # Caps parallel agent tasks per engine (FIFO queue on Leases), sourced by agent-run.sh. Limits: LLM_SLOTS_* in routing.env.
  llm-slot.sh: |
    #!/usr/bin/env bash
    # Caps how many agent tasks talk to one engine at the same time, so the provider's rate limit is not hit (HTTP 429).
    # Source it, then: llm_slot_acquire <engine> <log>; ...run the engine...; llm_slot_release.
    # The limit per engine is LLM_SLOTS_<ENGINE> in routing.env (e.g. LLM_SLOTS_OPENCODE=3); 0 or unset = no limit.
    # Slots and the queue are Kubernetes Leases in the run's namespace (Role llm-slots): a task takes a free slot
    # llm-slot-<engine>-<i>, i < limit, or waits in the queue (ticket llm-q-<engine>-<pod>-<pid>) and gets the next free
    # slot in arrival order (FIFO). A background loop renews the lease; a pod that dies without releasing it (timeout,
    # eviction) frees it after LLM_SLOT_LEASE_SECONDS. Waiting does not count against the engine's timeout.
    # Fail-open: when the API is not reachable or the service account may not use Leases, the task runs without a slot.
    _llm_sa="${LLM_SLOT_SA_DIR:-/var/run/secrets/kubernetes.io/serviceaccount}"
    _llm_api="https://${KUBERNETES_SERVICE_HOST:-kubernetes.default.svc}:${KUBERNETES_SERVICE_PORT:-443}"
    _llm_held=""      # name of the slot lease this process holds
    _llm_hb_pid=""    # heartbeat loop
    _llm_cur=""       # file with the lease the heartbeat renews

    _llm_now() { date -u +%Y-%m-%dT%H:%M:%S.%6NZ; }

    # _llm_k <method> <path below .../leases> [json body]: prints the HTTP code, the body goes to $_llm_out
    _llm_k() {
      curl -sS -o "$_llm_out" -w '%{http_code}' -X "$1" --max-time 20 --cacert "$_llm_sa/ca.crt" \
        -H "Authorization: Bearer $(cat "$_llm_sa/token")" -H 'Content-Type: application/json' \
        ${3:+--data "$3"} "${_llm_api}/apis/coordination.k8s.io/v1/namespaces/${_llm_ns}/leases$2" 2>/dev/null || echo 000
    }

    # _llm_lease <name> <label key> <engine>: JSON of a new lease held by this process
    _llm_lease() {
      local t; t="$(_llm_now)"
      jq -cn --arg n "$1" --arg k "$2" --arg e "$3" --arg id "$_llm_id" --arg t "$t" --argjson d "$_llm_dur" \
        '{apiVersion:"coordination.k8s.io/v1",kind:"Lease",metadata:{name:$n,labels:{($k):$e}},
          spec:{holderIdentity:$id,leaseDurationSeconds:$d,acquireTime:$t,renewTime:$t}}'
    }

    # jq: is a lease held and not expired? (MicroTime has a fraction that fromdateiso8601 does not read)
    _llm_jq_alive='def alive: (.spec.holderIdentity // "") != "" and
      (((.spec.renewTime // "1970-01-01T00:00:00Z") | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)
       + (.spec.leaseDurationSeconds // 0) > now);'

    # Renews the lease named in $_llm_cur every LLM_SLOT_RENEW_SECONDS while it is still ours.
    _llm_heartbeat() {
      local name code
      _llm_out="$(mktemp)"
      while sleep "$_llm_renew"; do
        name="$(cat "$_llm_cur" 2>/dev/null)"; [ -n "$name" ] || continue
        code="$(_llm_k GET "/$name")"
        [ "$code" = 200 ] || continue
        jq -e --arg id "$_llm_id" '.spec.holderIdentity == $id' "$_llm_out" >/dev/null || continue
        _llm_k PUT "/$name" "$(jq -c --arg t "$(_llm_now)" '.spec.renewTime = $t' "$_llm_out")" >/dev/null
      done
    }

    # _llm_take <engine> <index>: takes slot <index> if it is free or expired; 0 on success
    _llm_take() {
      local name="llm-slot-$1-$2" code
      code="$(_llm_k GET "/$name")"
      if [ "$code" = 404 ]; then
        [ "$(_llm_k POST "" "$(_llm_lease "$name" ai-factory/llm-slot "$1")")" = 201 ] && { _llm_held="$name"; return 0; }
        return 1
      fi
      [ "$code" = 200 ] || return 1
      jq -e "$_llm_jq_alive"' alive' "$_llm_out" >/dev/null && return 1
      # Free or expired: take it over; a 409 means another task was faster (resourceVersion)
      code="$(_llm_k PUT "/$name" "$(jq -c --arg id "$_llm_id" --arg t "$(_llm_now)" --argjson d "$_llm_dur" \
        '.spec.holderIdentity = $id | .spec.leaseDurationSeconds = $d | .spec.acquireTime = $t | .spec.renewTime = $t' "$_llm_out")")"
      [ "$code" = 200 ] && { _llm_held="$name"; return 0; }
      return 1
    }

    llm_slot_acquire() { # <engine> <log>
      local engine="$1" log="$2" var max ticket code list pos free busy i tried waited=0 last_note=0 start
      var="LLM_SLOTS_$(printf '%s' "$engine" | tr '[:lower:]-' '[:upper:]_')"; max="${!var:-0}"
      [ "$max" -gt 0 ] 2>/dev/null || return 0
      _llm_dur="${LLM_SLOT_LEASE_SECONDS:-90}"; _llm_renew="${LLM_SLOT_RENEW_SECONDS:-20}"
      if [ ! -r "$_llm_sa/token" ] || ! command -v jq >/dev/null; then
        echo "LLM slots: no service account token or jq, running ${engine} without a slot" | tee -a "$log"; return 0
      fi
      _llm_ns="$(cat "$_llm_sa/namespace")"; _llm_id="${HOSTNAME:-$(hostname)}-$$"; _llm_out="$(mktemp)"
      _llm_cur="$(mktemp)"
      ticket="llm-q-${engine}-${_llm_id}"
      code="$(_llm_k POST "" "$(_llm_lease "$ticket" ai-factory/llm-queue "$engine")")"
      if [ "$code" != 201 ]; then
        echo "LLM slots: cannot create a queue ticket (HTTP ${code}), running ${engine} without a slot" | tee -a "$log"
        return 0
      fi
      echo "$ticket" > "$_llm_cur"
      _llm_heartbeat & _llm_hb_pid=$!
      trap 'llm_slot_release' EXIT
      start="$(date +%s)"
      while :; do
        # Live tickets of this engine in arrival order; stale ones (dead pods) are skipped and deleted after an hour
        code="$(_llm_k GET "?labelSelector=ai-factory%2Fllm-queue%3D${engine}")"
        if [ "$code" = 200 ]; then
          pos="$(jq -r --arg me "$ticket" "$_llm_jq_alive"' [.items[] | select(alive)] | sort_by(.spec.acquireTime, .metadata.name)
            | map(.metadata.name) | index($me) // 0' "$_llm_out")"
          for t in $(jq -r '.items[] | select((((.spec.renewTime // "1970-01-01T00:00:00Z") | sub("\\.[0-9]+Z$"; "Z")
              | fromdateiso8601) + 3600) < now) | .metadata.name' "$_llm_out"); do _llm_k DELETE "/$t" >/dev/null; done
          code="$(_llm_k GET "?labelSelector=ai-factory%2Fllm-slot%3D${engine}")"
        fi
        if [ "$code" != 200 ]; then
          echo "LLM slots: Kubernetes API answered HTTP ${code}, running ${engine} without a slot" | tee -a "$log"
          llm_slot_release; return 0
        fi
        busy="$(jq -r --argjson max "$max" "$_llm_jq_alive"' [.items[] | select(alive)
          | (.metadata.name | split("-") | last | tonumber? // 999) | select(. < $max)] | join(" ")' "$_llm_out")"
        free=""; for ((i = 0; i < max; i++)); do [[ " $busy " == *" $i "* ]] || free="$free $i"; done
        # Only the first <free slots> tasks in the queue may take one, so nobody overtakes an earlier task
        if [ -n "$free" ] && [ "$pos" -lt "$(wc -w <<< "$free")" ]; then
          tried=0
          for i in $free; do _llm_take "$engine" "$i" && { tried=1; break; }; done
          if [ "$tried" = 1 ]; then
            echo "$_llm_held" > "$_llm_cur"
            _llm_k DELETE "/$ticket" >/dev/null
            waited=$(( $(date +%s) - start ))
            echo "LLM slots: ${engine} slot ${_llm_held##*-} of ${max} taken after ${waited}s in the queue" | tee -a "$log"
            return 0
          fi
        fi
        if [ $(( $(date +%s) - last_note )) -ge 60 ]; then
          last_note="$(date +%s)"
          echo "LLM slots: waiting for ${engine} ($(wc -w <<< "$busy")/${max} busy, ${pos} ahead in the queue, $(( last_note - start ))s so far)" | tee -a "$log"
        fi
        sleep $(( 4 + RANDOM % 4 ))
      done
    }

    llm_slot_release() {
      local name
      [ -n "$_llm_hb_pid" ] && { kill "$_llm_hb_pid" 2>/dev/null; wait "$_llm_hb_pid" 2>/dev/null; _llm_hb_pid=""; }
      name="$(cat "$_llm_cur" 2>/dev/null)"
      if [ -n "$name" ] && [ "$(_llm_k GET "/$name")" = 200 ] \
         && jq -e --arg id "$_llm_id" '.spec.holderIdentity == $id' "$_llm_out" >/dev/null; then
        if [ "$name" = "$_llm_held" ]; then
          # Keep the slot object, only drop the holder (a 409 means it expired and someone took it: nothing to do)
          _llm_k PUT "/$name" "$(jq -c 'del(.spec.holderIdentity)' "$_llm_out")" >/dev/null
        else
          _llm_k DELETE "/$name" >/dev/null
        fi
      fi
      _llm_held=""; [ -n "$_llm_cur" ] && : > "$_llm_cur"
      return 0
    }
  # Puts skills and subagents (fetched by fetch-skills, OpenCode layout) where both engines look for them: agent-home.sh [skills dir]
  agent-home.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    src="${1:-/skills/opencode}"
    mkdir -p "$HOME/.config/opencode" "$HOME/.claude/skills" /workspace/out
    if [ -d "$src" ]; then
      cp -R "$src/." "$HOME/.config/opencode/"
      # Claude Code reads the same SKILL.md format. OpenCode subagents (agents/*.md) use another frontmatter and are not copied.
      if [ -d "$src/skills" ]; then cp -R "$src/skills/." "$HOME/.claude/skills/"; fi
    fi
  # OpenCode permissions for every agent task: no commit, no push, no gh, no web. The model comes from routing.env.
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "opencode-go/deepseek-v4.1-flash",
      "permission": {
        "edit": "allow",
        "skill": "allow",
        "task": "allow",
        "lsp": "allow",
        "webfetch": "deny",
        "external_directory": "allow",
        "bash": {
          "*": "allow",
          "git commit*": "deny",
          "git push*": "deny",
          "gh *": "deny"
        }
      },
      "tools": {
        "todowrite": false
      },
      "provider": {
        "opencode-go": {
          "options": {
            "apiKey": "{env:OPENCODE_API_KEY}"
          }
        }
      }
    }
  # Claude Code permissions, the same rules as opencode.json. Deny rules win over allow rules; in -p mode anything
  # not allowed is refused instead of prompting.
  claude-settings.json: |
    {
      "permissions": {
        "allow": ["Bash", "Read", "Edit", "Write", "Glob", "Grep", "Skill", "Task", "TodoWrite"],
        "deny": [
          "Bash(git commit:*)",
          "Bash(git push:*)",
          "Bash(gh:*)",
          "WebFetch",
          "WebSearch"
        ]
      },
      "env": {
        "DISABLE_AUTOUPDATER": "1",
        "DISABLE_TELEMETRY": "1"
      }
    }
  # Bug issues need a regression test: a new test that fails on the base commit and passes after the change.
  # Source it: is_bug tells from the labels in /workspace/agent-labels whether the issue is a bug; REGRESSION_TEST_RULES
  # is the paragraph for the agent prompt; is_test_path tells a test file from its path. verify-build checks the test.
  regression-test.sh: |
    is_bug() {
      [ -s /workspace/agent-labels ] && grep -qixE '(type[:/ -]*)?(kind/)?bug|defect|regression' /workspace/agent-labels
    }
    is_test_path() {
      printf '%s\n' "$1" | grep -qE '(^|/)(tests?|__tests__|spec|testdata)/|(^|/)test_[^/]*\.py$|_test\.(py|go)$|(Test|Tests|IT)\.(java|kt)$|\.(test|spec)\.[cm]?[jt]sx?$'
    }
    REGRESSION_TEST_RULES="This issue is a bug. Before changing the code, find the root cause and write a regression test that reproduces the bug through the real code path (no mock or fake of the component that breaks). The test must fail on the current code and pass after your fix; run it both ways. Then write .agent-regression-test.txt in the repository root with one line 'command: <shell command, run from the repository root, that runs only the new test(s)>'. The pipeline runs that command on the base commit with your new test files copied in (it must fail) and on your change (it must pass), and removes the file from the commit. It runs in the same environment as the verify build (the verify script's Python virtualenv first on PATH, no Postgres, Redis or MQTT unless the verify script starts them), so the test must run there; prefer a unit-level test of the real code path over one that needs external services."
  # Per-repository verify scripts, used by verify-build when the pipeline gives no verify-command.
  # Key: verify--<owner>--<repo>.sh, lowercase. Run with bash in the repository root; exit 0 means green.
  # A repository without a script keeps the default: `mvn -B -ntp verify` when there is a pom.xml, otherwise nothing.
  verify--majowka--mesh-manager.sh: |
    #!/usr/bin/env bash
    # Majowka/mesh-manager: a small copy of the repository's CI, so that a factory pull request is not red there.
    # Each gate runs only when the change touches its paths (like detect-changes in their workflows); all selected gates
    # run even when one fails, then the script exits 1 with a summary. Results also go to /workspace/out/ci-gates.md
    # (self-review and the pull request description read it).
    #   base-sync      backend/alembic/versions: the change moves onto the newest base branch, so a migration that a
    #                  merged PR added meanwhile shows up here (alembic heads), not as a down_revision fork in CI
    #   guards         always: scripts/ci/check-test-shard-coverage.py and the root guard tests (ci.yml ci-guard-tests:
    #                  workflow guards, generated reference docs drift, db contract manifest)
    #   go             bridge-go/**: go vet (3 variants), golangci-lint v2.15.0 with their .golangci.yml, openwrt build,
    #                  go test -race and go test -tags openwrt (bridge-go.yml)
    #   bridge         bridge/**: flake8 E9/F, Bandit -ll on the production code, bridge/tests/unit (bridge-pipeline.yml,
    #                  security.yml)
    #   alembic        backend/alembic/**, backend/app/models/**, requirements: alembic heads, upgrade head and alembic
    #                  check on TimescaleDB (ci.yml alembic-check), against the shared verify-postgres service
    #   backend        backend/** or frontend/src/services/**: API contract check and the unit shards of
    #                  ci-backend.yml (unit-core, unit-api, unit-services, unit-bridge) on SQLite
    # Not here, left to their CI: real-integration shards, bridge-go integration tests (MQTT), QEMU/OpenWRT, image
    # builds, smoke, frontend. VERIFY_GATES=all runs every gate whatever the change; VERIFY_GATES="go bridge" only
    # those (when the change touches them).
    set -uo pipefail

    OUT="${VERIFY_OUT:-/workspace/out}"
    GATES_MD="${OUT}/ci-gates.md"
    GATE_LOGS="${HOME}/.cache/verify-gates"
    mkdir -p "$GATE_LOGS" "$OUT"
    ROOT="$(pwd)"
    export GOTOOLCHAIN=auto
    SECRET_KEY_CI=f0e1d2c3b4a5968778695a4b3c2d1e0f

    # ---- what changed: against the merge base with the base branch (covers the commits of a PR branch) plus the tree
    upstream="$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null || true)"
    default_ref="$(git symbolic-ref -q --short refs/remotes/origin/HEAD 2>/dev/null || echo origin/develop)"
    if [ -n "$upstream" ] && [ "$(git rev-list --count "${upstream}..HEAD" 2>/dev/null || echo 1)" = 0 ]; then
      base_ref="$upstream"      # issue pipelines: HEAD is the base branch, the change is only in the working tree
    else
      base_ref="$default_ref"   # a pull request branch: compare with the default branch
    fi
    changed() {
      local mb; mb="$(git merge-base HEAD "$base_ref" 2>/dev/null || git rev-parse HEAD)"
      { git diff --name-only "$mb"; git ls-files --others --exclude-standard; } | sort -u
    }
    CHANGED="$(changed)"
    touches() { grep -qE "$1" <<<"$CHANGED"; }
    want() {  # want <gate> <regex>; VERIFY_GATES: "all" runs every gate, a list of names runs only those (when touched)
      [ "${VERIFY_GATES:-}" = all ] && return 0
      if [ -n "${VERIFY_GATES:-}" ] && ! grep -qw -- "$1" <<<"$VERIFY_GATES"; then return 1; fi
      touches "$2"
    }

    declare -a G_NAME G_STATUS G_SECS G_NOTE
    record() { G_NAME+=("$1"); G_STATUS+=("$2"); G_SECS+=("$3"); G_NOTE+=("${4:-}"); }
    # run_gate <name> <function>: output to its own log (shown in full when it fails)
    run_gate() {
      local name="$1" fn="$2" rc=0 start=$SECONDS
      echo "=== gate ${name}: start ==="
      ( "$fn" ) > "${GATE_LOGS}/${name}.log" 2>&1 || rc=$?
      if [ "$rc" -eq 0 ]; then
        tail -n 5 "${GATE_LOGS}/${name}.log"
        record "$name" pass $((SECONDS - start))
      elif [ "$rc" -eq 3 ]; then
        tail -n 5 "${GATE_LOGS}/${name}.log"
        record "$name" warn $((SECONDS - start)) "$(grep -E '^warning:' "${GATE_LOGS}/${name}.log" | tail -n 1 | cut -c1-200)"
      else
        tail -n 80 "${GATE_LOGS}/${name}.log"
        record "$name" FAIL $((SECONDS - start)) "$(grep -vE '^\s*$' "${GATE_LOGS}/${name}.log" | tail -n 1 | cut -c1-160)"
      fi
      echo "=== gate ${name}: $(case "$rc" in 0) echo pass ;; 3) echo warn ;; *) echo FAIL ;; esac) in $((SECONDS - start))s ==="
      return 0
    }
    skip_gate() { record "$1" skip 0 "$2"; echo "=== gate $1: skipped ($2) ==="; }

    # ---- Python environments (uv cache in $HOME on the run workspace)
    backend_venv="${HOME}/.cache/verify-venv/mesh-manager"
    backend_env() {
      uv venv -q --allow-existing -p 3.13 "$backend_venv"
      VIRTUAL_ENV="$backend_venv" uv pip install -q -r "${ROOT}/backend/requirements_ci.txt"
    }

    # ---- gates
    gate_base_sync() {
      # Only when nothing is committed on top of the base branch (issue pipelines); a PR branch gets the heads check
      # on a preview of the merge instead.
      git fetch -q origin "${base_ref#origin/}" || { echo "fetch of ${base_ref} failed, checking the current base"; }
      if [ "$base_ref" = "$upstream" ] && git merge-base --is-ancestor HEAD "$base_ref" && [ "$(git rev-parse HEAD)" != "$(git rev-parse "$base_ref")" ]; then
        local before; before="$(git rev-parse HEAD)"
        echo "Base branch moved: $(git rev-list --count HEAD.."$base_ref") new commit(s) on ${base_ref}; moving the change onto it"
        git stash push -q -u -m verify-base-sync || return 1
        git merge -q --ff-only "$base_ref" || { git stash pop -q; return 1; }
        if ! git stash pop -q; then
          echo "The change conflicts with the newest ${base_ref}; staying on the old base"
          git reset -q --hard "$before" && git clean -qfd && git stash pop -q
          echo "error: rebase the change onto ${base_ref} by hand (conflicting files: see above)"
          return 1
        fi
        echo "Now on $(git rev-parse --short HEAD) (was ${before:0:8})"
      else
        echo "Base is current or this is a pull request branch (base ${base_ref})"
      fi
      local base_tmp all_tmp base_heads all_heads
      base_tmp="$(mktemp -d)"; all_tmp="$(mktemp -d)"
      # Heads of the base alone, and of the base plus the change's migration files
      git archive "$( [ "$base_ref" = "$upstream" ] && echo HEAD || echo "$base_ref")" backend/alembic/versions | tar -x -C "$base_tmp"
      cp -r "$base_tmp/backend" "$all_tmp/"
      cp "${ROOT}"/backend/alembic/versions/*.py "$all_tmp/backend/alembic/versions/"
      base_heads="$(alembic_heads "$base_tmp/backend/alembic/versions")"
      all_heads="$(alembic_heads "$all_tmp/backend/alembic/versions")"
      rm -rf "$base_tmp" "$all_tmp"
      local nb na; nb="$(grep -c . <<<"$base_heads")"; na="$(grep -c . <<<"$all_heads")"
      echo "Alembic heads of ${base_ref}: ${nb} ($(paste -sd ' ' <<<"$base_heads")); with the change: ${na} ($(paste -sd ' ' <<<"$all_heads"))"
      if [ "$na" -gt "$nb" ] || { [ "$nb" -le 1 ] && [ "$na" -ne 1 ]; }; then
        echo "error: the change adds an Alembic head (${nb} -> ${na}): its migration shares a down_revision with a migration on ${base_ref}."
        if [ "$base_ref" = "$upstream" ]; then
          if [ "$nb" -gt 1 ]; then
            echo "Set down_revision of the new migration to one of the heads of ${base_ref} ($(paste -sd ' ' <<<"$base_heads")). The base is already forked (a repository problem, not this change); do not add a merge migration unless the task asks for it."
          else
            echo "Set down_revision of the new migration to the head of ${base_ref}: ${base_heads}."
          fi
        else
          echo "Merge ${base_ref} into this branch (git merge, no force push), then point down_revision of the new migration at its head."
        fi
        return 1
      fi
      if [ "$nb" -gt 1 ]; then
        # Not the change's fault: their CI (test_alembic_single_head, alembic-heads-guard) is red for every PR until a
        # merge migration lands on the base branch
        echo "warning: ${base_ref} itself has ${nb} Alembic heads (a fork already merged there); CI fails on that for every PR. Not caused by this change."
        return 3
      fi
    }

    # alembic_heads <versions dir>: revisions nobody names as down_revision (static, like their test_alembic_single_head)
    alembic_heads() {
      python3 - "$1" <<'PY'
    import ast, sys, pathlib
    revs, parents = set(), set()
    for p in pathlib.Path(sys.argv[1]).glob("*.py"):
        for n in ast.parse(p.read_text()).body:
            t, v = (n.target, n.value) if isinstance(n, ast.AnnAssign) else ((n.targets[0], n.value) if isinstance(n, ast.Assign) else (None, None))
            if not isinstance(t, ast.Name) or v is None: continue
            if t.id == "revision": revs.add(ast.literal_eval(v))
            elif t.id == "down_revision":
                d = ast.literal_eval(v)
                if isinstance(d, str): parents.add(d)
                elif d: parents.update(d)
    for h in sorted(revs - parents): print(h)
    PY
    }

    gate_guards() {
      python3 scripts/ci/check-test-shard-coverage.py --self-test > /dev/null
      python3 scripts/ci/check-test-shard-coverage.py
      local v="${HOME}/.cache/verify-venv/mesh-manager-guards"
      uv venv -q --allow-existing -p 3.13 "$v"
      VIRTUAL_ENV="$v" uv pip install -q pytest==8.3.4 pyyaml==6.0.3 requests==2.32.5 \
        "$(grep -E '^coverage==' backend/requirements_ci.txt)"
      local log="${GATE_LOGS}/guards-pytest.log"
      "$v/bin/python" -m pytest tests/unit scripts/ci -q -rs -p no:cacheprovider 2>&1 | tee "$log" | tail -n 40
      local rc="${PIPESTATUS[0]}" summary; summary="$(tail -n 1 "$log")"
      [ "$rc" -eq 0 ] || return "$rc"
      if grep -q skipped <<<"$summary"; then echo "error: guard tests were skipped (CI fails on skips): $summary"; return 1; fi
    }

    gate_go() {
      cd bridge-go
      go vet ./... && go vet -tags openwrt ./... && go vet -printf.funcs=Info,Debug,Warn,Critical ./... || return 1
      echo "go vet: ok"
      golangci-lint run --timeout=5m || return 1
      CGO_ENABLED=0 go build -tags openwrt -o /dev/null ./cmd/bridge || return 1
      CGO_ENABLED=1 go test -race -count=1 -timeout 300s ./... || return 1
      CGO_ENABLED=0 go test -tags openwrt -count=1 -timeout 300s ./...
    }

    gate_bridge() {
      local v="${HOME}/.cache/verify-venv/mesh-manager-bridge"
      uv venv -q --allow-existing -p 3.11 "$v"
      VIRTUAL_ENV="$v" uv pip install -q -r bridge/requirements-dev.txt flake8 bandit
      local rc=0
      echo "--- flake8 (E9,F63,F7,F82) ---"
      (cd bridge && "$v/bin/flake8" . --count --select=E9,F63,F7,F82 --show-source --statistics) || rc=1
      echo "--- bandit -ll (production code; a '# nosec' must sit on the line Bandit reports) ---"
      "$v/bin/bandit" -q -r bridge -x bridge/tests -ll -f txt 2>/dev/null || rc=1
      echo "--- bridge/tests/unit ---"
      (cd bridge && "$v/bin/python" -m pytest tests/unit/ -q -p no:cacheprovider --no-cov --maxfail=10) || rc=1
      return "$rc"
    }

    gate_alembic() {
      backend_env
      local host="${VERIFY_PG_HOST:-verify-postgres}" db
      db="verify_$(date +%s)_$$"
      local admin="postgresql://mesh_user:${VERIFY_PG_PASSWORD:-mesh_test_pass_secure_2024}@${host}:5432/postgres"
      "$backend_venv/bin/python" - "$admin" "$db" create <<'PY' || { echo "error: no TimescaleDB at the verify-postgres service"; return 1; }
    import sys, time, psycopg
    url, db, op = sys.argv[1:]
    for i in range(30):
        try:
            with psycopg.connect(url, autocommit=True, connect_timeout=5) as c:
                if op == "create": c.execute(f'CREATE DATABASE "{db}"')
                else: c.execute(f'DROP DATABASE IF EXISTS "{db}" WITH (FORCE)')
            break
        except psycopg.OperationalError as e:
            if i == 29: raise
            time.sleep(2)
    PY
      local rc=0
      (
        cd backend
        export DATABASE_URL="postgresql+asyncpg://mesh_user:${VERIFY_PG_PASSWORD:-mesh_test_pass_secure_2024}@${host}:5432/${db}?ssl=disable"
        export DATABASE_URL_SYNC="postgresql+psycopg://mesh_user:${VERIFY_PG_PASSWORD:-mesh_test_pass_secure_2024}@${host}:5432/${db}?sslmode=disable"
        export SECRET_KEY="$SECRET_KEY_CI" ENVIRONMENT=ci
        unset TESTING SKIP_ENV_VALIDATION
        "$backend_venv/bin/alembic" heads && "$backend_venv/bin/alembic" upgrade head && "$backend_venv/bin/alembic" check
      ) || rc=1
      "$backend_venv/bin/python" - "$admin" "$db" drop <<'PY' || true
    import sys, psycopg
    url, db, _ = sys.argv[1:]
    with psycopg.connect(url, autocommit=True, connect_timeout=5) as c:
        c.execute(f'DROP DATABASE IF EXISTS "{db}" WITH (FORCE)')
    PY
      [ "$rc" -eq 0 ] || echo "error: model/migration parity failed (alembic check): add a migration for the model change, or make the models match the migrations"
      return "$rc"
    }

    gate_backend() {
      backend_env
      cd backend
      # No CI markers and no database URL: conftest.py then uses SQLite instead of the CI Postgres service
      unset CI GITHUB_ACTIONS POSTGRES_AVAILABLE DATABASE_URL DATABASE_URL_SYNC
      export TESTING=1 SKIP_ENV_VALIDATION=1 BCRYPT_ROUNDS=4
      local rc=0 deselect=() t nb
      # A base branch that is already forked (several Alembic heads) fails test_alembic_single_head for every change: not
      # this change's fault, so that one test is left out (the base-sync gate checks that the change adds no head)
      t="$(mktemp -d)"
      git -C "$ROOT" archive "$( [ "$base_ref" = "$upstream" ] && echo HEAD || echo "$base_ref")" backend/alembic/versions | tar -x -C "$t"
      nb="$(alembic_heads "$t/backend/alembic/versions" | grep -c .)"; rm -rf "$t"
      if [ "$nb" -gt 1 ]; then
        echo "warning: ${base_ref} has ${nb} Alembic heads (repository problem); test_alembic_single_head left out"
        deselect=(--deselect tests/unit/test_alembic_single_head.py::test_alembic_has_single_head)
      fi
      echo "--- API contract (frontend paths vs backend spec) ---"
      SECRET_KEY="$SECRET_KEY_CI" DATABASE_URL="sqlite+aiosqlite:///:memory:" ENVIRONMENT=ci PYTHONPATH=. \
        "$backend_venv/bin/python" ../scripts/ci/check-api-contract.py || rc=1
      shard() {
        echo "--- ${1} ---"; shift
        rm -f test*.db
        local r=0 s=$SECONDS
        "$backend_venv/bin/python" -m pytest -q --no-header -p no:cacheprovider --timeout=120 --maxfail=5 ${deselect[@]+"${deselect[@]}"} "$@" || r=$?
        echo "--- shard done in $((SECONDS - s))s (exit ${r}) ---"
        # 5 = no tests collected: a branch older than these test paths, not a failure of the change
        [ "$r" -eq 5 ] && r=0
        return "$r"
      }
      shard unit-core \
        tests/core/ tests/unit/core/ tests/unit/models/ tests/unit/middleware/ tests/unit/schemas/ tests/unit/scripts/ \
        tests/regression/ tests/unit/test_celery_schedule_guard.py tests/unit/test_compose_celery_module_guard.py \
        tests/unit/test_compose_uat_db_pool.py tests/unit/test_main_smoke.py tests/unit/test_pagination_gh4091.py \
        tests/unit/test_pytest_configuration.py tests/unit/test_release_please_extra_files_guard.py \
        tests/unit/test_root_docker_compose_config.py tests/unit/test_security_logging_rate_limit.py \
        tests/unit/test_security_blocks.py tests/unit/test_alembic_single_head.py \
        tests/unit/test_add_alert_type_column_migration.py tests/unit/test_add_system_logs_timestamps_migration.py \
        tests/unit/test_drop_v1_update_tables_migration.py tests/unit/test_gh3171_mqtt_username_partial_unique_migration.py \
        tests/unit/test_gh4193_backfill_cancelled_commands_migration.py \
        tests/unit/test_rename_bridge_logs_metadata_migration.py tests/unit/test_nginx_v2_websocket_proxy.py || rc=1
      shard unit-api tests/unit/api/ tests/unit/tasks/ tests/unit/test_v2_surface.py || rc=1
      shard unit-services tests/services/ tests/unit/services/ tests/unit/test_mosquitto_logging_config.py tests/unit/test_user_service.py || rc=1
      # Its own run: together with the other shards, tests/unit/bridge shadows the repository's bridge package
      shard unit-bridge tests/unit/bridge/ tests/unit/test_issue_6052_bridge_logs_and_tasks.py tests/unit/test_mirror_helper.py || rc=1
      rm -f test*.db
      if [ "$rc" -eq 0 ] && [ "${#deselect[@]}" -gt 0 ]; then return 3; fi
      return "$rc"
    }

    # ---- run
    echo "=== changed files: $(grep -c . <<<"$CHANGED") (base ${base_ref}) ==="
    if want base-sync '^backend/alembic/versions/'; then run_gate base-sync gate_base_sync; CHANGED="$(changed)"; else skip_gate base-sync "no new migration"; fi
    if want guards .; then run_gate guards gate_guards; else skip_gate guards "not selected"; fi
    if want go '^bridge-go/'; then run_gate go gate_go; else skip_gate go "no change in bridge-go/"; fi
    if want bridge '^bridge/'; then run_gate bridge gate_bridge; else skip_gate bridge "no change in bridge/"; fi
    if want alembic '^backend/(alembic/|app/models/|app/core/database|requirements)'; then run_gate alembic gate_alembic; else skip_gate alembic "no migration or model change"; fi
    if want backend '^backend/|^frontend/src/services/'; then run_gate backend gate_backend; else skip_gate backend "no change in backend/"; fi

    # ---- summary (stdout and ci-gates.md)
    failed=0
    {
      printf '| Gate | Result | Time | Note |\n|---|---|---|---|\n'
      for i in "${!G_NAME[@]}"; do
        case "${G_STATUS[$i]}" in pass) icon=':white_check_mark: pass' ;; warn) icon=':warning: repo problem' ;; FAIL) icon=':x: fail'; failed=1 ;; *) icon=':heavy_minus_sign: skipped' ;; esac
        printf '| %s | %s | %ss | %s |\n' "${G_NAME[$i]}" "$icon" "${G_SECS[$i]}" "$(printf '%s' "${G_NOTE[$i]}" | tr '|' '/')"
      done
      printf '\nNot run here (left to the repository CI): real-integration shards, bridge-go integration (MQTT), QEMU/OpenWRT, image builds, smoke, frontend.\n'
    } > "$GATES_MD"
    echo "=== CI gates summary ==="
    cat "$GATES_MD"
    exit "$failed"
  # Automated review (`@ai review`, pr-review-agent). REVIEW_APPROVE_REPOS: space-separated owner/repo list where the review
  # may APPROVE a pull request (verdict approve, no blocker or major remark, no failed check). Empty by default: with
  # branch protection that counts the App's approval, the factory could otherwise unblock the merge of its own code.
  # Blockers always request changes; everything else is a comment.
  review.env: |
    REVIEW_APPROVE_REPOS=""
  # Posts the review of pr-review-agent (publish step): review-publish.sh. Reads /workspace/out/review.md (report) and
  # /workspace/out/review.json (verdict and findings of the code-review skill), pr.diff, head-sha, ci-failures.md.
  # One GitHub review: inline comments on the diff lines of the findings (the others go to the body), REQUEST_CHANGES with
  # a blocker, APPROVE only where review.env allows it and all checks are green right now, else COMMENT. Falls back to a comment / no inline comments when
  # GitHub refuses (no verdict on the App's own PR, a line outside the diff), as a last resort to a plain PR comment. Then supersedes the earlier factory reviews
  # of the PR: dismisses their verdict, folds their body and hides their inline comments as outdated. Needs GH_TOKEN.
  review-publish.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    w="${REVIEW_WORKDIR:-/workspace}"
    cfg="${REVIEW_CONFIG:-/config/review.env}"
    REVIEW_APPROVE_REPOS=""
    # shellcheck disable=SC1090
    [ -f "$cfg" ] && . "$cfg"
    HEAD="$(cat "$w/head-sha")"
    ENGINE="$(cat "$w/review-engine" 2>/dev/null || true)"; ENGINE="${ENGINE:-unknown}"
    MARKER='<!-- factory:review -->'

    # Lines of the head version a comment can sit on: added and context lines of the hunks of pr.diff ("path<TAB>line")
    awk '
      /^diff --git / { path = ""; inhunk = 0; next }
      !inhunk && /^\+\+\+ / { p = substr($0, 5); if (p == "/dev/null") path = ""; else { sub(/^b\//, "", p); path = p }; next }
      !inhunk && /^@@ / {
        if (match($0, /^@@ -[0-9]+(,[0-9]+)? \+[0-9]+(,[0-9]+)? @@/)) {
          split(substr($0, 4, RLENGTH - 6), parts, " ")
          o = substr(parts[1], 2); n = substr(parts[2], 2)
          oldleft = (index(o, ",") ? substr(o, index(o, ",") + 1) : 1) + 0
          newline = (index(n, ",") ? substr(n, 1, index(n, ",") - 1) : n) + 0
          newleft = (index(n, ",") ? substr(n, index(n, ",") + 1) : 1) + 0
          inhunk = (oldleft > 0 || newleft > 0)
        }
        next
      }
      inhunk {
        c = substr($0, 1, 1)
        if (c == "\\") next
        if (c == "-") oldleft--
        else { if (path != "") print path "\t" newline; newline++; newleft--; if (c != "+") oldleft-- }
        if (oldleft <= 0 && newleft <= 0) inhunk = 0
      }' "$w/pr.diff" | jq -R 'split("\t") | {(.[0] + ":" + .[1]): true}' | jq -s 'add // {}' > "$w/diff-lines.json"

    # Structured findings of the agent. Missing or invalid: the report is posted as it is, as a comment.
    # Every finding must be complete: one broken entry (e.g. a blocker without text) would otherwise vanish from the review.
    if jq -e '(.findings | type == "array") and (.verdict | type == "string")
        and all(.findings[]; type == "object"
          and ((.body // .message) | type == "string" and length > 0)
          and ((.path // .file) | type == "string")
          and ((.severity // "") | ascii_downcase | IN("blocker", "major", "minor"))
          and ((.line // 0) | type == "number" or (type == "string" and test("^[0-9]+$"))))' "$w/out/review.json" >/dev/null 2>&1; then
      jq --slurpfile lines "$w/diff-lines.json" '
        {verdict: (.verdict | ascii_downcase | gsub("[ -]"; "_")),
         findings: [.findings[]
           | {severity: (.severity | ascii_downcase),
              path: ((.path // .file // "") | tostring | sub("^(\\./|b/)"; "")),
              line: ((.line // 0) | tonumber? // 0),
              body: (.body // .message)}
           | .inline = ($lines[0][(.path + ":" + (.line | tostring))] == true)]}' "$w/out/review.json" > "$w/findings.json"
      STRUCTURED=1
    else
      echo "Missing or invalid /workspace/out/review.json: posting the report as it is, without inline comments"
      echo '{"verdict":"comment","findings":[]}' > "$w/findings.json"
      STRUCTURED=0
    fi
    BLOCKERS="$(jq '[.findings[] | select(.severity == "blocker")] | length' "$w/findings.json")"
    MAJORS="$(jq '[.findings[] | select(.severity == "major")] | length' "$w/findings.json")"
    VERDICT="$(jq -r .verdict "$w/findings.json")"
    INLINE="$(jq '[.findings[] | select(.inline)] | length' "$w/findings.json")"
    echo "Findings: $(jq '.findings | length' "$w/findings.json") (blocker ${BLOCKERS}, major ${MAJORS}), ${INLINE} on diff lines, verdict ${VERDICT}"

    # Event: blockers request changes; approve only where the repository allows it, with no blocker or major remark and no failed check
    EVENT=COMMENT
    if [ "$BLOCKERS" -gt 0 ]; then
      EVENT=REQUEST_CHANGES
    elif [ "$VERDICT" = "approve" ] && [ "$MAJORS" -eq 0 ] && [ ! -s "$w/ci-failures.md" ] \
      && printf ' %s ' $REVIEW_APPROVE_REPOS | grep -qiF " ${REPO_FULL_NAME} "; then
      # ci-failures.md is a snapshot from before the review: ask again now. Approve only when every check of the commit has
      # completed without failing and the queries worked; anything else (running, failed, API error) stays a comment.
      if runs="$(gh api --paginate "repos/${REPO_FULL_NAME}/commits/${HEAD}/check-runs?per_page=100" --jq '.check_runs[]' | jq -s .)" \
        && combined="$(gh api "repos/${REPO_FULL_NAME}/commits/${HEAD}/status" --jq .state)" \
        && [ "$(jq '[group_by(.name)[] | max_by(.started_at // "") | select(.status != "completed" or (.conclusion | IN("success", "neutral", "skipped") | not))] | length' <<<"$runs")" -eq 0 ] \
        && { [ "$combined" = success ] || [ "$(gh api "repos/${REPO_FULL_NAME}/commits/${HEAD}/status" --jq '.statuses | length')" = 0 ]; }; then
        EVENT=APPROVE
      else
        echo "Checks of ${HEAD} are not all green (or could not be read): no approval, posting a comment"
      fi
    fi

    # Body: the report without its Remarks section (they come from findings.json), then the remarks not on a diff line
    build_body() { # $1 event, $2 1 = inline comments are posted
      local event="$1" inline="$2" effect
      case "$event" in
        REQUEST_CHANGES) effect="This review **requests changes**: it found ${BLOCKERS} blocker(s)." ;;
        APPROVE) effect="This review **approves** the pull request (enabled for this repository)." ;;
        *) if [ "$BLOCKERS" -gt 0 ]; then effect="It found ${BLOCKERS} blocker(s), but GitHub did not accept a review requesting changes here (for example on a pull request of the factory itself), so it is a comment."
           else effect="This review neither approves nor blocks the pull request."; fi ;;
      esac
      printf '%s\n## Automated review\n\n' "$MARKER"
      printf '_Requested by @%s. Commit %s, reviewed by %s. Read-only: the factory changed nothing on this branch._ %s\n\n' \
        "$COMMENT_AUTHOR" "$HEAD" "$ENGINE" "$effect"
      if [ "$STRUCTURED" = 1 ]; then
        awk '/^#+[[:space:]]+Remarks[[:space:]]*$/ { skip = 1; next } skip && /^#+[[:space:]]/ { skip = 0 } !skip' "$w/out/review.md" | head -c 50000
        printf '\n### Remarks\n'
        jq -r --argjson inline "$inline" '
          .findings as $f
          | ($f | map(select(.inline and $inline == 1)) | length) as $n
          | ($f | map(select((.inline and $inline == 1) | not))) as $rest
          | (if $n > 0 then "\($n) remark(s) are inline comments on the diff.\n" else "" end)
            + (if ($rest | length) > 0 then
                 ($rest | to_entries | map("\(.key + 1). **\(.value.severity)** `\(.value.path):\(.value.line)`: \(.value.body)") | join("\n")) + "\n"
               elif $n == 0 then "_No remarks._\n" else "" end)' "$w/findings.json" | head -c 15000
      else
        head -c 60000 "$w/out/review.md"
      fi
    }
    comments_json() {
      jq '[.findings[] | select(.inline) | {path, line, side: "RIGHT", body: "**\(.severity)**: \(.body)"}]' "$w/findings.json"
    }
    post_review() { # $1 event, $2 inline 1/0
      build_body "$1" "$2" > "$w/review-body.md"
      if [ "$2" = 1 ]; then comments_json; else echo '[]'; fi > "$w/review-comments.json"
      jq -n --arg sha "$HEAD" --arg event "$1" --rawfile body "$w/review-body.md" --slurpfile c "$w/review-comments.json" \
        '{commit_id: $sha, event: $event, body: $body} + (if ($c[0] | length) > 0 then {comments: $c[0]} else {} end)' \
        | gh api -X POST "repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}/reviews" --input - > "$w/review-posted.json"
    }

    # GitHub refuses to approve or request changes on a pull request of the App itself (factory PRs), and a line it does
    # not accept fails the whole review: fall back to a comment, then to a review without inline comments.
    POSTED=""
    for attempt in "${EVENT} 1" "COMMENT 1" "${EVENT} 0" "COMMENT 0"; do
      case " ${POSTED_TRIED:-} " in *" ${attempt/ /:} "*) continue ;; esac
      POSTED_TRIED="${POSTED_TRIED:-} ${attempt/ /:}"
      if post_review ${attempt}; then POSTED="$attempt"; break; fi
      echo "Review refused (event ${attempt% *}, inline comments ${attempt#* }); trying the next fallback"
    done
    if [ -z "$POSTED" ]; then
      # Last resort: the report as a plain PR comment. Older reviews stay as they are.
      echo "GitHub refused every form of the review; posting the report as a PR comment"
      build_body COMMENT 0 > "$w/review-body.md"
      jq -n --rawfile body "$w/review-body.md" '{body: $body}' \
        | gh api -X POST "repos/${REPO_FULL_NAME}/issues/${PR_NUMBER}/comments" --input - --jq .html_url
      exit 0
    fi
    EVENT="${POSTED% *}"
    URL="$(jq -r .html_url "$w/review-posted.json")"
    NEW_ID="$(jq -r .id "$w/review-posted.json")"
    echo "Posted ${EVENT} review: ${URL}"

    # Earlier reviews of the factory on this pull request, listed after posting so that an overlapping run is seen too
    gh api --paginate "repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}/reviews?per_page=100" \
      --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"${MARKER}\"))) | {id, state, body}" \
      | jq -s --argjson new "$NEW_ID" '[.[] | select(.id < $new)]' > "$w/old-reviews.json" \
      || { echo "Could not list earlier reviews; nothing superseded"; echo '[]' > "$w/old-reviews.json"; }

    # Supersede the older reviews: dismiss a verdict, fold the body, hide its inline comments as outdated
    jq -c '.[]' "$w/old-reviews.json" | while IFS= read -r old; do
      id="$(jq -r .id <<<"$old")"; state="$(jq -r .state <<<"$old")"
      if [ "$state" = CHANGES_REQUESTED ] || [ "$state" = APPROVED ]; then
        # Keep the marker of a review whose verdict could not be dismissed (e.g. branch protection restricts dismissals),
        # so the next run finds it and tries again.
        gh api -X PUT "repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}/reviews/${id}/dismissals" \
          -f message="Superseded by a newer automated review: ${URL}" -f event=DISMISS >/dev/null \
          || { echo "Could not dismiss review ${id}; left as it is"; continue; }
      fi
      # Hide its inline comments first; the body keeps the marker until that worked, so a later run retries the rest
      done_ok=1
      nodes="$(gh api --paginate "repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}/reviews/${id}/comments?per_page=100" --jq '.[].node_id')" \
        || { nodes=""; done_ok=0; echo "Could not list the comments of review ${id}"; }
      for node in $nodes; do
        gh api graphql -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { clientMutationId } }' \
          -f id="$node" >/dev/null || { done_ok=0; echo "Could not hide comment ${node}"; }
      done
      if [ "$done_ok" != 1 ]; then echo "Review ${id} only partly superseded; the next run retries"; continue; fi
      jq -r --arg url "$URL" --arg m "$MARKER" \
        '"<!-- factory:review-superseded -->\n_Superseded by [a newer automated review](\($url))._\n\n<details><summary>Previous review</summary>\n\n" + (.body | gsub($m; "")) + "\n</details>\n"' \
        <<<"$old" > "$w/old-body.md"
      jq -n --rawfile body "$w/old-body.md" '{body: $body}' \
        | gh api -X PUT "repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}/reviews/${id}" --input - >/dev/null \
        || { echo "Could not update review ${id}"; continue; }
      echo "Superseded review ${id} (${state})"
    done
  # Failed CI checks of one commit with the tail of each log, as Markdown: ci-failures.sh <owner/repo> <sha> <output file>.
  # Needs GH_TOKEN of the GitHub App with Checks: read (check runs), Actions: read (job logs of GitHub Actions) and Commit statuses: read.
  # Missing permissions only make the report shorter: the script never fails the step. An empty file means nothing failed.
  # CI_WAIT_SECONDS > 0: first wait (up to that long) until no check of the commit is queued or running.
  ci-failures.sh: |
    #!/usr/bin/env bash
    set -uo pipefail
    repo="$1"; sha="$2"; out="$3"; lines="${CI_LOG_LINES:-150}"; max_bytes="${CI_REPORT_MAX_BYTES:-60000}"; wait_s="${CI_WAIT_SECONDS:-0}"
    : > "$out"
    known="/config/ci-known--$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]' | sed 's|/|--|').txt"
    list_runs() { gh api --paginate "repos/${repo}/commits/${sha}/check-runs?per_page=100" --jq '.check_runs[]' 2>/dev/null | jq -s '.'; }
    runs="$(list_runs)" || { echo "Cannot list check runs of ${sha} (GitHub App needs Checks: read)"; exit 0; }
    while [ "$wait_s" -gt 0 ] && [ "$(printf '%s' "$runs" | jq '[.[] | select(.status != "completed")] | length')" -gt 0 ]; do
      echo "Waiting for running checks of ${sha} (${wait_s}s left)"
      sleep 30; wait_s=$((wait_s - 30))
      runs="$(list_runs)" || exit 0
    done
    # Latest run per check name (a re-run that passed hides the older failure), only the failed ones
    failed="$(printf '%s' "$runs" | jq -c '[group_by(.name)[] | max_by(.started_at // "") | select(.status == "completed" and (.conclusion | IN("failure", "timed_out", "action_required", "startup_failure")))] | .[]')"
    statuses="$(gh api "repos/${repo}/commits/${sha}/status" --jq '.statuses[] | select(.state == "failure" or .state == "error") | "- **\(.context)**: \(.state), \(.description // "") \(.target_url // "")"' 2>/dev/null || true)"
    [ -n "$failed" ] || [ -n "$statuses" ] || exit 0
    {
      printf 'Failed checks of commit %s:\n' "$sha"
      while IFS= read -r run; do
        [ -n "$run" ] || continue
        id="$(jq -r .id <<<"$run")"
        printf '\n### %s: %s (%s)\n%s\n' "$(jq -r .name <<<"$run")" "$(jq -r .conclusion <<<"$run")" "$(jq -r '.app.slug // "?"' <<<"$run")" "$(jq -r '.html_url // ""' <<<"$run")"
        jq -r '[.output.title, .output.summary] | map(select(. != null and . != "")) | join("\n")' <<<"$run" | head -c 4000
        gh api "repos/${repo}/check-runs/${id}/annotations?per_page=50" \
          --jq '.[] | "- \(.annotation_level) \(.path):\(.start_line): \(.title // "") \(.message)"' 2>/dev/null | head -n 50 || true
        if [ "$(jq -r '.app.slug // ""' <<<"$run")" = "github-actions" ]; then
          # For GitHub Actions the check run id is the job id. Timestamps and colour codes are noise for the agent.
          log="$(gh api "repos/${repo}/actions/jobs/${id}/logs" 2>/dev/null \
            | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ?//; s/\x1b\[[0-9;]*[A-Za-z]//g' | tail -n "$lines")" \
            || log="(log not available: the GitHub App needs Actions: read)"
        else
          log="$(jq -r '.output.text // ""' <<<"$run" | tail -n "$lines")"
        fi
        # Known failures of the repository's own CI (ci-known--<owner>--<repo>.txt): say so, so nobody changes code for them
        if [ -f "$known" ]; then
          while IFS=$'\t' read -r pat why; do
            case "$pat" in ''|'#'*) continue ;; esac
            if printf '%s\n%s\n' "$(jq -r .name <<<"$run")" "$log" | grep -qiE -- "$pat"; then
              printf '\n> [!NOTE]\n> Known problem of the repository CI, most likely not caused by this change: %s Do not change code for it; mention it in the reply.\n' "$why"
            fi
          done < "$known"
        fi
        if [ -n "$log" ]; then printf '\nLast lines of the log:\n~~~~text\n%s\n~~~~\n' "$log"; fi
      done <<<"$failed"
      if [ -n "$statuses" ]; then printf '\n### Commit statuses\n%s\n' "$statuses"; fi
    } | head -c "$max_bytes" > "$out"
    echo "CI failures of ${sha}: $(grep -c '^### ' "$out") section(s), $(wc -c < "$out") bytes"
  # Known failures of a repository's own CI, read by ci-failures.sh: one '<extended regex><TAB><explanation>' per line,
  # matched (case-insensitive) against the check name and the tail of its log. Key: ci-known--<owner>--<repo>.txt.
  ci-known--majowka--mesh-manager.txt: |
    # A PR that changes deployment/ci/Dockerfile.mosquitto-ci builds the image but never pushes it, so the service tag it asks for does not exist
    mosquitto-ci.*(manifest unknown|not found|pull access denied|failed to resolve)	The mosquitto-ci service image tag of this PR was never pushed (PR builds do not push it; happens when deployment/ci/Dockerfile.mosquitto-ci changes). A maintainer has to push the image or re-run after merge.
    # real-integration-2 sometimes ends without its JUnit file
    (junit[^ ]*\.xml.*(not found|no such file|does not exist)|no test report files were found|unable to find.*junit)	The real-integration shard ended without writing its JUnit report (flaky in real-integration-2). Re-run the job.
  # Helpers shared by the requirements scan (CronJob) and the requirements-agent pipeline. Source it; it needs GH_TOKEN and REPO_FULL_NAME.
  requirements-lib.sh: |
    # sha256 of the requirements text: a different value means the issue was edited
    req_hash() { printf '%s\n%s' "$1" "$2" | sha256sum | cut -d' ' -f1; }

    # State of requirements issue $1 as {comment_id, state}. It lives in a comment of the bot, state is {} when there is none.
    req_state() {
      local comment encoded
      comment="$(gh api --paginate "repos/${REPO_FULL_NAME}/issues/$1/comments" \
        --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- requirements-state:"))) | {id, body}' | jq -s 'last // empty')"
      if [ -z "$comment" ]; then echo '{"comment_id":null,"state":{}}'; return; fi
      encoded="$(jq -r .body <<<"$comment" | sed -n 's|.*<!-- requirements-state:\([A-Za-z0-9+/=]*\) -->.*|\1|p' | head -n1)"
      jq -n --argjson id "$(jq .id <<<"$comment")" --argjson state "$(printf '%s' "$encoded" | base64 -d | gunzip)" '{comment_id: $id, state: $state}'
    }

    # Tasks already created for requirements issue $1 (label req-<n>, marker in the body): [{id, number, title, state}], state is OPEN or CLOSED
    req_children() {
      gh issue list --repo "$REPO_FULL_NAME" --label "req-$1" --state all --limit 200 --json number,title,state,body \
        | jq --arg n "$1" '[.[] | (.body | capture("<!-- requirements:" + $n + ":(?<id>[a-z0-9-]+) -->")?) as $m | select($m) | {id: $m.id, number, title, state}]'
    }
