apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: agents
data:
  # Prints a GitHub App installation token (valid 1h). Run it right before every step that talks to GitHub.
  gh-app-token.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
    now="$(date +%s)"
    header="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
    payload="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$GITHUB_APP_ID" | b64url)"
    signature="$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign <(printf '%s\n' "$GITHUB_APP_PRIVATE_KEY") | b64url)"
    curl -fsS -X POST \
      -H "Authorization: Bearer ${header}.${payload}.${signature}" \
      -H "Accept: application/vnd.github+json" \
      "https://api.github.com/app/installations/${GITHUB_APP_INSTALLATION_ID}/access_tokens" | jq -er .token
  # Build and test the working tree after the agent step. When the build fails, the agent gets the log and fixes it
  # (up to MAX_FIX_ATTEMPTS times, within VERIFY_BUDGET_MINUTES). It never fails the step: the outcome is written to
  # /workspace/out/verify-note.md (always) and /workspace/out/verify-failed (only when the build stays red).
  verify.sh: |
    #!/usr/bin/env bash
    set -uo pipefail

    OUT=/workspace/out
    LOG=/workspace/verify.log
    MAX_FIX_ATTEMPTS="${MAX_FIX_ATTEMPTS:-3}"
    BUDGET_MINUTES="${VERIFY_BUDGET_MINUTES:-45}"
    rm -f "$OUT/verify-note.md" "$OUT/verify-failed"

    if [ -f /workspace/skip ]; then echo "Nothing to do"; exit 0; fi
    if [ -z "$(git status --porcelain -uall -- . ':(exclude)**/target/**')" ]; then
      echo "No changes, nothing to verify"; exit 0
    fi

    cmd="${VERIFY_COMMAND:-}"
    if [ -z "$cmd" ]; then
      if [ -f pom.xml ]; then cmd="mvn -B -ntp verify"; else echo "No build detected, skipping verification"; exit 0; fi
    fi
    if [ "$cmd" = "skip" ]; then echo "Verification disabled"; exit 0; fi

    deadline=$(( $(date +%s) + BUDGET_MINUTES * 60 ))
    attempt=0
    while true; do
      echo "=== Verify: ${cmd} (fix attempts used: ${attempt}/${MAX_FIX_ATTEMPTS}) ==="
      if timeout 20m bash -c "$cmd" > "$LOG" 2>&1; then
        tail -n 20 "$LOG"
        suffix=""
        if [ "$attempt" -gt 0 ]; then suffix=" after ${attempt} fix attempt(s)"; fi
        printf ':white_check_mark: Build verification passed (`%s`)%s.\n' "$cmd" "$suffix" > "$OUT/verify-note.md"
        exit 0
      fi
      tail -n 100 "$LOG"
      if [ "$attempt" -ge "$MAX_FIX_ATTEMPTS" ] || [ "$(date +%s)" -ge "$deadline" ]; then break; fi

      attempt=$((attempt + 1))
      echo "=== Build failed, asking the agent to fix it (attempt ${attempt}) ==="
      PROMPT="The build and tests of this repository fail after your changes. Fix the code so that this command passes: ${cmd}

    Keep the change minimal. Do not delete or weaken tests just to make them pass. You may run the command yourself to check. The pipeline handles git and GitHub; do not write .agent-summary.md.

    Last lines of the output:
    $(tail -n 150 "$LOG")"
      timeout 15m opencode run "$PROMPT" 2>&1 | tee -a /workspace/opencode.log \
        || echo "opencode exited with $? (timeout or error); continuing"
      rm -f .agent-summary.md
    done

    {
      printf ':warning: **Build verification failed** (`%s`) after %s fix attempt(s). Review the code before merging.\n\n' "$cmd" "$attempt"
      printf '<details><summary>Last lines of the build log</summary>\n\n```\n'
      tail -n 40 "$LOG"
      printf '```\n\n</details>\n'
    } > "$OUT/verify-note.md"
    cp "$OUT/verify-note.md" "$OUT/verify-failed"
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "qwen38-flash/qwen38_flash",
      "permission": {
        "edit": "allow",
        "skill": "allow",
        "task": "allow",
        "webfetch": "deny",
        "external_directory": "allow",
        "bash": {
          "*": "allow",
          "git commit*": "deny",
          "git push*": "deny",
          "gh *": "deny"
        }
      },
      "tools": {
        "todowrite": false
      },
      "provider": {
        "qwen38-flash": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Qwen3.8 Flash",
          "options": {
            "baseURL": "http://qwen38-flash.ai.svc.cluster.local:8000/v1",
            "apiKey": "none"
          },
          "models": {
            "qwen38_flash": {
              "name": "Qwen3.8 Flash",
              "limit": {
                "context": 131072,
                "output": 8192
              }
            }
          }
        }
      }
    }
  # Used by the plan steps only: same as opencode.json, but the agent may post its plan with `gh issue comment` / `gh pr comment`.
  opencode-plan.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "qwen38-flash/qwen38_flash",
      "permission": {
        "edit": "allow",
        "skill": "allow",
        "task": "allow",
        "webfetch": "deny",
        "external_directory": "allow",
        "bash": {
          "*": "allow",
          "git commit*": "deny",
          "git push*": "deny",
          "gh *": "deny",
          "gh issue comment*": "allow",
          "gh pr comment*": "allow"
        }
      },
      "tools": {
        "todowrite": false
      },
      "provider": {
        "qwen38-flash": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Qwen3.8 Flash",
          "options": {
            "baseURL": "http://qwen38-flash.ai.svc.cluster.local:8000/v1",
            "apiKey": "none"
          },
          "models": {
            "qwen38_flash": {
              "name": "Qwen3.8 Flash",
              "limit": {
                "context": 131072,
                "output": 8192
              }
            }
          }
        }
      }
    }
