apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: agents
data:
  # Prints a GitHub App installation token (valid 1h). Run it right before every step that talks to GitHub.
  gh-app-token.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
    # Rebuild the PEM with 64-character lines: OpenSSL 3 rejects a key stored on one line (spaces or literal \n
    # instead of line breaks), which is how a secret store may hand it over.
    pem_normalize() {
      local kind body
      kind="$(printf '%s' "$1" | sed -nE 's/.*-----BEGIN ([A-Z ]+)-----.*/\1/p' | head -n 1)"
      body="$(printf '%s' "$1" | sed -E 's/\\n/ /g; s/-----(BEGIN|END) [A-Z ]+-----//g' | tr -d ' \t\r\n')"
      printf -- '-----BEGIN %s-----\n%s\n-----END %s-----\n' "$kind" "$(printf '%s' "$body" | fold -w 64)" "$kind"
    }
    now="$(date +%s)"
    header="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
    payload="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$GITHUB_APP_ID" | b64url)"
    signature="$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign <(pem_normalize "$GITHUB_APP_PRIVATE_KEY") | b64url)"
    curl -fsS -X POST \
      -H "Authorization: Bearer ${header}.${payload}.${signature}" \
      -H "Accept: application/vnd.github+json" \
      "https://api.github.com/app/installations/${GITHUB_APP_INSTALLATION_ID}/access_tokens" | jq -er .token
  # Which engine runs which agent task. Change it here and apply the ConfigMap; the next run picks it up.
  # A label on the issue / PR overrides it for that issue: engine:claude, engine:opencode, engine-implement:opencode, ...
  # Tasks: PLAN (plan steps of all three event pipelines), IMPLEMENT (agent steps), FIX (build-fix attempts in
  # verify-build), REQUIREMENTS (requirements-agent analysis). Values: opencode | claude.
  routing.env: |
    AGENT_ENGINE_DEFAULT=opencode
    AGENT_ENGINE_PLAN=opencode
    # Until the Claude Code token is in place every task runs on OpenCode; set IMPLEMENT and FIX back to claude then.
    AGENT_ENGINE_IMPLEMENT=opencode
    AGENT_ENGINE_FIX=opencode
    AGENT_ENGINE_REQUIREMENTS=opencode
    # Models per engine. OpenCode: provider/model (OpenCode Go: opencode-go/<model-id>, list with
    # curl -H "Authorization: Bearer $OPENCODE_API_KEY" https://opencode.ai/inference/go/v1/models).
    # Claude Code: an alias (sonnet, opus, haiku) or a full model id. Per-task overrides: OPENCODE_MODEL_<TASK>, CLAUDE_MODEL_<TASK>.
    OPENCODE_MODEL=opencode-go/deepseek-v4.1-flash
    CLAUDE_MODEL=sonnet
    CLAUDE_MODEL_PLAN=opus
  # Runs one agent task with the engine chosen in routing.env: agent-run.sh <task> <timeout> <log file> <prompt>.
  # Returns the engine's exit code (124 on timeout). Credentials come from the environment of the step:
  # OPENCODE_API_KEY (secret opencode-go) and CLAUDE_CODE_OAUTH_TOKEN (secret claude-code-oauth).
  agent-run.sh: |
    #!/usr/bin/env bash
    set -uo pipefail
    task="$(printf '%s' "$1" | tr '[:lower:]-' '[:upper:]_')"; limit="$2"; log="$3"; prompt="$4"
    set -a; source /config/routing.env; set +a
    pick() { local v="${1}_${task}"; if [ -n "${!v:-}" ]; then printf '%s' "${!v}"; else v="$1"; printf '%s' "${!v:-$2}"; fi; }
    engine="$(pick AGENT_ENGINE "${AGENT_ENGINE_DEFAULT:-opencode}")"
    # GitHub labels of the issue / PR (written by the prepare steps) win over routing.env:
    # engine-<task>:<engine> for one task (e.g. engine-implement:opencode), engine:<engine> for all tasks.
    if [ -s /workspace/agent-labels ]; then
      t="$(printf '%s' "$task" | tr '[:upper:]_' '[:lower:]-')"
      label="$(grep -xE "engine-${t}:(opencode|claude)" /workspace/agent-labels | head -n1 || true)"
      [ -n "$label" ] || label="$(grep -xE 'engine:(opencode|claude)' /workspace/agent-labels | head -n1 || true)"
      if [ -n "$label" ]; then engine="${label#*:}"; echo "Engine from label ${label}" | tee -a "$log"; fi
    fi
    mkdir -p "$(dirname "$log")"
    case "$engine" in
      opencode)
        model="$(pick OPENCODE_MODEL '')"
        echo "=== ${task}: opencode ${model} ===" | tee -a "$log"
        OPENCODE_CONFIG=/config/opencode.json timeout "$limit" opencode run ${model:+-m "$model"} "$prompt" 2>&1 | tee -a "$log"
        rc=${PIPESTATUS[0]} ;;
      claude)
        model="$(pick CLAUDE_MODEL sonnet)"
        echo "=== ${task}: claude ${model} ===" | tee -a "$log"
        timeout "$limit" claude -p "$prompt" --model "$model" --settings /config/claude-settings.json \
          --output-format text 2>&1 | tee -a "$log"
        rc=${PIPESTATUS[0]} ;;
      *)
        echo "Unknown engine '${engine}' for task ${task} (routing.env)" | tee -a "$log"; rc=2 ;;
    esac
    [ "$rc" -eq 0 ] || echo "${engine} exited with ${rc} (timeout or error)" | tee -a "$log"
    exit "$rc"
  # Puts skills and subagents (fetched by fetch-skills, OpenCode layout) where both engines look for them: agent-home.sh [skills dir]
  agent-home.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    src="${1:-/skills/opencode}"
    mkdir -p "$HOME/.config/opencode" "$HOME/.claude/skills" /workspace/out
    if [ -d "$src" ]; then
      cp -R "$src/." "$HOME/.config/opencode/"
      # Claude Code reads the same SKILL.md format. OpenCode subagents (agents/*.md) use another frontmatter and are not copied.
      if [ -d "$src/skills" ]; then cp -R "$src/skills/." "$HOME/.claude/skills/"; fi
    fi
  # OpenCode permissions for every agent task: no commit, no push, no gh, no web. The model comes from routing.env.
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "opencode-go/deepseek-v4.1-flash",
      "permission": {
        "edit": "allow",
        "skill": "allow",
        "task": "allow",
        "webfetch": "deny",
        "external_directory": "allow",
        "bash": {
          "*": "allow",
          "git commit*": "deny",
          "git push*": "deny",
          "gh *": "deny"
        }
      },
      "tools": {
        "todowrite": false
      },
      "provider": {
        "opencode-go": {
          "options": {
            "apiKey": "{env:OPENCODE_API_KEY}"
          }
        }
      }
    }
  # Claude Code permissions, the same rules as opencode.json. Deny rules win over allow rules; in -p mode anything
  # not allowed is refused instead of prompting.
  claude-settings.json: |
    {
      "permissions": {
        "allow": ["Bash", "Read", "Edit", "Write", "Glob", "Grep", "Skill", "Task", "TodoWrite"],
        "deny": [
          "Bash(git commit:*)",
          "Bash(git push:*)",
          "Bash(gh:*)",
          "WebFetch",
          "WebSearch"
        ]
      },
      "env": {
        "DISABLE_AUTOUPDATER": "1",
        "DISABLE_TELEMETRY": "1"
      }
    }
  # Per-repository verify scripts, used by verify-build when the pipeline gives no verify-command.
  # Key: verify--<owner>--<repo>.sh, lowercase. Run with bash in the repository root; exit 0 means green.
  # A repository without a script keeps the default: `mvn -B -ntp verify` when there is a pom.xml, otherwise nothing.
  verify--majowka--mesh-manager.sh: |
    #!/usr/bin/env bash
    # Majowka/mesh-manager: unit tests of the Go bridge and of the backend, the same shards as CI (unit-core, unit-api,
    # unit-services, unit-bridge in .github/workflows/ci-backend.yml). Nothing here needs Postgres/Timescale, Redis or
    # MQTT: the backend tests fall back to SQLite. Integration tests (bridge-go -tags integration, backend
    # tests/integration, real-integration-*) are left to the repository's CI. Runs in the repository root.
    set -euo pipefail

    echo "=== bridge-go: go test ==="
    (cd bridge-go && CGO_ENABLED=0 go test -count=1 -timeout 300s ./...)

    echo "=== backend: dependencies (uv, Python 3.13) ==="
    venv="${HOME}/.cache/verify-venv/mesh-manager"
    uv venv -q --allow-existing -p 3.13 "$venv"
    VIRTUAL_ENV="$venv" uv pip install -q -r backend/requirements_ci.txt

    cd backend
    # No CI markers and no database URL: conftest.py then uses SQLite instead of the CI Postgres service
    unset CI GITHUB_ACTIONS POSTGRES_AVAILABLE DATABASE_URL DATABASE_URL_SYNC
    export TESTING=1 SKIP_ENV_VALIDATION=1 BCRYPT_ROUNDS=4
    shard() {
      echo "=== backend: ${1} ==="; shift
      rm -f test*.db
      "$venv/bin/python" -m pytest -q --no-header -p no:cacheprovider --timeout=120 --maxfail=5 "$@"
    }
    shard unit-core \
      tests/core/ tests/unit/core/ tests/unit/models/ tests/unit/middleware/ tests/unit/schemas/ tests/unit/scripts/ \
      tests/regression/ tests/unit/test_celery_schedule_guard.py tests/unit/test_compose_celery_module_guard.py \
      tests/unit/test_compose_uat_db_pool.py tests/unit/test_main_smoke.py tests/unit/test_pagination_gh4091.py \
      tests/unit/test_pytest_configuration.py tests/unit/test_release_please_extra_files_guard.py \
      tests/unit/test_root_docker_compose_config.py tests/unit/test_security_logging_rate_limit.py \
      tests/unit/test_security_blocks.py tests/unit/test_alembic_single_head.py \
      tests/unit/test_add_alert_type_column_migration.py tests/unit/test_add_system_logs_timestamps_migration.py \
      tests/unit/test_drop_v1_update_tables_migration.py tests/unit/test_gh3171_mqtt_username_partial_unique_migration.py \
      tests/unit/test_gh4193_backfill_cancelled_commands_migration.py \
      tests/unit/test_rename_bridge_logs_metadata_migration.py tests/unit/test_nginx_v2_websocket_proxy.py
    shard unit-api tests/unit/api/ tests/unit/tasks/ tests/unit/test_v2_surface.py
    shard unit-services tests/services/ tests/unit/services/ tests/unit/test_mosquitto_logging_config.py tests/unit/test_user_service.py
    # Its own run: together with the other shards, tests/unit/bridge shadows the repository's bridge package
    shard unit-bridge tests/unit/bridge/ tests/unit/test_issue_6052_bridge_logs_and_tasks.py tests/unit/test_mirror_helper.py
    rm -f test*.db
  # Helpers shared by the requirements scan (CronJob) and the requirements-agent pipeline. Source it; it needs GH_TOKEN and REPO_FULL_NAME.
  requirements-lib.sh: |
    # sha256 of the requirements text: a different value means the issue was edited
    req_hash() { printf '%s\n%s' "$1" "$2" | sha256sum | cut -d' ' -f1; }

    # State of requirements issue $1 as {comment_id, state}. It lives in a comment of the bot, state is {} when there is none.
    req_state() {
      local comment encoded
      comment="$(gh api --paginate "repos/${REPO_FULL_NAME}/issues/$1/comments" \
        --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- requirements-state:"))) | {id, body}' | jq -s 'last // empty')"
      if [ -z "$comment" ]; then echo '{"comment_id":null,"state":{}}'; return; fi
      encoded="$(jq -r .body <<<"$comment" | sed -n 's|.*<!-- requirements-state:\([A-Za-z0-9+/=]*\) -->.*|\1|p' | head -n1)"
      jq -n --argjson id "$(jq .id <<<"$comment")" --argjson state "$(printf '%s' "$encoded" | base64 -d | gunzip)" '{comment_id: $id, state: $state}'
    }

    # Tasks already created for requirements issue $1 (label req-<n>, marker in the body): [{id, number, title, state}], state is OPEN or CLOSED
    req_children() {
      gh issue list --repo "$REPO_FULL_NAME" --label "req-$1" --state all --limit 200 --json number,title,state,body \
        | jq --arg n "$1" '[.[] | (.body | capture("<!-- requirements:" + $n + ":(?<id>[a-z0-9-]+) -->")?) as $m | select($m) | {id: $m.id, number, title, state}]'
    }
