apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-coder
  namespace: ai
spec:
  progressDeadlineSeconds: 600
  replicas: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: qwen3-coder
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: qwen3-coder
    spec:
      containers:
        - args:
            - --port=8000
            - --model=RedHatAI/Qwen3-Coder-Next-NVFP4
            - --served-model-name=qwen3_coder
            - --tensor-parallel-size=2
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_coder
            - --enforce-eager
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
          env:
            - name: HF_HUB_OFFLINE
              value: '0'
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: hf-token
          image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.4.4
          imagePullPolicy: IfNotPresent
          name: vllm
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            limits:
              cpu: '16'
              memory: 50Gi
              nvidia.com/gpu: '2'
            requests:
              cpu: '1'
              memory: 20Gi
              nvidia.com/gpu: '2'
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
