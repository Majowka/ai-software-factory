apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-flash
  namespace: ai
spec:
  progressDeadlineSeconds: 600
  replicas: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: qwen38-flash
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qwen38-flash
    spec:
      containers:
        - args:
            - RedHatAI/Qwen3.8-Flash-Next-NVFP4
            - --port=8000
            - --served-model-name=qwen38_flash
            - --tensor-parallel-size=2
            - --max-model-len=131072
            - --gpu-memory-utilization=0.90
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_coder
            - --reasoning-parser=qwen3
            - --enforce-eager
            - --no-enable-flashinfer-autotune
          command:
            - vllm
            - serve
          env:
            - name: HF_HUB_OFFLINE
              value: '0'
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: hf-token
            - name: HF_HOME
              value: /cache/hf
          image: registry.redhat.io/rhaii-preview/vllm-cuda-rhel9:v0.31.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 10
          name: vllm
          ports:
            - containerPort: 8000
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: '16'
              memory: 200Gi
              nvidia.com/gpu: '2'
            requests:
              cpu: '4'
              memory: 180Gi
              nvidia.com/gpu: '2'
          startupProbe:
            failureThreshold: 240
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /cache/hf
              name: cache
              subPath: hf
            - mountPath: /tmp/vllm
              name: cache
              subPath: vllm
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 32Gi
          name: shm
        - name: cache
          persistentVolumeClaim:
            claimName: qwen38-flash-cache
