# Long-lived Claude Code OAuth token for the claude engine (read as CLAUDE_CODE_OAUTH_TOKEN by the agent steps).
# Generate it with `claude setup-token` (valid one year, uses the Claude subscription). Placeholder only.
apiVersion: v1
kind: Secret
metadata:
  name: claude-code-oauth
  namespace: agents
type: Opaque
stringData:
  token: "<CLAUDE_CODE_OAUTH_TOKEN>"
