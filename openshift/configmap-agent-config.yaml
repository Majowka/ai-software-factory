apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: agents
data:
  # Prints a GitHub App installation token (valid 1h). Run it right before every step that talks to GitHub.
  gh-app-token.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
    now="$(date +%s)"
    header="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
    payload="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$GITHUB_APP_ID" | b64url)"
    signature="$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign <(printf '%s\n' "$GITHUB_APP_PRIVATE_KEY") | b64url)"
    curl -fsS -X POST \
      -H "Authorization: Bearer ${header}.${payload}.${signature}" \
      -H "Accept: application/vnd.github+json" \
      "https://api.github.com/app/installations/${GITHUB_APP_INSTALLATION_ID}/access_tokens" | jq -er .token
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "qwen38-flash/qwen38_flash",
      "permission": {
        "edit": "allow",
        "skill": "allow",
        "task": "allow",
        "webfetch": "deny",
        "external_directory": "allow",
        "bash": { "*": "allow", "git commit*": "deny", "git push*": "deny", "gh *": "deny" }
      },
      "tools": { "todowrite": false },
      "provider": {
        "qwen38-flash": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Qwen3.8 Flash",
          "options": { "baseURL": "http://qwen38-flash.ai.svc.cluster.local:8000/v1", "apiKey": "none" },
          "models": { "qwen38_flash": { "name": "Qwen3.8 Flash", "limit": { "context": 32768, "output": 8192 } } }
        }
      }
    }
  # Used by the plan step only: same as opencode.json, but the agent may post its plan with `gh issue comment`.
  opencode-plan.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "qwen38-flash/qwen38_flash",
      "permission": {
        "edit": "allow",
        "skill": "allow",
        "task": "allow",
        "webfetch": "deny",
        "external_directory": "allow",
        "bash": { "*": "allow", "git commit*": "deny", "git push*": "deny", "gh *": "deny", "gh issue comment*": "allow" }
      },
      "tools": { "todowrite": false },
      "provider": {
        "qwen38-flash": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Qwen3.8 Flash",
          "options": { "baseURL": "http://qwen38-flash.ai.svc.cluster.local:8000/v1", "apiKey": "none" },
          "models": { "qwen38_flash": { "name": "Qwen3.8 Flash", "limit": { "context": 32768, "output": 8192 } } }
        }
      }
    }
