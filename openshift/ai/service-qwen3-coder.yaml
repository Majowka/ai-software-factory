apiVersion: v1
kind: Service
metadata:
  name: qwen3-coder
  namespace: ai
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    app: qwen3-coder
  sessionAffinity: None
  type: ClusterIP
