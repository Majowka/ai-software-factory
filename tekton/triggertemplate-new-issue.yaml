apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: new-issue
  namespace: agents
spec:
  params:
    - name: repo-url
    - name: repo-full-name
    - name: issue
    - name: issue-title
    - name: issue-body
    - name: base-branch
    - default: ''
      name: issue-id
    - default: ''
      name: issue-author
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        # Fixed name: a redelivered webhook cannot start a second run for the same issue
        name: issue-agent-$(tt.params.issue-id)
      spec:
        params:
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: repo-full-name
            value: $(tt.params.repo-full-name)
          - name: issue
            value: $(tt.params.issue)
          - name: issue-title
            value: $(tt.params.issue-title)
          - name: issue-body
            value: $(tt.params.issue-body)
          - name: base-branch
            value: $(tt.params.base-branch)
          - name: issue-id
            value: $(tt.params.issue-id)
          - name: issue-author
            value: $(tt.params.issue-author)
        pipelineRef:
          name: issue-agent
        timeouts:
          pipeline: 3h15m0s
          tasks: 3h0m0s
          finally: 15m0s
        workspaces:
          - name: skills
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
          - name: work
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 10Gi
