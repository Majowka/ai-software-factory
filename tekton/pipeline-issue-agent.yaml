apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: issue-agent
  namespace: agents
spec:
  params:
    - name: repo-url
      type: string
    - name: repo-full-name
      type: string
    - name: issue
      type: string
    - name: issue-title
      type: string
    - name: issue-body
      type: string
      default: ""
    - name: base-branch
      type: string
      default: master
    - name: issue-id
      type: string
      default: ""
    - name: issue-author
      type: string
      default: ""
    - name: skills-artifact
      type: string
      default: quay.io/pminkows/claude-ai-spring-boot:1.3.2
    # Build and test command run after the agent step. Empty: `mvn -B -ntp verify` when there is a pom.xml, otherwise nothing. `skip` disables it.
    - name: verify-command
      type: string
      default: ""
    - name: max-fix-attempts
      type: string
      default: "3"
  workspaces:
    - name: skills
    - name: work
  tasks:
    - name: authorize
      taskRef:
        name: authorize-author
      params:
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: author
          value: $(params.issue-author)
    - name: print-event
      runAfter:
        - authorize
      params:
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: issue
          value: $(params.issue)
        - name: issue-id
          value: $(params.issue-id)
        - name: issue-title
          value: $(params.issue-title)
        - name: issue-author
          value: $(params.issue-author)
        - name: issue-body
          value: $(params.issue-body)
      taskSpec:
        params:
          - name: repo-full-name
            type: string
          - name: issue
            type: string
          - name: issue-id
            type: string
          - name: issue-title
            type: string
          - name: issue-author
            type: string
          - name: issue-body
            type: string
        steps:
          - name: print
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: ISSUE_NUMBER
                value: $(params.issue)
              - name: ISSUE_ID
                value: $(params.issue-id)
              - name: ISSUE_TITLE
                value: $(params.issue-title)
              - name: ISSUE_AUTHOR
                value: $(params.issue-author)
              - name: ISSUE_BODY
                value: $(params.issue-body)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "=============== New issue event ==============="
              echo "Repository  : ${REPO_FULL_NAME}"
              echo "Issue number: ${ISSUE_NUMBER}"
              echo "Issue id    : ${ISSUE_ID}"
              echo "Title       : ${ISSUE_TITLE}"
              echo "Author      : ${ISSUE_AUTHOR}"
              echo "Body        :"
              printf '%s\n' "$ISSUE_BODY"
              echo "==============================================="
    - name: fetch-skills
      runAfter:
        - print-event
      taskRef:
        name: fetch-skills
      params:
        - name: skills-artifact
          value: $(params.skills-artifact)
      workspaces:
        - name: skills
          workspace: skills
    - name: implement-and-create-pr
      runAfter:
        - fetch-skills
      workspaces:
        - name: skills
          workspace: skills
        - name: work
          workspace: work
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: issue
          value: $(params.issue)
        - name: issue-title
          value: $(params.issue-title)
        - name: issue-body
          value: $(params.issue-body)
        - name: base-branch
          value: $(params.base-branch)
      taskSpec:
        params:
          - name: repo-url
            type: string
          - name: repo-full-name
            type: string
          - name: issue
            type: string
          - name: issue-title
            type: string
          - name: issue-body
            type: string
          - name: base-branch
            type: string
        workspaces:
          - name: skills
            mountPath: /skills
            readOnly: true
          - name: work
            mountPath: /workspace
        volumes:
          - name: config
            configMap:
              name: agent-config
        steps:
          # Clone and branch. Holds the GitHub App key, the agent step does not.
          - name: prepare
            image: ghcr.io/majowka/factory-agent:latest
            workingDir: /workspace
            volumeMounts:
              - name: config
                mountPath: /config
                readOnly: true
            env:
              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: app-id
              - name: GITHUB_APP_INSTALLATION_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: installation-id
              - name: GITHUB_APP_PRIVATE_KEY
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: private-key.pem
              - name: REPO_URL
                value: $(params.repo-url)
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: ISSUE_NUMBER
                value: $(params.issue)
              - name: ISSUE_TITLE
                value: $(params.issue-title)
              - name: ISSUE_BODY
                value: $(params.issue-body)
              - name: BASE_BRANCH
                value: $(params.base-branch)
              - name: HOME
                value: /workspace/home
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Skills and agents fetched by the fetch-skills task, installed for both engines
              bash /config/agent-home.sh /skills/opencode
              printf '# Issue #%s: %s\n\n%s\n' "$ISSUE_NUMBER" "$ISSUE_TITLE" "$ISSUE_BODY" > /workspace/issue.txt

              GH_TOKEN="$(bash /config/gh-app-token.sh)"
              export GH_TOKEN
              gh auth setup-git
              # Labels of the issue / PR: engine:<opencode|claude> or engine-<task>:<engine> override routing.env (agent-run.sh)
              gh issue view "$ISSUE_NUMBER" --repo "$REPO_FULL_NAME" --json labels -q '.labels[].name' > /workspace/agent-labels || true
              # Short-lived token (1h) handed to the plan step; the GitHub App key stays in this step
              ( umask 077; printf '%s' "$GH_TOKEN" > /workspace/gh-token )

              git clone --branch "$BASE_BRANCH" -- "$REPO_URL" /workspace/repo
              cd /workspace/repo

              # Branch name per AGENTS.md: issue-<number>-<short-kebab-case-description>
              SLUG="$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40 | sed -E 's/-+$//')"
              BRANCH="issue-${ISSUE_NUMBER}-${SLUG}"
              git switch -c "$BRANCH"
              echo "$BRANCH" > /workspace/branch

          # Planning: the agent analyzes the repo, writes the checklist to /workspace/out/plan.md and posts it on the issue
          # itself (the script posts it with `gh issue comment`; the agent has no GitHub credentials). It gets the short-lived token from prepare, not the App key.
          - name: plan
            image: ghcr.io/majowka/factory-agent:latest
            workingDir: /workspace
            volumeMounts:
              - name: config
                mountPath: /config
                readOnly: true
            computeResources:
              requests:
                memory: 1Gi
                cpu: 500m
              limits:
                memory: 2Gi
                cpu: "2"
            env:
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: ISSUE_NUMBER
                value: $(params.issue)
              - name: HOME
                value: /workspace/home
              - name: OPENCODE_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: opencode-go
                    key: api-key
                    optional: true
              - name: CLAUDE_CODE_OAUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: claude-code-oauth
                    key: token
                    optional: true
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # The repo is cloned by the prepare step: a workingDir of /workspace/repo would be created as root by Tekton and could not be cloned into
              cd /workspace/repo

              # The short-lived token stays in this script: the agent gets no GitHub credentials, the script posts the plan
              PLAN_GH_TOKEN="$(cat /workspace/gh-token)"
              rm -f /workspace/gh-token

              PLAN_PROMPT="Analyze this repository and write an implementation plan for the GitHub issue below. Do not implement anything yet.

              1. Write the plan to /workspace/out/plan.md. The first line is '### Implementation plan', followed by a GitHub markdown checklist: one '- [ ] ' line per concrete step, in the order you will carry the steps out (code changes, tests, build verification), 3 to 10 lines, no other text.
              The pipeline posts the plan for you: do not run gh. Do not modify any file in the repository and do not write .agent-summary.md.

              $(cat /workspace/issue.txt)"

              bash /config/agent-run.sh plan 15m /workspace/plan.log "$PLAN_PROMPT" || echo "Continuing without a plan"
              if [ -s /workspace/out/plan.md ]; then
                GH_TOKEN="$PLAN_GH_TOKEN" gh issue comment "$ISSUE_NUMBER" --repo "$REPO_FULL_NAME" --body-file /workspace/out/plan.md \
                  || echo "Could not post the plan"
              fi

              # Planning must not leave changes behind
              git reset -q --hard
              git clean -qfd

          # Agent run. No GitHub credentials in this step; committing, pushing and gh are denied in opencode.json and claude-settings.json.
          - name: agent
            image: ghcr.io/majowka/factory-agent:latest
            workingDir: /workspace
            volumeMounts:
              - name: config
                mountPath: /config
                readOnly: true
            computeResources:
              requests:
                memory: 1Gi
                cpu: 500m
              limits:
                memory: 2Gi
                cpu: "2"
            env:
              - name: HOME
                value: /workspace/home
              - name: OPENCODE_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: opencode-go
                    key: api-key
                    optional: true
              - name: CLAUDE_CODE_OAUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: claude-code-oauth
                    key: token
                    optional: true
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # The repo is cloned by the prepare step: a workingDir of /workspace/repo would be created as root by Tekton and could not be cloned into
              cd /workspace/repo

              PROMPT="Implement this GitHub issue, following the repository's AGENTS.md.

              Pipeline context: you run non-interactively with no GitHub credentials; the pipeline handles git, the pull request and the issue comment, so ignore those sections of AGENTS.md. Use only the available tools (bash, read, edit, write, glob, grep, skill, task); there is no 'step', 'run' or 'todo' tool. When done, write a 2-4 bullet summary to .agent-summary.md in the repository root (the pipeline posts it on the issue and removes it from the commit): what was changed, the test result, anything left undone or worth a reviewer's attention.

              $(cat /workspace/issue.txt)"
              if [ -s /workspace/out/plan.md ]; then
                PROMPT="$PROMPT

              Follow this plan:
              $(cat /workspace/out/plan.md)"
              fi

              bash /config/agent-run.sh implement 3h /workspace/agent.log "$PROMPT" || echo "Continuing"

              if [ -z "$(git status --porcelain -uall -- . ':(exclude)**/target/**')" ]; then
                echo "No changes generated"
                exit 1
              fi

              # Only sources: never commit build output (target/ is tracked in this repo) or the agent summary
              if [ -f .agent-summary.md ]; then mv .agent-summary.md /workspace/out/summary.md; fi

    - name: verify
      runAfter:
        - implement-and-create-pr
      taskRef:
        name: verify-build
      workspaces:
        - name: work
          workspace: work
      params:
        - name: verify-command
          value: $(params.verify-command)
        - name: max-fix-attempts
          value: $(params.max-fix-attempts)
    - name: publish
      runAfter:
        - verify
      workspaces:
        - name: work
          workspace: work
      params:
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: issue
          value: $(params.issue)
        - name: base-branch
          value: $(params.base-branch)
      taskSpec:
        params:
          - name: repo-full-name
            type: string
          - name: issue
            type: string
          - name: base-branch
            type: string
        workspaces:
          - name: work
            mountPath: /workspace
        volumes:
          - name: config
            configMap:
              name: agent-config
        steps:
          # Commit, push, PR and issue comment. Mints a fresh token: the agent run may outlast the 1h token lifetime.
          - name: publish
            image: ghcr.io/majowka/factory-agent:latest
            workingDir: /workspace
            volumeMounts:
              - name: config
                mountPath: /config
                readOnly: true
            env:
              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: app-id
              - name: GITHUB_APP_INSTALLATION_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: installation-id
              - name: GITHUB_APP_PRIVATE_KEY
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: private-key.pem
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: ISSUE_NUMBER
                value: $(params.issue)
              - name: BASE_BRANCH
                value: $(params.base-branch)
              - name: HOME
                value: /workspace/home
              - name: GIT_AUTHOR_NAME
                value: klaudiuszai[bot]
              - name: GIT_AUTHOR_EMAIL
                value: 290278935+klaudiuszai[bot]@users.noreply.github.com
              - name: GIT_COMMITTER_NAME
                value: klaudiuszai[bot]
              - name: GIT_COMMITTER_EMAIL
                value: 290278935+klaudiuszai[bot]@users.noreply.github.com
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # The repo is cloned by the prepare step: a workingDir of /workspace/repo would be created as root by Tekton and could not be cloned into
              cd /workspace/repo

              BRANCH="$(cat /workspace/branch)"

              # Installation tokens expire after 1h and the agent run can take longer, so mint the token only now
              GH_TOKEN="$(bash /config/gh-app-token.sh)"
              export GH_TOKEN

              # A build that stays red after the fix attempts opens a draft pull request
              DRAFT_FLAG=""
              if [ -f /workspace/out/verify-failed ]; then DRAFT_FLAG="--draft"; fi
              # Result of the verify step goes in front of the reply
              if [ -s /workspace/out/verify-note.md ]; then
                { cat /workspace/out/verify-note.md; echo; cat /workspace/out/summary.md 2>/dev/null || true; } > /workspace/out/summary.full.md
                mv /workspace/out/summary.full.md /workspace/out/summary.md
              fi

              git add -A -- . ':(exclude)**/target/**'
              git commit -m "feat: implement issue #${ISSUE_NUMBER}" -m "Refs #${ISSUE_NUMBER}"
              git push origin "$BRANCH"

              PR_URL="$(gh pr create \
                --repo "$REPO_FULL_NAME" \
                --base "$BASE_BRANCH" \
                --head "$BRANCH" \
                $DRAFT_FLAG \
                --title "AI: implement issue #${ISSUE_NUMBER}" \
                --body "Closes #${ISSUE_NUMBER}")"
              echo "Created PR: $PR_URL"

              # Merge automatically once branch protection is satisfied (required review and checks); never fails the pipeline
              if [ -n "$DRAFT_FLAG" ]; then
                echo "draft pull request (build verification failed); auto-merge not enabled"
              elif gh pr merge "$PR_URL" --auto --merge; then
                echo "auto-merge enabled (merges once the required review and checks pass)"
              else
                echo "auto-merge could not be enabled; merge manually"
              fi

              echo "=== Commenting on the issue ==="
              if [ -s /workspace/out/summary.md ]; then
                gh issue comment "$ISSUE_NUMBER" --repo "$REPO_FULL_NAME" --body-file /workspace/out/summary.md
              fi
  # Runs after the tasks, also when they failed or timed out: tells the issue or pull request that nothing came out of this run
  finally:
    - name: report-failure
      when:
        - input: $(tasks.status)
          operator: in
          values:
            - Failed
        - input: $(tasks.authorize.status)
          operator: notin
          values:
            - Failed
      taskRef:
        name: report-failure
      params:
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: number
          value: $(params.issue)
        - name: target
          value: issue
        - name: what
          value: "No pull request was created from this run."
        - name: retry-hint
          value: "To retry, comment `@ai` with an instruction, for example `@ai please try again`."
        - name: pipelinerun
          value: $(context.pipelineRun.name)
        - name: namespace
          value: $(context.pipelineRun.namespace)
