apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: issue-agent
  namespace: agents
spec:
  params:
    - name: repo-url
      type: string
    - name: repo-full-name
      type: string
    - name: issue
      type: string
    - name: issue-title
      type: string
    - name: issue-body
      type: string
      default: ""
    - name: base-branch
      type: string
      default: master
    - name: issue-id
      type: string
      default: ""
    - name: issue-author
      type: string
      default: ""
    - name: skills-artifact
      type: string
      default: quay.io/pminkows/claude-ai-spring-boot:1.3.1
    # Build and test command run after the agent step. Empty: `mvn -B -ntp verify` when there is a pom.xml, otherwise nothing. `skip` disables it.
    - name: verify-command
      type: string
      default: ""
    - name: max-fix-attempts
      type: string
      default: "3"
  workspaces:
    - name: skills
  tasks:
    - name: print-event
      params:
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: issue
          value: $(params.issue)
        - name: issue-id
          value: $(params.issue-id)
        - name: issue-title
          value: $(params.issue-title)
        - name: issue-author
          value: $(params.issue-author)
        - name: issue-body
          value: $(params.issue-body)
      taskSpec:
        params:
          - name: repo-full-name
            type: string
          - name: issue
            type: string
          - name: issue-id
            type: string
          - name: issue-title
            type: string
          - name: issue-author
            type: string
          - name: issue-body
            type: string
        steps:
          - name: print
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: ISSUE_NUMBER
                value: $(params.issue)
              - name: ISSUE_ID
                value: $(params.issue-id)
              - name: ISSUE_TITLE
                value: $(params.issue-title)
              - name: ISSUE_AUTHOR
                value: $(params.issue-author)
              - name: ISSUE_BODY
                value: $(params.issue-body)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "=============== New issue event ==============="
              echo "Repository  : ${REPO_FULL_NAME}"
              echo "Issue number: ${ISSUE_NUMBER}"
              echo "Issue id    : ${ISSUE_ID}"
              echo "Title       : ${ISSUE_TITLE}"
              echo "Author      : ${ISSUE_AUTHOR}"
              echo "Body        :"
              printf '%s\n' "$ISSUE_BODY"
              echo "==============================================="
    - name: fetch-skills
      runAfter:
        - print-event
      params:
        - name: skills-artifact
          value: $(params.skills-artifact)
      workspaces:
        - name: skills
          workspace: skills
      taskSpec:
        params:
          - name: skills-artifact
            type: string
        workspaces:
          - name: skills
            mountPath: /skills
        steps:
          - name: pull
            image: ghcr.io/oras-project/oras:v1.3.0
            workingDir: /skills
            command:
              - oras
            args:
              - pull
              - $(params.skills-artifact)
              - --output
              - /skills/artifact
          - name: unpack
            image: registry.access.redhat.com/ubi9/ubi:latest
            workingDir: /skills
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              # artifact: one tar.gz holding skills/ and agents/ in OpenCode format
              mkdir -p /skills/opencode
              for f in /skills/artifact/*.tar.gz; do tar -xzf "$f" -C /skills/opencode; done
              echo "Installed skills: $(ls /skills/opencode/skills | tr '\n' ' ')"
              echo "Installed agents: $(ls /skills/opencode/agents | tr '\n' ' ')"
    - name: implement-and-create-pr
      runAfter:
        - fetch-skills
      timeout: "3h30m"
      workspaces:
        - name: skills
          workspace: skills
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: issue
          value: $(params.issue)
        - name: issue-title
          value: $(params.issue-title)
        - name: issue-body
          value: $(params.issue-body)
        - name: base-branch
          value: $(params.base-branch)
        - name: verify-command
          value: $(params.verify-command)
        - name: max-fix-attempts
          value: $(params.max-fix-attempts)
      taskSpec:
        params:
          - name: repo-url
            type: string
          - name: repo-full-name
            type: string
          - name: issue
            type: string
          - name: issue-title
            type: string
          - name: issue-body
            type: string
          - name: base-branch
            type: string
          - name: verify-command
            type: string
          - name: max-fix-attempts
            type: string
        workspaces:
          - name: skills
            mountPath: /skills
            readOnly: true
        volumes:
          - name: work
            emptyDir: {}
          - name: config
            configMap:
              name: agent-config
        steps:
          # Clone and branch. Holds the GitHub App key, the agent step does not.
          - name: prepare
            image: quay.io/pminkows/opencode:latest
            workingDir: /workspace
            volumeMounts:
              - name: work
                mountPath: /workspace
              - name: config
                mountPath: /config
                readOnly: true
            env:
              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: app-id
              - name: GITHUB_APP_INSTALLATION_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: installation-id
              - name: GITHUB_APP_PRIVATE_KEY
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: private-key.pem
              - name: REPO_URL
                value: $(params.repo-url)
              - name: ISSUE_NUMBER
                value: $(params.issue)
              - name: ISSUE_TITLE
                value: $(params.issue-title)
              - name: ISSUE_BODY
                value: $(params.issue-body)
              - name: BASE_BRANCH
                value: $(params.base-branch)
              - name: HOME
                value: /workspace/home
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              mkdir -p "$HOME/.config/opencode" /workspace/out
              # Skills and agents fetched by the fetch-skills task
              cp -R /skills/opencode/. "$HOME/.config/opencode/"
              printf '# Issue #%s: %s\n\n%s\n' "$ISSUE_NUMBER" "$ISSUE_TITLE" "$ISSUE_BODY" > /workspace/issue.txt

              GH_TOKEN="$(bash /config/gh-app-token.sh)"
              export GH_TOKEN
              gh auth setup-git
              # Short-lived token (1h) handed to the plan step; the GitHub App key stays in this step
              ( umask 077; printf '%s' "$GH_TOKEN" > /workspace/gh-token )

              git clone --branch "$BASE_BRANCH" -- "$REPO_URL" /workspace/repo
              cd /workspace/repo

              # Branch name per AGENTS.md: issue-<number>-<short-kebab-case-description>
              SLUG="$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40 | sed -E 's/-+$//')"
              BRANCH="issue-${ISSUE_NUMBER}-${SLUG}"
              git switch -c "$BRANCH"
              echo "$BRANCH" > /workspace/branch

          # Planning: the agent analyzes the repo, writes the checklist to /workspace/out/plan.md and posts it on the issue
          # itself (only `gh issue comment` is allowed in opencode-plan.json). It gets the short-lived token from prepare, not the App key.
          - name: plan
            image: quay.io/pminkows/opencode:latest
            workingDir: /workspace/repo
            volumeMounts:
              - name: work
                mountPath: /workspace
              - name: config
                mountPath: /config
                readOnly: true
            computeResources:
              requests:
                memory: 1Gi
                cpu: 500m
              limits:
                memory: 2Gi
                cpu: "2"
            env:
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: ISSUE_NUMBER
                value: $(params.issue)
              - name: HOME
                value: /workspace/home
              - name: OPENCODE_CONFIG
                value: /config/opencode-plan.json
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              GH_TOKEN="$(cat /workspace/gh-token)"
              export GH_TOKEN
              rm -f /workspace/gh-token

              PLAN_PROMPT="Analyze this repository and write an implementation plan for the GitHub issue below. Do not implement anything yet.

              1. Write the plan to /workspace/out/plan.md. The first line is '### Implementation plan', followed by a GitHub markdown checklist: one '- [ ] ' line per concrete step, in the order you will carry the steps out (code changes, tests, build verification), 3 to 10 lines, no other text.
              2. Post it as a comment on the issue with: gh issue comment ${ISSUE_NUMBER} --repo ${REPO_FULL_NAME} --body-file /workspace/out/plan.md
              This is the only gh command you may run. Do not modify any file in the repository and do not write .agent-summary.md.

              $(cat /workspace/issue.txt)"

              echo "=== Planning ==="
              timeout 15m opencode run "$PLAN_PROMPT" 2>&1 | tee /workspace/plan.log \
                || echo "opencode exited with $? (timeout or error); continuing without a plan"

              # Planning must not leave changes behind
              git reset -q --hard
              git clean -qfd

          # Agent run. No GitHub credentials in this step; committing, pushing and gh are denied in opencode.json.
          - name: agent
            image: quay.io/pminkows/opencode:latest
            workingDir: /workspace/repo
            volumeMounts:
              - name: work
                mountPath: /workspace
              - name: config
                mountPath: /config
                readOnly: true
            computeResources:
              requests:
                memory: 1Gi
                cpu: 500m
              limits:
                memory: 2Gi
                cpu: "2"
            env:
              - name: HOME
                value: /workspace/home
              - name: OPENCODE_CONFIG
                value: /config/opencode.json
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              PROMPT="Implement this GitHub issue, following the repository's AGENTS.md.

              Pipeline context: you run non-interactively with no GitHub credentials; the pipeline handles git, the pull request and the issue comment, so ignore those sections of AGENTS.md. Use only the available tools (bash, read, edit, write, glob, grep, skill, task); there is no 'step', 'run' or 'todo' tool. When done, write a 2-4 bullet summary to .agent-summary.md in the repository root (the pipeline posts it on the issue and removes it from the commit): what was changed, the test result, anything left undone or worth a reviewer's attention.

              $(cat /workspace/issue.txt)"
              if [ -s /workspace/out/plan.md ]; then
                PROMPT="$PROMPT

              Follow this plan:
              $(cat /workspace/out/plan.md)"
              fi

              echo "=== Running opencode ==="
              timeout 2h opencode run "$PROMPT" 2>&1 | tee /workspace/opencode.log \
                || echo "opencode exited with $? (timeout or error); continuing"

              if [ -z "$(git status --porcelain -uall -- . ':(exclude)**/target/**')" ]; then
                echo "No changes generated"
                exit 1
              fi

              # Only sources: never commit build output (target/ is tracked in this repo) or the agent summary
              if [ -f .agent-summary.md ]; then mv .agent-summary.md /workspace/out/summary.md; fi

          # Build and test the result. If the build fails, the agent gets the log and fixes it (see verify.sh in agent-config).
          # Never fails the step: when the build stays red, publish opens a draft pull request with the build log.
          - name: verify
            image: quay.io/pminkows/opencode:latest
            workingDir: /workspace/repo
            volumeMounts:
              - name: work
                mountPath: /workspace
              - name: config
                mountPath: /config
                readOnly: true
            computeResources:
              requests:
                memory: 1Gi
                cpu: 500m
              limits:
                memory: 3Gi
                cpu: "2"
            env:
              - name: VERIFY_COMMAND
                value: $(params.verify-command)
              - name: MAX_FIX_ATTEMPTS
                value: $(params.max-fix-attempts)
              - name: HOME
                value: /workspace/home
              - name: OPENCODE_CONFIG
                value: /config/opencode.json
            script: |
              #!/usr/bin/env bash
              exec bash /config/verify.sh

          # Commit, push, PR and issue comment. Mints a fresh token: the agent run may outlast the 1h token lifetime.
          - name: publish
            image: quay.io/pminkows/opencode:latest
            workingDir: /workspace/repo
            volumeMounts:
              - name: work
                mountPath: /workspace
              - name: config
                mountPath: /config
                readOnly: true
            env:
              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: app-id
              - name: GITHUB_APP_INSTALLATION_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: installation-id
              - name: GITHUB_APP_PRIVATE_KEY
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: private-key.pem
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: ISSUE_NUMBER
                value: $(params.issue)
              - name: BASE_BRANCH
                value: $(params.base-branch)
              - name: HOME
                value: /workspace/home
              - name: GIT_AUTHOR_NAME
                value: ai-software-factory-agent[bot]
              - name: GIT_AUTHOR_EMAIL
                value: 5642464+ai-software-factory-agent[bot]@users.noreply.github.com
              - name: GIT_COMMITTER_NAME
                value: ai-software-factory-agent[bot]
              - name: GIT_COMMITTER_EMAIL
                value: 5642464+ai-software-factory-agent[bot]@users.noreply.github.com
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              BRANCH="$(cat /workspace/branch)"

              # Installation tokens expire after 1h and the agent run can take longer, so mint the token only now
              GH_TOKEN="$(bash /config/gh-app-token.sh)"
              export GH_TOKEN

              # A build that stays red after the fix attempts opens a draft pull request
              DRAFT_FLAG=""
              if [ -f /workspace/out/verify-failed ]; then DRAFT_FLAG="--draft"; fi
              # Result of the verify step goes in front of the reply
              if [ -s /workspace/out/verify-note.md ]; then
                { cat /workspace/out/verify-note.md; echo; cat /workspace/out/summary.md 2>/dev/null || true; } > /workspace/out/summary.full.md
                mv /workspace/out/summary.full.md /workspace/out/summary.md
              fi

              git add -A -- . ':(exclude)**/target/**'
              git commit -m "feat: implement issue #${ISSUE_NUMBER}" -m "Refs #${ISSUE_NUMBER}"
              git push origin "$BRANCH"

              PR_URL="$(gh pr create \
                --repo "$REPO_FULL_NAME" \
                --base "$BASE_BRANCH" \
                --head "$BRANCH" \
                $DRAFT_FLAG \
                --title "AI: implement issue #${ISSUE_NUMBER}" \
                --body "Closes #${ISSUE_NUMBER}")"
              echo "Created PR: $PR_URL"

              # Merge automatically once branch protection is satisfied (required review and checks); never fails the pipeline
              if [ -n "$DRAFT_FLAG" ]; then
                echo "draft pull request (build verification failed); auto-merge not enabled"
              elif gh pr merge "$PR_URL" --auto --merge; then
                echo "auto-merge enabled (merges once the required review and checks pass)"
              else
                echo "auto-merge could not be enabled; merge manually"
              fi

              echo "=== Commenting on the issue ==="
              if [ -s /workspace/out/summary.md ]; then
                gh issue comment "$ISSUE_NUMBER" --repo "$REPO_FULL_NAME" --body-file /workspace/out/summary.md
              fi
  # Runs after the tasks, also when they failed or timed out: tells the issue or pull request that nothing came out of this run
  finally:
    - name: report-failure
      when:
        - input: $(tasks.status)
          operator: in
          values:
            - Failed
      params:
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: number
          value: $(params.issue)
        - name: pipelinerun
          value: $(context.pipelineRun.name)
        - name: namespace
          value: $(context.pipelineRun.namespace)
      taskSpec:
        params:
          - name: repo-full-name
            type: string
          - name: number
            type: string
          - name: pipelinerun
            type: string
          - name: namespace
            type: string
        volumes:
          - name: config
            configMap:
              name: agent-config
        steps:
          - name: comment
            image: quay.io/pminkows/opencode:latest
            volumeMounts:
              - name: config
                mountPath: /config
                readOnly: true
            env:
              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: app-id
              - name: GITHUB_APP_INSTALLATION_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: installation-id
              - name: GITHUB_APP_PRIVATE_KEY
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: private-key.pem
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: NUMBER
                value: $(params.number)
              - name: PIPELINERUN
                value: $(params.pipelinerun)
              - name: PIPELINERUN_NAMESPACE
                value: $(params.namespace)
              - name: HOME
                value: /tmp
            script: |
              #!/usr/bin/env bash
              set -uo pipefail

              GH_TOKEN="$(bash /config/gh-app-token.sh)" || { echo "Could not mint a GitHub token, no comment posted"; exit 0; }
              export GH_TOKEN

              printf ':x: **The agent run failed.** No pull request was created from this run.\n\nPipeline run `%s` in namespace `%s`. Logs: `tkn pipelinerun logs %s -n %s`\n\nUsual causes: the model endpoint was not available, the run hit its timeout, or the agent produced no changes. To retry, comment `@ai` with an instruction, for example `@ai please try again`.\n' \
                "$PIPELINERUN" "$PIPELINERUN_NAMESPACE" "$PIPELINERUN" "$PIPELINERUN_NAMESPACE" > /tmp/failure.md

              gh issue comment "$NUMBER" --repo "$REPO_FULL_NAME" --body-file /tmp/failure.md || echo "Could not post the failure comment"
