# Starts waiting PipelineRuns in arrival order (FIFO), at most MAX_ACTIVE at a time.
# The trigger templates and the requirements scan create every run with `status: PipelineRunPending`; Tekton does not
# start such a run (no pods, no PVCs, and its timeouts do not tick yet). Every POLL_SECONDS this loop counts the active
# runs (started, not finished) and clears `spec.status` on the oldest waiting runs until MAX_ACTIVE are active.
# One pr-comment-agent run per pull request at a time: a waiting run of a pull request that already has an active run
# stays waiting until that run ends (two runs pushing to one branch end in "Not pushed"). A waiting comment run of a
# pull request that already has an older waiting comment run is deleted: the older one has not started yet and reads the
# whole PR conversation when it starts, so the newer remarks reach it. `@ai fix` requests and ci-fix runs are never folded.
# Without it, runs stay pending: to start one by hand,
#   kubectl -n <ns> patch pipelinerun <name> --type merge -p '{"spec":{"status":null}}'
# Agent steps that talk to an LLM are capped per engine as well (llm-slot.sh, LLM_SLOTS_* in routing.env).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: run-dispatcher
  namespace: agents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: run-dispatcher
  template:
    metadata:
      labels:
        app: run-dispatcher
    spec:
      serviceAccountName: run-dispatcher
      containers:
        - name: dispatch
          image: ghcr.io/majowka/factory-agent:latest
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          env:
            - name: MAX_ACTIVE
              value: "6"
            - name: POLL_SECONDS
              value: "10"
            # Global quota gate: every USAGE_POLL_SECONDS read OpenCode Go's free usage endpoint (no model call) and keep
            # the Lease llm-block-opencode (annotation ai-factory/until) that agent-run.sh reads before every OpenCode task.
            - name: USAGE_POLL_SECONDS
              value: "300"
            - name: OPENCODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-go
                  key: api-key
                  optional: true
            # Gemini CLI login (secret gemini-oauth): every USAGE_POLL_SECONDS the dispatcher reads the account's Gemini
            # quota (retrieveUserQuota, no model call), logs it when it changes and keeps the Lease llm-block-gemini.
            - name: GEMINI_OAUTH_CREDS
              valueFrom:
                secretKeyRef:
                  name: gemini-oauth
                  key: oauth_creds.json
                  optional: true
            - name: HOME
              value: /tmp
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command: [bash, -c]
          args:
          - |
            #!/usr/bin/env bash
            set -uo pipefail
            # The agent image has no kubectl or oc: call the API with the service account token.
            sa=/var/run/secrets/kubernetes.io/serviceaccount
            runs_path="/apis/tekton.dev/v1/namespaces/${NAMESPACE}/pipelineruns"
            # api METHOD PATH OUTFILE [curl args]: prints the HTTP code (000 = no response)
            api() {
              local method="$1" path="$2" out="$3"; shift 3
              curl -sS --connect-timeout 10 --max-time 60 --cacert "$sa/ca.crt" \
                -H "Authorization: Bearer $(cat "$sa/token")" -o "$out" -w '%{http_code}' -X "$method" \
                "https://kubernetes.default.svc${path}" "$@" 2>/dev/null || echo 000
            }
            leases_path="/apis/coordination.k8s.io/v1/namespaces/${NAMESPACE}/leases"
            # Writes the quota gate of an engine: until = epoch (0 = free), reason = text for the logs
            set_gate() {
              local name="llm-block-$1" until="$2" reason="$3" code now
              now="$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)"
              code="$(api GET "${leases_path}/${name}" /tmp/gate.json)"
              if [ "$code" = 404 ]; then
                [ "$until" = 0 ] && return 0
                jq -cn --arg n "$name" --arg u "$until" --arg r "$reason" --arg t "$now" \
                  '{apiVersion:"coordination.k8s.io/v1",kind:"Lease",metadata:{name:$n,annotations:{"ai-factory/until":$u,"ai-factory/reason":$r}},
                    spec:{holderIdentity:"run-dispatcher",acquireTime:$t,renewTime:$t}}' > /tmp/gate-new.json
                code="$(api POST "$leases_path" /tmp/gate-out.json -H 'Content-Type: application/json' --data @/tmp/gate-new.json)"
              elif [ "$code" = 200 ]; then
                [ "$(jq -r '.metadata.annotations["ai-factory/until"] // ""' /tmp/gate.json)" = "$until" ] && return 0
                jq -c --arg u "$until" --arg r "$reason" --arg t "$now" '.metadata.annotations["ai-factory/until"] = $u
                  | .metadata.annotations["ai-factory/reason"] = $r | .spec.renewTime = $t' /tmp/gate.json > /tmp/gate-new.json
                code="$(api PUT "${leases_path}/${name}" /tmp/gate-out.json -H 'Content-Type: application/json' --data @/tmp/gate-new.json)"
              fi
              case "$code" in
                200|201) if [ "$until" = 0 ]; then echo "$(date -u +%FT%TZ) $1 quota gate open (${reason})"
                         else echo "$(date -u +%FT%TZ) $1 quota gate closed until $(date -u -d "@${until}" '+%F %H:%M UTC') (${reason})"; fi ;;
                *) echo "could not write the $1 quota gate (HTTP ${code})" >&2 ;;
              esac
            }
            check_opencode_usage() {
              local st
              [ -n "${OPENCODE_API_KEY:-}" ] || return 0
              curl -sf --max-time 15 -H "Authorization: Bearer ${OPENCODE_API_KEY}" -o /tmp/usage.json \
                "${OPENCODE_USAGE_URL:-https://opencode.ai/zen/go/v1/usage}" || { echo "OpenCode usage endpoint did not answer" >&2; return 0; }
              # Every window "ok": gate open; otherwise closed until the latest resetsAt of the used-up windows
              st="$(jq -r '[.usage | to_entries[] | select(.value.status != "ok")]
                | if length == 0 then "0 ok" else (map(.value.resetsAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) | max | tostring)
                  + " " + (map(.key + " " + (.value.percent | tostring) + "% " + .value.status) | join(", ")) end' /tmp/usage.json 2>/dev/null)" || return 0
              [ -n "$st" ] && set_gate opencode "${st%% *}" "usage endpoint: ${st#* }"
            }
            # Gemini quota of the Google account (AI Pro): the same calls Gemini CLI makes for /stats. The OAuth client is
            # Gemini CLI's public "installed app" client, read from the CLI in this image (GEMINI_OAUTH_CLIENT_ID/_SECRET
            # override it). Every model's bucket is logged when it changes (that is the measurement of the real daily
            # capacity); the gate closes until the earliest reset when no model has quota left, and opens otherwise.
            # A task that hits the quota closes the gate itself (agent-run.sh); this only makes the next tasks skip Gemini
            # at once and opens the gate again after the reset.
            gem_proj=""; gem_last=""; gem_err=""
            gem_cc="${GEMINI_CODE_ASSIST_URL:-https://cloudcode-pa.googleapis.com/v1internal}"
            gem_client() {
              local b
              if [ -n "${GEMINI_OAUTH_CLIENT_ID:-}" ]; then printf '%s %s' "$GEMINI_OAUTH_CLIENT_ID" "${GEMINI_OAUTH_CLIENT_SECRET:-}"; return; fi
              b="$(dirname "$(readlink -f "$(command -v gemini)")" 2>/dev/null)" || return 1
              printf '%s %s' "$(grep -ho 'OAUTH_CLIENT_ID = "[^"]*"' "$b"/*.js 2>/dev/null | head -n1 | cut -d'"' -f2)" \
                "$(grep -ho 'OAUTH_CLIENT_SECRET = "[^"]*"' "$b"/*.js 2>/dev/null | head -n1 | cut -d'"' -f2)"
            }
            gem_note() { [ "$gem_err" = "$1" ] || echo "$(date -u +%FT%TZ) gemini quota: $1" >&2; gem_err="$1"; }
            check_gemini_usage() {
              local rt client at code st summary
              [ -n "${GEMINI_OAUTH_CREDS:-}" ] || return 0
              rt="$(printf '%s' "$GEMINI_OAUTH_CREDS" | jq -r '.refresh_token // empty' 2>/dev/null)"
              [ -n "$rt" ] || { gem_note "no refresh_token in the secret gemini-oauth"; return 0; }
              client="$(gem_client)"; [ -n "${client%% *}" ] || { gem_note "Gemini CLI OAuth client not found"; return 0; }
              code="$(curl -sS --max-time 15 -o /tmp/gem-token.json -w '%{http_code}' "${GEMINI_TOKEN_URL:-https://oauth2.googleapis.com/token}" \
                -d grant_type=refresh_token --data-urlencode "client_id=${client%% *}" --data-urlencode "client_secret=${client#* }" \
                --data-urlencode "refresh_token=${rt}" 2>/dev/null || echo 000)"
              at="$(jq -r '.access_token // empty' /tmp/gem-token.json 2>/dev/null)"; rm -f /tmp/gem-token.json
              [ -n "$at" ] || { gem_note "token refresh failed (HTTP ${code}): log in again and update the secret gemini-oauth"; return 0; }
              if [ -z "$gem_proj" ]; then
                code="$(curl -sS --max-time 15 -o /tmp/gem-load.json -w '%{http_code}' -X POST "${gem_cc}:loadCodeAssist" \
                  -H "Authorization: Bearer ${at}" -H 'Content-Type: application/json' \
                  --data '{"metadata":{"ideType":"IDE_UNSPECIFIED","platform":"PLATFORM_UNSPECIFIED","pluginType":"GEMINI"}}' 2>/dev/null || echo 000)"
                gem_proj="$(jq -r '.cloudaicompanionProject | if type == "object" then .id else . end // empty' /tmp/gem-load.json 2>/dev/null)"
                [ -n "$gem_proj" ] && echo "$(date -u +%FT%TZ) gemini quota: tier $(jq -r '.currentTier.id // .currentTier.name // "?"' /tmp/gem-load.json 2>/dev/null)"
                [ -n "$gem_proj" ] || { gem_note "loadCodeAssist gave no project (HTTP ${code})"; return 0; }
              fi
              code="$(curl -sS --max-time 15 -o /tmp/gem-quota.json -w '%{http_code}' -X POST "${gem_cc}:retrieveUserQuota" \
                -H "Authorization: Bearer ${at}" -H 'Content-Type: application/json' \
                --data "$(jq -cn --arg p "$gem_proj" '{project:$p}')" 2>/dev/null || echo 000)"
              [ "$code" = 200 ] || { gem_note "retrieveUserQuota answered HTTP ${code}"; [ "$code" = 403 ] && gem_proj=""; return 0; }
              gem_err=""
              # "<model> <percent left>% (reset HH:MM UTC)" per bucket, and the gate: "0" when a model has quota left,
              # otherwise the earliest resetTime
              summary="$(jq -r '[.buckets[]? | select(.modelId and .remainingFraction != null)
                | "\(.modelId)\(if .tokenType and .tokenType != "REQUESTS" then "/" + .tokenType else "" end) \((.remainingFraction * 100) | floor)%"
                  + (if .remainingAmount then " (" + .remainingAmount + " left)" else "" end)] | join(", ")' /tmp/gem-quota.json 2>/dev/null)"
              st="$(jq -r '[.buckets[]? | select(.modelId and .remainingFraction != null)] as $b
                | if ($b | length) == 0 or ($b | any(.remainingFraction > 0)) then "0"
                  else ($b | map(.resetTime // empty | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) | if length == 0 then 0 else min end | tostring) end' \
                /tmp/gem-quota.json 2>/dev/null)"
              if [ "$summary" != "$gem_last" ]; then
                echo "$(date -u +%FT%TZ) gemini quota: ${summary:-no buckets}"; gem_last="$summary"
              fi
              [ -n "$st" ] && set_gate gemini "$st" "quota endpoint: ${summary}"
            }
            echo "run-dispatcher: at most ${MAX_ACTIVE} active runs, FIFO"
            last=""; usage_at=0
            while :; do
              sleep "$POLL_SECONDS"
              if [ $(( $(date +%s) - usage_at )) -ge "$USAGE_POLL_SECONDS" ]; then usage_at="$(date +%s)"; check_opencode_usage; check_gemini_usage; fi
              # Only what is needed from each run (a run carries its whole pipeline spec), read in pages
              : > /tmp/runs.jsonl; cont=""; ok=1
              while :; do
                code="$(api GET "${runs_path}?limit=50${cont:+&continue=$cont}" /tmp/page.json)"
                if [ "$code" != 200 ]; then echo "could not list PipelineRuns (HTTP $code)" >&2; ok=0; break; fi
                # pr: "<repo>#<number>" for pr-comment-agent runs (one active per PR). fold: runs with the same pr and fold
                # are interchangeable while waiting (plain comment runs); `@ai fix` requests and ci-fix runs get a unique key.
                jq -c '.items[] | ((.spec.params // []) | map({key: .name, value: .value}) | from_entries) as $p
                  | {name: .metadata.name, created: .metadata.creationTimestamp,
                  pending: (.spec.status == "PipelineRunPending"), done: (.status.completionTime != null),
                  pr: (if .spec.pipelineRef.name == "pr-comment-agent" and ($p["pr-number"] // "") != ""
                    then "\($p["repo-full-name"])#\($p["pr-number"])" else null end),
                  fold: (if ($p.mode // "comment") == "comment"
                    and ((($p["comment-body"] // "" | tostring) + "\n" | split("\n")[0] | ascii_downcase | gsub("\\s+"; " ") | ltrimstr(" ") | rtrimstr(" "))
                      | test("^@ai fix( ci)?$") | not)
                    then "comment" else .metadata.name end)}' \
                  /tmp/page.json >> /tmp/runs.jsonl
                cont="$(jq -r '.metadata.continue // "" | @uri' /tmp/page.json)"
                [ -n "$cont" ] || break
              done
              [ "$ok" = 1 ] || continue
              active="$(jq -s '[.[] | select((.pending | not) and (.done | not))] | length' /tmp/runs.jsonl)"
              # Oldest first: a run without a PR is a candidate; a PR run is folded into an older waiting run of the same PR,
              # or held while its PR has an active run (or an older candidate in this round)
              jq -rs '
                ([.[] | select((.pending | not) and (.done | not) and .pr != null) | {key: .pr, value: true}] | from_entries) as $busy
                | [.[] | select(.pending and (.done | not))] | sort_by(.created, .name)
                | reduce .[] as $r ({seen: {}, busy: $busy, out: []};
                    if $r.pr == null then .out += ["start \($r.name)"]
                    elif .seen["\($r.pr) \($r.fold)"] then .out += ["fold \($r.name) \(.seen["\($r.pr) \($r.fold)"])"]
                    else .seen["\($r.pr) \($r.fold)"] = $r.name
                      | if .busy[$r.pr] then .out += ["hold \($r.name)"] else .busy[$r.pr] = true | .out += ["start \($r.name)"] end
                    end)
                | .out[]' /tmp/runs.jsonl > /tmp/plan.txt
              waiting="$(grep -c '^start \|^hold ' /tmp/plan.txt)"
              held="$(grep -c '^hold ' /tmp/plan.txt)"
              while read -r verb run into; do
                [ "$verb" = fold ] || continue
                code="$(api DELETE "${runs_path}/${run}" /tmp/delete.json)"
                if [ "$code" = 200 ] || [ "$code" = 202 ]; then
                  echo "$(date -u +%FT%TZ) folded ${run} into ${into} (same pull request, still waiting; it reads the whole conversation)"
                else
                  echo "could not delete ${run} (HTTP ${code}): $(jq -r '.message // .' /tmp/delete.json 2>/dev/null)" >&2
                fi
              done < /tmp/plan.txt
              sed -n 's/^start //p' /tmp/plan.txt > /tmp/waiting.txt
              state="active ${active}/${MAX_ACTIVE}, waiting ${waiting} (${held} held behind a run of the same PR)"
              [ "$state" = "$last" ] || { echo "$(date -u +%FT%TZ) ${state}"; last="$state"; }
              free=$((MAX_ACTIVE - active))
              while [ "$free" -gt 0 ] && read -r run; do
                code="$(api PATCH "${runs_path}/${run}" /tmp/patch.json \
                  -H 'Content-Type: application/merge-patch+json' --data '{"spec":{"status":null}}')"
                if [ "$code" = 200 ]; then
                  echo "$(date -u +%FT%TZ) started ${run}"; free=$((free - 1))
                else
                  echo "could not start ${run} (HTTP ${code}): $(jq -r '.message // .' /tmp/patch.json 2>/dev/null)" >&2
                fi
              done < /tmp/waiting.txt
            done
