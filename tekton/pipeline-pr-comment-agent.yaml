apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: pr-comment-agent
  namespace: agents
spec:
  params:
    - name: event-type
      type: string
    - name: repo-url
      type: string
    - name: repo-full-name
      type: string
    - name: pr-number
      type: string
    - name: pr-title
      type: string
    - name: branch
      type: string
      default: ""
    - name: comment-author
      type: string
    - name: comment-body
      type: string
    - name: base-branch
      type: string
      default: master
    - name: skills-artifact
      type: string
      default: quay.io/pminkows/claude-ai-spring-boot:1.3.1
    # Build and test command run after the agent step. Empty: `mvn -B -ntp verify` when there is a pom.xml, otherwise nothing. `skip` disables it.
    - name: verify-command
      type: string
      default: ""
    - name: max-fix-attempts
      type: string
      default: "3"
  workspaces:
    - name: skills
  tasks:
    - name: print-event
      params:
        - name: event-type
          value: $(params.event-type)
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: pr-number
          value: $(params.pr-number)
        - name: pr-title
          value: $(params.pr-title)
        - name: branch
          value: $(params.branch)
        - name: comment-author
          value: $(params.comment-author)
        - name: comment-body
          value: $(params.comment-body)
      taskSpec:
        params:
          - name: event-type
            type: string
          - name: repo-full-name
            type: string
          - name: pr-number
            type: string
          - name: pr-title
            type: string
          - name: branch
            type: string
          - name: comment-author
            type: string
          - name: comment-body
            type: string
        steps:
          - name: print
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: EVENT_TYPE
                value: $(params.event-type)
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: PR_NUMBER
                value: $(params.pr-number)
              - name: PR_TITLE
                value: $(params.pr-title)
              - name: BRANCH
                value: $(params.branch)
              - name: COMMENT_AUTHOR
                value: $(params.comment-author)
              - name: COMMENT_BODY
                value: $(params.comment-body)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # fallback when the event carries no head branch: ask the public GitHub API (display only)
              if [ -z "$BRANCH" ]; then
                BRANCH="$(curl -fsS "https://api.github.com/repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}" | jq -er .head.ref 2>/dev/null || true)"
                BRANCH="${BRANCH:-(unknown, resolved later with the GitHub App token)}"
              fi

              echo "=============== PR comment event ==============="
              echo "Event type    : ${EVENT_TYPE}"
              echo "Repository    : ${REPO_FULL_NAME}"
              echo "PR number     : ${PR_NUMBER}"
              echo "PR title      : ${PR_TITLE}"
              echo "Branch        : ${BRANCH}"
              echo "Comment author: ${COMMENT_AUTHOR}"
              echo "Comment       :"
              printf '%s\n' "$COMMENT_BODY"
              echo "================================================"
    - name: fetch-skills
      runAfter:
        - print-event
      params:
        - name: skills-artifact
          value: $(params.skills-artifact)
      workspaces:
        - name: skills
          workspace: skills
      taskSpec:
        params:
          - name: skills-artifact
            type: string
        workspaces:
          - name: skills
            mountPath: /skills
        steps:
          - name: pull
            image: ghcr.io/oras-project/oras:v1.3.0
            workingDir: /skills
            command:
              - oras
            args:
              - pull
              - $(params.skills-artifact)
              - --output
              - /skills/artifact
          - name: unpack
            image: registry.access.redhat.com/ubi9/ubi:latest
            workingDir: /skills
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              # artifact: one tar.gz holding skills/ and agents/ in OpenCode format
              mkdir -p /skills/opencode
              for f in /skills/artifact/*.tar.gz; do tar -xzf "$f" -C /skills/opencode 2>/dev/null; done
              echo "Installed skills: $(ls /skills/opencode/skills | tr '\n' ' ')"
              echo "Installed agents: $(ls /skills/opencode/agents | tr '\n' ' ')"
    - name: handle-pr-comment
      runAfter:
        - fetch-skills
      timeout: "3h30m"
      workspaces:
        - name: skills
          workspace: skills
      params:
        - name: event-type
          value: $(params.event-type)
        - name: repo-url
          value: $(params.repo-url)
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: pr-number
          value: $(params.pr-number)
        - name: pr-title
          value: $(params.pr-title)
        - name: comment-author
          value: $(params.comment-author)
        - name: comment-body
          value: $(params.comment-body)
        - name: base-branch
          value: $(params.base-branch)
        - name: verify-command
          value: $(params.verify-command)
        - name: max-fix-attempts
          value: $(params.max-fix-attempts)
      taskSpec:
        params:
          - name: event-type
            type: string
          - name: repo-url
            type: string
          - name: repo-full-name
            type: string
          - name: pr-number
            type: string
          - name: pr-title
            type: string
          - name: comment-author
            type: string
          - name: comment-body
            type: string
          - name: base-branch
            type: string
          - name: verify-command
            type: string
          - name: max-fix-attempts
            type: string
        workspaces:
          - name: skills
            mountPath: /skills
            readOnly: true
        volumes:
          - name: work
            emptyDir: {}
          - name: config
            configMap:
              name: agent-config
        steps:
          # Resolves the PR, fetches its conversation and clones the head branch. Holds the GitHub App key, the agent step does not.
          - name: prepare
            image: quay.io/pminkows/opencode:latest
            workingDir: /workspace
            volumeMounts:
              - name: work
                mountPath: /workspace
              - name: config
                mountPath: /config
                readOnly: true
            env:
              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: app-id
              - name: GITHUB_APP_INSTALLATION_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: installation-id
              - name: GITHUB_APP_PRIVATE_KEY
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: private-key.pem
              - name: REPO_URL
                value: $(params.repo-url)
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: PR_NUMBER
                value: $(params.pr-number)
              - name: PR_TITLE
                value: $(params.pr-title)
              - name: HOME
                value: /workspace/home
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              mkdir -p "$HOME/.config/opencode" /workspace/out
              # Skills and agents fetched by the fetch-skills task
              cp -R /skills/opencode/. "$HOME/.config/opencode/"

              GH_TOKEN="$(bash /config/gh-app-token.sh)"
              export GH_TOKEN
              gh auth setup-git

              # Resolve the head branch from the PR itself (authoritative, also checks that the PR is open and not from a fork).
              # /workspace/skip tells the following steps there is nothing to do.
              PR_INFO="$(gh pr view "$PR_NUMBER" --repo "$REPO_FULL_NAME" --json state,headRefName,isCrossRepository)"
              PR_STATE="$(printf '%s' "$PR_INFO" | jq -r .state)"
              BRANCH="$(printf '%s' "$PR_INFO" | jq -r .headRefName)"
              CROSS_REPO="$(printf '%s' "$PR_INFO" | jq -r .isCrossRepository)"
              echo "PR #${PR_NUMBER} state=${PR_STATE} branch=${BRANCH} fork=${CROSS_REPO}"
              if [ "$PR_STATE" != "OPEN" ]; then
                echo "Pull request is not open; nothing to do"
                touch /workspace/skip
                exit 0
              fi
              if [ "$CROSS_REPO" = "true" ]; then
                gh pr comment "$PR_NUMBER" --repo "$REPO_FULL_NAME" \
                  --body "Pull requests from forks are not supported by the agent; no changes were made."
                touch /workspace/skip
                exit 0
              fi

              # Whole PR conversation: description, conversation comments, reviews and inline review comments
              {
                gh api --paginate "repos/${REPO_FULL_NAME}/issues/${PR_NUMBER}/comments" | jq -s 'add // [] | map({at: .created_at, who: .user.login, kind: "comment", text: .body})'
                gh api --paginate "repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}/reviews" | jq -s 'add // [] | map(select((.body // "") != "") | {at: .submitted_at, who: .user.login, kind: ("review (" + .state + ")"), text: .body})'
                gh api --paginate "repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}/comments" | jq -s 'add // [] | map({at: .created_at, who: .user.login, kind: ("inline comment on " + .path + ":" + ((.line // .original_line // 0) | tostring)), text: .body})'
              } | jq -s 'add | sort_by(.at)' > /workspace/conversation.json

              {
                printf '# Pull request #%s: %s\n\n' "$PR_NUMBER" "$PR_TITLE"
                gh pr view "$PR_NUMBER" --repo "$REPO_FULL_NAME" --json body -q '.body // ""'
                printf '\n## Conversation (oldest first)\n\n'
                jq -r '.[] | "### \(.who), \(.kind), \(.at)\n\(.text)\n"' /workspace/conversation.json
              } > /workspace/pr-conversation.md
              echo "=== PR conversation ($(jq length /workspace/conversation.json) messages) ==="
              cat /workspace/pr-conversation.md

              echo "=== Cloning repository, branch ${BRANCH} ==="
              git clone --branch "$BRANCH" -- "$REPO_URL" /workspace/repo
              echo "$BRANCH" > /workspace/branch
              # Short-lived token (1h) handed to the plan step; the GitHub App key stays in this step
              ( umask 077; printf '%s' "$GH_TOKEN" > /workspace/gh-token )

          # Planning: for a comment that requires code changes the agent writes a checklist to /workspace/out/plan.md and posts it
          # on the PR itself (only `gh pr comment` is allowed in opencode-plan.json). For a plain question it does nothing.
          # It gets the short-lived token from prepare, not the App key.
          - name: plan
            image: quay.io/pminkows/opencode:latest
            workingDir: /workspace/repo
            volumeMounts:
              - name: work
                mountPath: /workspace
              - name: config
                mountPath: /config
                readOnly: true
            computeResources:
              requests:
                memory: 1Gi
                cpu: 500m
              limits:
                memory: 2Gi
                cpu: "2"
            env:
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: PR_NUMBER
                value: $(params.pr-number)
              - name: EVENT_TYPE
                value: $(params.event-type)
              - name: COMMENT_AUTHOR
                value: $(params.comment-author)
              - name: COMMENT_BODY
                value: $(params.comment-body)
              - name: BASE_BRANCH
                value: $(params.base-branch)
              - name: HOME
                value: /workspace/home
              - name: OPENCODE_CONFIG
                value: /config/opencode-plan.json
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              if [ -f /workspace/skip ]; then
                echo "Nothing to do"
                exit 0
              fi

              GH_TOKEN="$(cat /workspace/gh-token)"
              export GH_TOKEN
              rm -f /workspace/gh-token

              BRANCH="$(cat /workspace/branch)"
              PLAN_PROMPT="You are working on the pull request below, on its head branch '${BRANCH}' (base branch '${BASE_BRANCH}').
              A new ${EVENT_TYPE} event was triggered by a comment from ${COMMENT_AUTHOR}:

              ----- NEW COMMENT -----
              ${COMMENT_BODY}
              -----------------------

              $(cat /workspace/pr-conversation.md)

              Decide whether this comment requires changes in the code. Do not implement anything yet.
              - If it is only a question or needs no code change, do nothing: do not write a plan and do not post anything.
              - If it requires changes, analyze the repository (inspect what the PR already changes with 'git diff origin/${BASE_BRANCH}...HEAD') and then:
                1. Write the plan to /workspace/out/plan.md. The first line is '### Implementation plan', followed by a GitHub markdown checklist: one '- [ ] ' line per concrete step, in the order you will carry the steps out (code changes, tests), 3 to 10 lines, no other text.
                2. Post it as a comment on the pull request with: gh pr comment ${PR_NUMBER} --repo ${REPO_FULL_NAME} --body-file /workspace/out/plan.md
              This is the only gh command you may run. Do not modify any file in the repository and do not write .agent-summary.md."

              echo "=== Planning ==="
              timeout 15m opencode run "$PLAN_PROMPT" 2>&1 | tee /workspace/plan.log \
                || echo "opencode exited with $? (timeout or error); continuing without a plan"

              # Planning must not leave changes behind
              git reset -q --hard
              git clean -qfd

          # Agent run. No GitHub credentials in this step; committing, pushing and gh are denied in opencode.json.
          - name: agent
            image: quay.io/pminkows/opencode:latest
            workingDir: /workspace/repo
            volumeMounts:
              - name: work
                mountPath: /workspace
              - name: config
                mountPath: /config
                readOnly: true
            computeResources:
              requests:
                memory: 1Gi
                cpu: 500m
              limits:
                memory: 2Gi
                cpu: "2"
            env:
              - name: EVENT_TYPE
                value: $(params.event-type)
              - name: COMMENT_AUTHOR
                value: $(params.comment-author)
              - name: COMMENT_BODY
                value: $(params.comment-body)
              - name: BASE_BRANCH
                value: $(params.base-branch)
              - name: HOME
                value: /workspace/home
              - name: OPENCODE_CONFIG
                value: /config/opencode.json
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              if [ -f /workspace/skip ]; then
                echo "Nothing to do"
                exit 0
              fi

              BRANCH="$(cat /workspace/branch)"
              PROMPT="You are working on the pull request below, on its head branch '${BRANCH}' (base branch '${BASE_BRANCH}'), following the repository's AGENTS.md.
              A new ${EVENT_TYPE} event was triggered by a comment from ${COMMENT_AUTHOR}. Act on THIS comment, using the rest of the conversation as context:

              ----- NEW COMMENT -----
              ${COMMENT_BODY}
              -----------------------

              The full pull request conversation (description, comments, reviews, inline comments) is below.

              $(cat /workspace/pr-conversation.md)

              Rules:
              - If the comment requests a change, implement it on the current branch, add or update tests where appropriate, and keep the change minimal. Inspect what the PR already changes with 'git diff origin/${BASE_BRANCH}...HEAD'.
              - If the comment is only a question or needs no code change, do not modify any file; answer it in the summary.
              - Pipeline context: you run non-interactively with no GitHub credentials; the pipeline handles git and the pull request reply, so ignore those sections of AGENTS.md. Use only the available tools (bash, read, edit, write, glob, grep, skill, task); there is no 'step', 'run' or 'todo' tool.
              - When done, write a 2-4 bullet summary to .agent-summary.md in the repository root (the pipeline posts it as the reply and removes it from the commit): what was changed in plain language (or the answer to the question), the test result, anything left undone or worth a reviewer's attention."
              if [ -s /workspace/out/plan.md ]; then
                PROMPT="$PROMPT

              Follow this plan:
              $(cat /workspace/out/plan.md)"
              fi

              echo "=== Running opencode ==="
              timeout 2h opencode run "$PROMPT" 2>&1 | tee /workspace/opencode.log \
                || echo "opencode exited with $? (timeout or error); continuing"

              # Only sources: never commit build output (target/ is tracked in this repo) or the agent summary
              if [ -f .agent-summary.md ]; then mv .agent-summary.md /workspace/out/summary.md; fi

          # Build and test the result. If the build fails, the agent gets the log and fixes it (see verify.sh in agent-config).
          # Never fails the step: when the build stays red, publish opens a draft pull request with the build log.
          - name: verify
            image: quay.io/pminkows/opencode:latest
            workingDir: /workspace/repo
            volumeMounts:
              - name: work
                mountPath: /workspace
              - name: config
                mountPath: /config
                readOnly: true
            computeResources:
              requests:
                memory: 1Gi
                cpu: 500m
              limits:
                memory: 3Gi
                cpu: "2"
            env:
              - name: VERIFY_COMMAND
                value: $(params.verify-command)
              - name: MAX_FIX_ATTEMPTS
                value: $(params.max-fix-attempts)
              - name: HOME
                value: /workspace/home
              - name: OPENCODE_CONFIG
                value: /config/opencode.json
            script: |
              #!/usr/bin/env bash
              exec bash /config/verify.sh

          # Commit, push and PR reply. Mints a fresh token: the agent run may outlast the 1h token lifetime.
          - name: publish
            image: quay.io/pminkows/opencode:latest
            workingDir: /workspace/repo
            volumeMounts:
              - name: work
                mountPath: /workspace
              - name: config
                mountPath: /config
                readOnly: true
            env:
              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: app-id
              - name: GITHUB_APP_INSTALLATION_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: installation-id
              - name: GITHUB_APP_PRIVATE_KEY
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: private-key.pem
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: PR_NUMBER
                value: $(params.pr-number)
              - name: HOME
                value: /workspace/home
              - name: GIT_AUTHOR_NAME
                value: ai-software-factory-agent[bot]
              - name: GIT_AUTHOR_EMAIL
                value: 5642464+ai-software-factory-agent[bot]@users.noreply.github.com
              - name: GIT_COMMITTER_NAME
                value: ai-software-factory-agent[bot]
              - name: GIT_COMMITTER_EMAIL
                value: 5642464+ai-software-factory-agent[bot]@users.noreply.github.com
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              if [ -f /workspace/skip ]; then
                echo "Nothing to do"
                exit 0
              fi

              BRANCH="$(cat /workspace/branch)"

              # Installation tokens expire after 1h and the agent run can take longer, so mint the token only now
              GH_TOKEN="$(bash /config/gh-app-token.sh)"
              export GH_TOKEN

              # Result of the verify step goes in front of the reply
              if [ -s /workspace/out/verify-note.md ]; then
                { cat /workspace/out/verify-note.md; echo; cat /workspace/out/summary.md 2>/dev/null || true; } > /workspace/out/summary.full.md
                mv /workspace/out/summary.full.md /workspace/out/summary.md
              fi

              if [ -n "$(git status --porcelain -uall -- . ':(exclude)**/target/**')" ]; then
                git add -A -- . ':(exclude)**/target/**'
                git commit -m "fix: address comment on pull request #${PR_NUMBER}" -m "Refs #${PR_NUMBER}"
                git push origin "$BRANCH"
              fi

              echo "=== Replying on the pull request ==="
              if [ -s /workspace/out/summary.md ]; then
                gh pr comment "$PR_NUMBER" --repo "$REPO_FULL_NAME" --body-file /workspace/out/summary.md
              fi
  # Runs after the tasks, also when they failed or timed out: tells the issue or pull request that nothing came out of this run
  finally:
    - name: report-failure
      when:
        - input: $(tasks.status)
          operator: in
          values:
            - Failed
      params:
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: number
          value: $(params.pr-number)
        - name: pipelinerun
          value: $(context.pipelineRun.name)
        - name: namespace
          value: $(context.pipelineRun.namespace)
      taskSpec:
        params:
          - name: repo-full-name
            type: string
          - name: number
            type: string
          - name: pipelinerun
            type: string
          - name: namespace
            type: string
        volumes:
          - name: config
            configMap:
              name: agent-config
        steps:
          - name: comment
            image: quay.io/pminkows/opencode:latest
            volumeMounts:
              - name: config
                mountPath: /config
                readOnly: true
            env:
              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: app-id
              - name: GITHUB_APP_INSTALLATION_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: installation-id
              - name: GITHUB_APP_PRIVATE_KEY
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: private-key.pem
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: NUMBER
                value: $(params.number)
              - name: PIPELINERUN
                value: $(params.pipelinerun)
              - name: PIPELINERUN_NAMESPACE
                value: $(params.namespace)
              - name: HOME
                value: /tmp
            script: |
              #!/usr/bin/env bash
              set -uo pipefail

              GH_TOKEN="$(bash /config/gh-app-token.sh)" || { echo "Could not mint a GitHub token, no comment posted"; exit 0; }
              export GH_TOKEN

              printf ':x: **The agent run failed.** Your comment was not handled.\n\nPipeline run `%s` in namespace `%s`. Logs: `tkn pipelinerun logs %s -n %s`\n\nUsual causes: the model endpoint was not available, the run hit its timeout, or the agent produced no changes. To retry, comment on the pull request again.\n' \
                "$PIPELINERUN" "$PIPELINERUN_NAMESPACE" "$PIPELINERUN" "$PIPELINERUN_NAMESPACE" > /tmp/failure.md

              gh pr comment "$NUMBER" --repo "$REPO_FULL_NAME" --body-file /tmp/failure.md || echo "Could not post the failure comment"
