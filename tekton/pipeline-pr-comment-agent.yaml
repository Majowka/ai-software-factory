apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: pr-comment-agent
  namespace: agents
spec:
  params:
    - name: event-type
      type: string
    - name: repo-url
      type: string
    - name: repo-full-name
      type: string
    - name: pr-number
      type: string
    - name: pr-title
      type: string
    - name: branch
      type: string
      default: ""
    - name: comment-author
      type: string
    - name: comment-body
      type: string
    - name: base-branch
      type: string
      default: master
    - name: skills-artifact
      type: string
      default: quay.io/pminkows/claude-ai-spring-boot:1.3.2
    # Build and test command run after the agent step. Empty: the verify--<owner>--<repo>.sh script from agent-config when
    # there is one, otherwise `mvn -B -ntp verify` when there is a pom.xml, otherwise nothing. `skip` disables it.
    - name: verify-command
      type: string
      default: ""
    - name: max-fix-attempts
      type: string
      default: "3"
  workspaces:
    - name: skills
    - name: work
  tasks:
    - name: authorize
      taskRef:
        name: authorize-author
      params:
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: author
          value: $(params.comment-author)
    - name: print-event
      runAfter:
        - authorize
      params:
        - name: event-type
          value: $(params.event-type)
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: pr-number
          value: $(params.pr-number)
        - name: pr-title
          value: $(params.pr-title)
        - name: branch
          value: $(params.branch)
        - name: comment-author
          value: $(params.comment-author)
        - name: comment-body
          value: $(params.comment-body)
      taskSpec:
        params:
          - name: event-type
            type: string
          - name: repo-full-name
            type: string
          - name: pr-number
            type: string
          - name: pr-title
            type: string
          - name: branch
            type: string
          - name: comment-author
            type: string
          - name: comment-body
            type: string
        steps:
          - name: print
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: EVENT_TYPE
                value: $(params.event-type)
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: PR_NUMBER
                value: $(params.pr-number)
              - name: PR_TITLE
                value: $(params.pr-title)
              - name: BRANCH
                value: $(params.branch)
              - name: COMMENT_AUTHOR
                value: $(params.comment-author)
              - name: COMMENT_BODY
                value: $(params.comment-body)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # fallback when the event carries no head branch: ask the public GitHub API (display only)
              if [ -z "$BRANCH" ]; then
                BRANCH="$(curl -fsS "https://api.github.com/repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}" | jq -er .head.ref 2>/dev/null || true)"
                BRANCH="${BRANCH:-(unknown, resolved later with the GitHub App token)}"
              fi

              echo "=============== PR comment event ==============="
              echo "Event type    : ${EVENT_TYPE}"
              echo "Repository    : ${REPO_FULL_NAME}"
              echo "PR number     : ${PR_NUMBER}"
              echo "PR title      : ${PR_TITLE}"
              echo "Branch        : ${BRANCH}"
              echo "Comment author: ${COMMENT_AUTHOR}"
              echo "Comment       :"
              printf '%s\n' "$COMMENT_BODY"
              echo "================================================"
    - name: fetch-skills
      runAfter:
        - print-event
      taskRef:
        name: fetch-skills
      params:
        - name: skills-artifact
          value: $(params.skills-artifact)
      workspaces:
        - name: skills
          workspace: skills
    - name: handle-pr-comment
      runAfter:
        - fetch-skills
      workspaces:
        - name: skills
          workspace: skills
        - name: work
          workspace: work
      params:
        - name: event-type
          value: $(params.event-type)
        - name: repo-url
          value: $(params.repo-url)
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: pr-number
          value: $(params.pr-number)
        - name: pr-title
          value: $(params.pr-title)
        - name: comment-author
          value: $(params.comment-author)
        - name: comment-body
          value: $(params.comment-body)
        - name: base-branch
          value: $(params.base-branch)
      taskSpec:
        params:
          - name: event-type
            type: string
          - name: repo-url
            type: string
          - name: repo-full-name
            type: string
          - name: pr-number
            type: string
          - name: pr-title
            type: string
          - name: comment-author
            type: string
          - name: comment-body
            type: string
          - name: base-branch
            type: string
        workspaces:
          - name: skills
            mountPath: /skills
            readOnly: true
          - name: work
            mountPath: /workspace
        volumes:
          - name: config
            configMap:
              name: agent-config
        steps:
          # Resolves the PR, fetches its conversation and clones the head branch. Holds the GitHub App key, the agent step does not.
          - name: prepare
            image: ghcr.io/majowka/factory-agent:latest
            workingDir: /workspace
            volumeMounts:
              - name: config
                mountPath: /config
                readOnly: true
            env:
              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: app-id
              - name: GITHUB_APP_INSTALLATION_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: installation-id
              - name: GITHUB_APP_PRIVATE_KEY
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: private-key.pem
              - name: REPO_URL
                value: $(params.repo-url)
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: PR_NUMBER
                value: $(params.pr-number)
              - name: PR_TITLE
                value: $(params.pr-title)
              - name: HOME
                value: /workspace/home
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Skills and agents fetched by the fetch-skills task, installed for both engines
              bash /config/agent-home.sh /skills/opencode

              GH_TOKEN="$(bash /config/gh-app-token.sh)"
              export GH_TOKEN
              # Labels of the issue / PR: engine:<opencode|claude> or engine-<task>:<engine> override routing.env (agent-run.sh)
              gh pr view "$PR_NUMBER" --repo "$REPO_FULL_NAME" --json labels -q '.labels[].name' > /workspace/agent-labels || true
              gh auth setup-git

              # Resolve the head branch from the PR itself (authoritative, also checks that the PR is open and not from a fork).
              # /workspace/skip tells the following steps there is nothing to do.
              PR_INFO="$(gh pr view "$PR_NUMBER" --repo "$REPO_FULL_NAME" --json state,headRefName,isCrossRepository)"
              PR_STATE="$(printf '%s' "$PR_INFO" | jq -r .state)"
              BRANCH="$(printf '%s' "$PR_INFO" | jq -r .headRefName)"
              CROSS_REPO="$(printf '%s' "$PR_INFO" | jq -r .isCrossRepository)"
              echo "PR #${PR_NUMBER} state=${PR_STATE} branch=${BRANCH} fork=${CROSS_REPO}"
              if [ "$PR_STATE" != "OPEN" ]; then
                echo "Pull request is not open; nothing to do"
                touch /workspace/skip
                exit 0
              fi
              if [ "$CROSS_REPO" = "true" ]; then
                gh pr comment "$PR_NUMBER" --repo "$REPO_FULL_NAME" \
                  --body "Pull requests from forks are not supported by the agent; no changes were made."
                touch /workspace/skip
                exit 0
              fi

              # Whole PR conversation: description, conversation comments, reviews and inline review comments
              {
                gh api --paginate "repos/${REPO_FULL_NAME}/issues/${PR_NUMBER}/comments" | jq -s 'add // [] | map({at: .created_at, who: .user.login, kind: "comment", text: .body})'
                gh api --paginate "repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}/reviews" | jq -s 'add // [] | map(select((.body // "") != "") | {at: .submitted_at, who: .user.login, kind: ("review (" + .state + ")"), text: .body})'
                gh api --paginate "repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}/comments" | jq -s 'add // [] | map({at: .created_at, who: .user.login, kind: ("inline comment on " + .path + ":" + ((.line // .original_line // 0) | tostring)), text: .body})'
              } | jq -s 'add | sort_by(.at)' > /workspace/conversation.json

              {
                printf '# Pull request #%s: %s\n\n' "$PR_NUMBER" "$PR_TITLE"
                gh pr view "$PR_NUMBER" --repo "$REPO_FULL_NAME" --json body -q '.body // ""'
                printf '\n## Conversation (oldest first)\n\n'
                jq -r '.[] | "### \(.who), \(.kind), \(.at)\n\(.text)\n"' /workspace/conversation.json
              } > /workspace/pr-conversation.md
              echo "=== PR conversation ($(jq length /workspace/conversation.json) messages) ==="
              cat /workspace/pr-conversation.md

              echo "=== Cloning repository, branch ${BRANCH} ==="
              git clone --branch "$BRANCH" -- "$REPO_URL" /workspace/repo
              echo "$BRANCH" > /workspace/branch
              # Short-lived token (1h) handed to the plan step; the GitHub App key stays in this step
              ( umask 077; printf '%s' "$GH_TOKEN" > /workspace/gh-token )

          # Planning: for a comment that requires code changes the agent writes a checklist to /workspace/out/plan.md and posts it
          # on the PR itself (the script posts it with `gh pr comment`; the agent has no GitHub credentials). For a plain question it does nothing.
          # It gets the short-lived token from prepare, not the App key.
          - name: plan
            image: ghcr.io/majowka/factory-agent:latest
            workingDir: /workspace
            volumeMounts:
              - name: config
                mountPath: /config
                readOnly: true
            computeResources:
              requests:
                memory: 1Gi
                cpu: 500m
              limits:
                memory: 2Gi
                cpu: "2"
            env:
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: PR_NUMBER
                value: $(params.pr-number)
              - name: EVENT_TYPE
                value: $(params.event-type)
              - name: COMMENT_AUTHOR
                value: $(params.comment-author)
              - name: COMMENT_BODY
                value: $(params.comment-body)
              - name: BASE_BRANCH
                value: $(params.base-branch)
              - name: HOME
                value: /workspace/home
              - name: OPENCODE_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: opencode-go
                    key: api-key
                    optional: true
              - name: CLAUDE_CODE_OAUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: claude-code-oauth
                    key: token
                    optional: true
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # The repo is cloned by the prepare step: a workingDir of /workspace/repo would be created as root by Tekton and could not be cloned into
              cd /workspace/repo

              if [ -f /workspace/skip ]; then
                echo "Nothing to do"
                exit 0
              fi

              # The short-lived token stays in this script: the agent gets no GitHub credentials, the script posts the plan
              PLAN_GH_TOKEN="$(cat /workspace/gh-token)"
              rm -f /workspace/gh-token

              BRANCH="$(cat /workspace/branch)"
              PLAN_PROMPT="You are working on the pull request below, on its head branch '${BRANCH}' (base branch '${BASE_BRANCH}').
              A new ${EVENT_TYPE} event was triggered by a comment from ${COMMENT_AUTHOR}:

              ----- NEW COMMENT -----
              ${COMMENT_BODY}
              -----------------------

              $(cat /workspace/pr-conversation.md)

              Decide whether this comment requires changes in the code. Do not implement anything yet.
              - If it is only a question or needs no code change, do nothing: do not write a plan and do not post anything.
              - If it contains review remarks or change requests, do NOT accept them blindly. First load the 'review-triage' skill with the skill tool and follow it to triage every remark as a separate point; inspect the repository (including what the PR already changes, with 'git diff origin/${BASE_BRANCH}...HEAD') to verify each remark against the actual code. Then:
                1. Write the result to /workspace/out/plan.md with exactly these two sections and no other text:
                   '### Implementation plan' followed by a GitHub markdown checklist: one '- [ ] ' line per concrete step, in the order you will carry the steps out (code changes, tests), up to 10 lines. When nothing is accepted, write the single line '_No code changes._' instead of the checklist.
                   '### Not doing' followed by one '- ' line per point that is rejected or only partly accepted: quote or name the point in a few words, then the reason in one sentence. When every point is accepted, write '_Nothing skipped._'.
              The pipeline posts the plan for you: do not run gh. Do not modify any file in the repository and do not write .agent-summary.md."

              bash /config/agent-run.sh plan 15m /workspace/plan.log "$PLAN_PROMPT" || echo "Continuing without a plan"
              if [ -s /workspace/out/plan.md ]; then
                GH_TOKEN="$PLAN_GH_TOKEN" gh pr comment "$PR_NUMBER" --repo "$REPO_FULL_NAME" --body-file /workspace/out/plan.md \
                  || echo "Could not post the plan"
              fi

              # Planning must not leave changes behind
              git reset -q --hard
              git clean -qfd

          # Agent run. No GitHub credentials in this step; committing, pushing and gh are denied in opencode.json and claude-settings.json.
          - name: agent
            image: ghcr.io/majowka/factory-agent:latest
            workingDir: /workspace
            volumeMounts:
              - name: config
                mountPath: /config
                readOnly: true
            computeResources:
              requests:
                memory: 1Gi
                cpu: 500m
              limits:
                memory: 2Gi
                cpu: "2"
            env:
              - name: EVENT_TYPE
                value: $(params.event-type)
              - name: COMMENT_AUTHOR
                value: $(params.comment-author)
              - name: COMMENT_BODY
                value: $(params.comment-body)
              - name: BASE_BRANCH
                value: $(params.base-branch)
              - name: HOME
                value: /workspace/home
              - name: OPENCODE_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: opencode-go
                    key: api-key
                    optional: true
              - name: CLAUDE_CODE_OAUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: claude-code-oauth
                    key: token
                    optional: true
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # The repo is cloned by the prepare step: a workingDir of /workspace/repo would be created as root by Tekton and could not be cloned into
              cd /workspace/repo

              if [ -f /workspace/skip ]; then
                echo "Nothing to do"
                exit 0
              fi

              BRANCH="$(cat /workspace/branch)"
              PROMPT="You are working on the pull request below, on its head branch '${BRANCH}' (base branch '${BASE_BRANCH}'), following the repository's AGENTS.md.
              A new ${EVENT_TYPE} event was triggered by a comment from ${COMMENT_AUTHOR}. Act on THIS comment, using the rest of the conversation as context:

              ----- NEW COMMENT -----
              ${COMMENT_BODY}
              -----------------------

              The full pull request conversation (description, comments, reviews, inline comments) is below.

              $(cat /workspace/pr-conversation.md)

              Rules:
              - Review remarks are not orders. Load the 'review-triage' skill with the skill tool and follow it. If the comment requests a change, implement only the points that are accepted, add or update tests where appropriate, and keep the change minimal. Inspect what the PR already changes with 'git diff origin/${BASE_BRANCH}...HEAD'.
              - If the comment is only a question or needs no code change, do not modify any file; answer it in the summary.
              - Pipeline context: you run non-interactively with no GitHub credentials; the pipeline handles git and the pull request reply, so ignore those sections of AGENTS.md. Use only the available tools (bash, read, edit, write, glob, grep, skill, task); there is no 'step', 'run' or 'todo' tool.
              - When done, write a short summary to .agent-summary.md in the repository root (the pipeline posts it as the reply and removes it from the commit). When the comment contained review remarks, go through them one by one in the reply format of the 'review-triage' skill. Then add the test result and anything left undone or worth a reviewer's attention. For a plain question, give the answer."
              if [ -s /workspace/out/plan.md ]; then
                PROMPT="$PROMPT

              A triage of the remarks was already done and posted on the pull request. Implement exactly the items of the checklist under 'Implementation plan'. Do not implement anything listed under 'Not doing' (unless it turns out to be needed for a checklist item; then say so in the summary), and report those points as not done with their reason. If the plan says no code changes, do not modify any file.

              $(cat /workspace/out/plan.md)"
              fi

              bash /config/agent-run.sh implement 3h /workspace/agent.log "$PROMPT" || echo "Continuing"

              # Only sources: never commit build output (target/ is tracked in this repo) or the agent summary
              if [ -f .agent-summary.md ]; then mv .agent-summary.md /workspace/out/summary.md; fi

    - name: verify
      runAfter:
        - handle-pr-comment
      taskRef:
        name: verify-build
      workspaces:
        - name: work
          workspace: work
      params:
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: verify-command
          value: $(params.verify-command)
        - name: max-fix-attempts
          value: $(params.max-fix-attempts)
    - name: publish
      runAfter:
        - verify
      workspaces:
        - name: work
          workspace: work
      params:
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: pr-number
          value: $(params.pr-number)
      taskSpec:
        params:
          - name: repo-full-name
            type: string
          - name: pr-number
            type: string
        workspaces:
          - name: work
            mountPath: /workspace
        volumes:
          - name: config
            configMap:
              name: agent-config
        steps:
          # Commit, push and PR reply. Mints a fresh token: the agent run may outlast the 1h token lifetime.
          - name: publish
            image: ghcr.io/majowka/factory-agent:latest
            workingDir: /workspace
            volumeMounts:
              - name: config
                mountPath: /config
                readOnly: true
            env:
              - name: GITHUB_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: app-id
              - name: GITHUB_APP_INSTALLATION_ID
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: installation-id
              - name: GITHUB_APP_PRIVATE_KEY
                valueFrom:
                  secretKeyRef:
                    name: github-app
                    key: private-key.pem
              - name: REPO_FULL_NAME
                value: $(params.repo-full-name)
              - name: PR_NUMBER
                value: $(params.pr-number)
              - name: HOME
                value: /workspace/home
              - name: GIT_AUTHOR_NAME
                value: klaudiuszai[bot]
              - name: GIT_AUTHOR_EMAIL
                value: 290278935+klaudiuszai[bot]@users.noreply.github.com
              - name: GIT_COMMITTER_NAME
                value: klaudiuszai[bot]
              - name: GIT_COMMITTER_EMAIL
                value: 290278935+klaudiuszai[bot]@users.noreply.github.com
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # The repo is cloned by the prepare step: a workingDir of /workspace/repo would be created as root by Tekton and could not be cloned into
              cd /workspace/repo

              if [ -f /workspace/skip ]; then
                echo "Nothing to do"
                exit 0
              fi

              BRANCH="$(cat /workspace/branch)"

              # Installation tokens expire after 1h and the agent run can take longer, so mint the token only now
              GH_TOKEN="$(bash /config/gh-app-token.sh)"
              export GH_TOKEN

              # Result of the verify step goes in front of the reply
              if [ -s /workspace/out/verify-note.md ]; then
                { cat /workspace/out/verify-note.md; echo; cat /workspace/out/summary.md 2>/dev/null || true; } > /workspace/out/summary.full.md
                mv /workspace/out/summary.full.md /workspace/out/summary.md
              fi

              if [ -n "$(git status --porcelain -uall -- . ':(exclude)**/target/**')" ]; then
                git add -A -- . ':(exclude)**/target/**'
                git commit -m "fix: address comment on pull request #${PR_NUMBER}" -m "Refs #${PR_NUMBER}"
                git push origin "$BRANCH"
              fi

              echo "=== Replying on the pull request ==="
              if [ -s /workspace/out/summary.md ]; then
                gh pr comment "$PR_NUMBER" --repo "$REPO_FULL_NAME" --body-file /workspace/out/summary.md
              fi
  # Runs after the tasks, also when they failed or timed out: tells the issue or pull request that nothing came out of this run
  finally:
    - name: report-failure
      when:
        - input: $(tasks.status)
          operator: in
          values:
            - Failed
        - input: $(tasks.authorize.status)
          operator: notin
          values:
            - Failed
      taskRef:
        name: report-failure
      params:
        - name: repo-full-name
          value: $(params.repo-full-name)
        - name: number
          value: $(params.pr-number)
        - name: target
          value: pr
        - name: what
          value: "Your comment was not handled."
        - name: retry-hint
          value: "To retry, comment on the pull request again."
        - name: pipelinerun
          value: $(context.pipelineRun.name)
        - name: namespace
          value: $(context.pipelineRun.namespace)
