# check_suite (completed, failed) of a commit that belongs to a pull request in the same repository
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: ci-failure
  namespace: agents
spec:
  params:
    - name: head-sha
      value: $(body.check_suite.head_sha)
    - name: event-type
      value: $(header.X-Github-Event)
    - name: repo-url
      value: $(body.repository.clone_url)
    - name: repo-full-name
      value: $(body.repository.full_name)
    - name: pr-number
      value: $(body.check_suite.pull_requests[0].number)
    - name: branch
      value: $(body.check_suite.head_branch)
    - name: check-app
      value: $(body.check_suite.app.slug)
    - name: base-branch
      value: $(body.repository.default_branch)
