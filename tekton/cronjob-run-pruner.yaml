# Every 15 minutes: deletes finished PipelineRuns, so the nodes do not run out of disk.
# Every run gets its own `work` PVC from a volumeClaimTemplate, and Tekton removes it only together with the
# PipelineRun. Nothing in plain Tekton prunes runs, so without this they and their volumes pile up for ever.
# Deleting only the PVC does not help: the pods of the finished TaskRuns still name it, and the pvc-protection
# finalizer keeps it (and the local-path data on the node) until those pods are gone. So the whole run goes, with
# its TaskRuns, pods, logs and PVCs (background propagation), once it finished more than RUN_KEEP_HOURS ago,
# except the KEEP_LAST most recently finished runs. Runs that have not finished (no completionTime) are never touched.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: run-pruner
  namespace: agents
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: run-pruner
          restartPolicy: Never
          containers:
            - name: prune
              image: ghcr.io/majowka/factory-agent:latest
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
              env:
                - name: RUN_KEEP_HOURS
                  value: "3"
                - name: KEEP_LAST
                  value: "10"
                # Print what would be deleted without deleting anything
                - name: DRY_RUN
                  value: "false"
                - name: HOME
                  value: /tmp
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              command: [bash, -c]
              args:
              - |
                #!/usr/bin/env bash
                set -euo pipefail
                # The agent image has no kubectl or oc: call the API with the service account token
                sa=/var/run/secrets/kubernetes.io/serviceaccount
                api() {
                  local method="$1" path="$2"; shift 2
                  curl -sS --cacert "$sa/ca.crt" -H "Authorization: Bearer $(cat "$sa/token")" \
                    -H 'Content-Type: application/json' -X "$method" "https://kubernetes.default.svc${path}" "$@"
                }
                delete() {
                  local kind="$1" path="$2" name="$3" code
                  if [ "$DRY_RUN" = "true" ]; then echo "would delete $kind $name"; return 0; fi
                  code="$(api DELETE "$path/$name" -o /tmp/response.json -w '%{http_code}' \
                    --data '{"kind":"DeleteOptions","apiVersion":"v1","propagationPolicy":"Background"}')"
                  case "$code" in
                    200|202) echo "deleted $kind $name" ;;
                    404) echo "already gone: $kind $name" ;;
                    *) echo "could not delete $kind $name (HTTP $code): $(jq -r '.message // .' /tmp/response.json)" >&2; failed=1 ;;
                  esac
                }

                runs_path="/apis/tekton.dev/v1/namespaces/${NAMESPACE}/pipelineruns"
                api GET "$runs_path" --fail > /tmp/runs.json
                now="$(date +%s)"
                failed=0

                # Finished runs as {name, age in seconds}, newest first
                jq --argjson now "$now" '[.items[] | select(.status.completionTime != null)
                  | {name: .metadata.name, age: ($now - (.status.completionTime | fromdateiso8601))}] | sort_by(.age)' \
                  /tmp/runs.json > /tmp/finished.json
                echo "runs: $(jq '.items | length' /tmp/runs.json) ($(jq length /tmp/finished.json) finished)"

                # Runs that finished more than RUN_KEEP_HOURS ago, apart from the KEEP_LAST newest finished ones
                jq -r --argjson keep "$((RUN_KEEP_HOURS * 3600))" --argjson last "$KEEP_LAST" \
                  '.[$last:][] | select(.age > $keep) | .name' /tmp/finished.json > /tmp/old-runs.txt
                while read -r run; do delete PipelineRun "$runs_path" "$run"; done < /tmp/old-runs.txt

                exit "$failed"
