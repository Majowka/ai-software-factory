# Newer Tekton Triggers releases need this on top of the RoleBinding: the listener reads ClusterInterceptors, which are cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: issue-agent-listener
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
subjects:
  - kind: ServiceAccount
    name: issue-agent-listener
    namespace: agents
