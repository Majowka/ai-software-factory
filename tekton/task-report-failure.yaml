apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: report-failure
  namespace: agents
spec:
  description: Comments on the issue or pull request that the run failed, with the name of the PipelineRun. Meant for the finally section of a pipeline.
  params:
    - name: repo-full-name
      type: string
    - name: number
      type: string
      description: Issue or pull request number.
    - name: target
      type: string
      default: issue
      description: "`issue` or `pr`."
    - name: what
      type: string
      description: What was not done, for example "No pull request was created from this run."
    - name: retry-hint
      type: string
      description: How to run it again.
    - name: pipelinerun
      type: string
    - name: namespace
      type: string
  volumes:
    - name: config
      configMap:
        name: agent-config
  steps:
    - name: comment
      image: ghcr.io/majowka/factory-agent:latest
      volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
      env:
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: github-app
              key: app-id
        - name: GITHUB_APP_INSTALLATION_ID
          valueFrom:
            secretKeyRef:
              name: github-app
              key: installation-id
        - name: GITHUB_APP_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: github-app
              key: private-key.pem
        - name: REPO_FULL_NAME
          value: $(params.repo-full-name)
        - name: NUMBER
          value: $(params.number)
        - name: TARGET
          value: $(params.target)
        - name: WHAT
          value: $(params.what)
        - name: RETRY_HINT
          value: $(params.retry-hint)
        - name: PIPELINERUN
          value: $(params.pipelinerun)
        - name: PIPELINERUN_NAMESPACE
          value: $(params.namespace)
        - name: HOME
          value: /tmp
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        GH_TOKEN="$(bash /config/gh-app-token.sh)" || { echo "Could not mint a GitHub token, no comment posted"; exit 0; }
        export GH_TOKEN

        printf ':x: **The agent run failed.** %s\n\nPipeline run `%s` in namespace `%s`. Logs: `tkn pipelinerun logs %s -n %s`\n\nUsual causes: the model endpoint was not available, the run hit its timeout, or the agent produced no changes. %s\n' \
          "$WHAT" "$PIPELINERUN" "$PIPELINERUN_NAMESPACE" "$PIPELINERUN" "$PIPELINERUN_NAMESPACE" "$RETRY_HINT" > /tmp/failure.md

        # REST, not `gh issue/pr comment` (GraphQL, which failed with "Something went wrong" on 2026-11-25); a PR is an
        # issue for this endpoint. Three tries, so a passing GitHub error does not leave the failure silent.
        for try in 1 2 3; do
          if gh api -X POST "repos/${REPO_FULL_NAME}/issues/${NUMBER}/comments" -F body=@/tmp/failure.md --silent; then
            echo "Failure comment posted"; exit 0
          fi
          sleep $((try * 10))
        done
        echo "Could not post the failure comment"
