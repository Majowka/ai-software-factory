apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: run-dispatcher
  namespace: agents
rules:
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
    verbs:
      - list
      - patch
      - delete
  # Quota gate Leases (llm-block-<engine>) read by agent-run.sh
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
