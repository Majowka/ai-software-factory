apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: new-issue
  namespace: agents
spec:
  # Trusted authors: org members with a public membership arrive as MEMBER; private members arrive as NONE, so their
  # GitHub user ids are listed here too (175831 = kamcio2603). Add an id to all four filters.
  serviceAccountName: issue-agent-listener
  triggers:
    - bindings:
        - kind: TriggerBinding
          ref: new-issue
      interceptors:
        - params:
            - name: secretRef
              value:
                secretKey: secret
                secretName: github-webhook-secret
            - name: eventTypes
              value:
                - issues
          ref:
            kind: ClusterInterceptor
            name: github
        - params:
            - name: filter
              value: body.action == 'opened' && (body.issue.author_association in
                ['OWNER', 'MEMBER', 'COLLABORATOR'] || int(body.issue.user.id) in [175831]
                || body.issue.user.login == 'klaudiuszai[bot]') && !body.issue.labels.exists(l,
                l.name in ['manual', 'requirements'])
          ref:
            kind: ClusterInterceptor
            name: cel
      name: new-issue
      template:
        ref: new-issue
    - bindings:
        - kind: TriggerBinding
          ref: pr-review-comment
      interceptors:
        - params:
            - name: secretRef
              value:
                secretKey: secret
                secretName: github-webhook-secret
            - name: eventTypes
              value:
                - pull_request_review_comment
          ref:
            kind: ClusterInterceptor
            name: github
        - params:
            - name: filter
              value: body.action == 'created' && body.pull_request.state == 'open'
                && body.sender.type != 'Bot' && (body.comment.author_association in
                ['OWNER', 'MEMBER', 'COLLABORATOR'] || int(body.comment.user.id) in [175831])
          ref:
            kind: ClusterInterceptor
            name: cel
      name: pr-review-comment
      template:
        ref: pr-comment
    - bindings:
        - kind: TriggerBinding
          ref: pr-review
      interceptors:
        - params:
            - name: secretRef
              value:
                secretKey: secret
                secretName: github-webhook-secret
            - name: eventTypes
              value:
                - pull_request_review
          ref:
            kind: ClusterInterceptor
            name: github
        - params:
            - name: filter
              value: body.action == 'submitted' && body.pull_request.state == 'open'
                && body.sender.type != 'Bot' && (body.review.author_association in
                ['OWNER', 'MEMBER', 'COLLABORATOR'] || int(body.review.user.id) in [175831]) && body.review.body != null && body.review.body
                != ''
          ref:
            kind: ClusterInterceptor
            name: cel
      name: pr-review
      template:
        ref: pr-comment
    - bindings:
        - kind: TriggerBinding
          ref: issue-comment
      interceptors:
        - params:
            - name: secretRef
              value:
                secretKey: secret
                secretName: github-webhook-secret
            - name: eventTypes
              value:
                - issue_comment
          ref:
            kind: ClusterInterceptor
            name: github
        - params:
            - name: filter
              value: body.action == 'created' && body.issue.state == 'open'
                && !has(body.issue.pull_request) && body.sender.type != 'Bot'
                && (body.comment.author_association in ['OWNER', 'MEMBER', 'COLLABORATOR']
                || int(body.comment.user.id) in [175831])
                && body.comment.body.startsWith('@ai')
          ref:
            kind: ClusterInterceptor
            name: cel
      name: issue-comment
      template:
        ref: issue-comment
