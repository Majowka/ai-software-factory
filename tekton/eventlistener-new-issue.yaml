apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: new-issue
  namespace: agents
spec:
  serviceAccountName: issue-agent-listener
  triggers:
    - bindings:
        - kind: TriggerBinding
          ref: new-issue
      interceptors:
        - params:
            - name: secretRef
              value:
                secretKey: secret
                secretName: github-webhook-secret
            - name: eventTypes
              value:
                - issues
          ref:
            kind: ClusterInterceptor
            name: github
        - params:
            - name: filter
              value: body.action == 'opened' && !body.issue.labels.exists(l,
                l.name in ['manual', 'requirements'])
                && body.repository.full_name in ['Majowka/ai-software-factory']
          ref:
            kind: ClusterInterceptor
            name: cel
      name: new-issue
      template:
        ref: new-issue
    # Review comments and reviews: every one on a pull request of the factory (branch issue-*, opened by the bot); on any
    # other pull request (also human ones) only when the body starts with `@ai`. authorize-author checks the commenter
    # (write or more), prepare refuses forks.
    - bindings:
        - kind: TriggerBinding
          ref: pr-review-comment
      interceptors:
        - params:
            - name: secretRef
              value:
                secretKey: secret
                secretName: github-webhook-secret
            - name: eventTypes
              value:
                - pull_request_review_comment
          ref:
            kind: ClusterInterceptor
            name: github
        - params:
            - name: filter
              value: body.action == 'created' && body.pull_request.state == 'open'
                && body.sender.type != 'Bot'
                && ((body.pull_request.user.type == 'Bot' && body.pull_request.head.ref.startsWith('issue-'))
                || body.comment.body.matches('^@ai(\\s|$)'))
          ref:
            kind: ClusterInterceptor
            name: cel
      name: pr-review-comment
      template:
        ref: pr-comment
    - bindings:
        - kind: TriggerBinding
          ref: pr-review
      interceptors:
        - params:
            - name: secretRef
              value:
                secretKey: secret
                secretName: github-webhook-secret
            - name: eventTypes
              value:
                - pull_request_review
          ref:
            kind: ClusterInterceptor
            name: github
        - params:
            - name: filter
              value: body.action == 'submitted' && body.pull_request.state == 'open'
                && body.sender.type != 'Bot' && body.review.body != null && body.review.body != ''
                && ((body.pull_request.user.type == 'Bot' && body.pull_request.head.ref.startsWith('issue-'))
                || body.review.body.matches('^@ai(\\s|$)'))
          ref:
            kind: ClusterInterceptor
            name: cel
      name: pr-review
      template:
        ref: pr-comment
    - bindings:
        - kind: TriggerBinding
          ref: issue-comment
      interceptors:
        - params:
            - name: secretRef
              value:
                secretKey: secret
                secretName: github-webhook-secret
            - name: eventTypes
              value:
                - issue_comment
          ref:
            kind: ClusterInterceptor
            name: github
        - params:
            - name: filter
              value: body.action == 'created' && body.issue.state == 'open'
                && !has(body.issue.pull_request) && body.sender.type != 'Bot'
                && body.comment.body.startsWith('@ai')
          ref:
            kind: ClusterInterceptor
            name: cel
      name: issue-comment
      template:
        ref: issue-comment
    # Read-only technical review of any open pull request (also human-authored ones): a comment starting with
    # `@ai review` on the PR conversation. authorize-author checks the commenter; the pipeline never pushes.
    - bindings:
        - kind: TriggerBinding
          ref: pr-review-request
      interceptors:
        - params:
            - name: secretRef
              value:
                secretKey: secret
                secretName: github-webhook-secret
            - name: eventTypes
              value:
                - issue_comment
          ref:
            kind: ClusterInterceptor
            name: github
        - params:
            - name: filter
              value: body.action == 'created' && body.issue.state == 'open'
                && has(body.issue.pull_request) && body.sender.type != 'Bot'
                && body.comment.body.matches('^@ai\\s+review(\\s|$)')
          ref:
            kind: ClusterInterceptor
            name: cel
      name: pr-review-request
      template:
        ref: pr-review
    # `@ai ...` on the conversation of any open pull request (also human ones), except `@ai review`: the agent works on the
    # PR head branch and pushes a new commit as the bot (never a force push). `@ai fix` alone fixes the failing CI of the
    # head commit. authorize-author checks the commenter (write or more), prepare refuses pull requests from forks.
    - bindings:
        - kind: TriggerBinding
          ref: pr-conversation-comment
      interceptors:
        - params:
            - name: secretRef
              value:
                secretKey: secret
                secretName: github-webhook-secret
            - name: eventTypes
              value:
                - issue_comment
          ref:
            kind: ClusterInterceptor
            name: github
        - params:
            - name: filter
              value: body.action == 'created' && body.issue.state == 'open'
                && has(body.issue.pull_request) && body.sender.type != 'Bot'
                && body.comment.body.matches('^@ai(\\s|$)')
                && !body.comment.body.matches('^@ai\\s+review(\\s|$)')
          ref:
            kind: ClusterInterceptor
            name: cel
      name: pr-conversation-comment
      template:
        ref: pr-comment
    # Automatic CI fix. Fires only once the GitHub App subscribes to "Check suite" and the relay forwards check_suite.
    # Whether the PR was opened by the factory bot, the attempt limit and the head commit are checked in prepare
    # (the check_suite payload has no PR author).
    - bindings:
        - kind: TriggerBinding
          ref: ci-failure
      interceptors:
        - params:
            - name: secretRef
              value:
                secretKey: secret
                secretName: github-webhook-secret
            - name: eventTypes
              value:
                - check_suite
          ref:
            kind: ClusterInterceptor
            name: github
        - params:
            - name: filter
              value: body.action == 'completed' && body.check_suite.conclusion in
                ['failure', 'timed_out', 'startup_failure'] && size(body.check_suite.pull_requests)
                > 0 && body.check_suite.head_branch.startsWith('issue-')
          ref:
            kind: ClusterInterceptor
            name: cel
      name: ci-failure
      template:
        ref: ci-fix
