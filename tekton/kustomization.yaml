# Common manifests of the factory (no secrets, no platform-specific objects). Used by deploy/openshift and deploy/k3s.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clusterrolebinding-issue-agent-listener.yaml
  - cronjob-requirements-scan.yaml
  - eventlistener-new-issue.yaml
  - pipeline-issue-agent.yaml
  - pipeline-issue-comment-agent.yaml
  - pipeline-pr-comment-agent.yaml
  - pipeline-pr-review-agent.yaml
  - pipeline-requirements-agent.yaml
  - role-requirements-scheduler.yaml
  - rolebinding-issue-agent-listener.yaml
  - rolebinding-requirements-scheduler.yaml
  - role-run-pruner.yaml
  - rolebinding-run-pruner.yaml
  - cronjob-run-pruner.yaml
  - serviceaccount-run-pruner.yaml
  - serviceaccount-issue-agent-listener.yaml
  - serviceaccount-requirements-scheduler.yaml
  - task-authorize-author.yaml
  - task-create-issues.yaml
  - task-fetch-skills.yaml
  - task-report-failure.yaml
  - task-verify-build.yaml
  - triggerbinding-ci-failure.yaml
  - triggerbinding-issue-comment.yaml
  - triggerbinding-new-issue.yaml
  - triggerbinding-pr-conversation-comment.yaml
  - triggerbinding-pr-review-comment.yaml
  - triggerbinding-pr-review-request.yaml
  - triggerbinding-pr-review.yaml
  - triggertemplate-ci-fix.yaml
  - triggertemplate-issue-comment.yaml
  - triggertemplate-new-issue.yaml
  - triggertemplate-pr-comment.yaml
  - triggertemplate-pr-review.yaml
