apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: pr-comment
  namespace: agents
spec:
  params:
    - name: event-type
    - name: repo-url
    - name: repo-full-name
    - name: pr-number
    - name: pr-title
    - default: ''
      name: branch
    - name: comment-author
    - name: comment-body
    - name: base-branch
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: pr-comment-agent-
      spec:
        params:
          - name: event-type
            value: $(tt.params.event-type)
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: repo-full-name
            value: $(tt.params.repo-full-name)
          - name: pr-number
            value: $(tt.params.pr-number)
          - name: pr-title
            value: $(tt.params.pr-title)
          - name: branch
            value: $(tt.params.branch)
          - name: comment-author
            value: $(tt.params.comment-author)
          - name: comment-body
            value: $(tt.params.comment-body)
          - name: base-branch
            value: $(tt.params.base-branch)
        pipelineRef:
          name: pr-comment-agent
        taskRunTemplate:
          serviceAccountName: pipeline
        timeouts:
          pipeline: 3h0m0s
        workspaces:
          - name: skills
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
