apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: verify-build
  namespace: agents
spec:
  description: >-
    Builds and tests the repository in the work workspace after the agent step. When the build fails, the agent gets
    the log and fixes it (the script in the verify step). Once the build is green, the agent reviews its own change
    (task REVIEW) and fixes what the review finds (task FIX), then the build runs again: at most self-review-rounds
    rounds. Never fails: the result is left in /workspace/out/verify-note.md and, when the build stays red or the last
    review still finds a blocker, /workspace/out/verify-failed (the pull request is then opened as a draft).
  params:
    - name: repo-full-name
      type: string
      default: ""
      description: owner/repo, picks the per-repository verify script from the agent-config ConfigMap.
    - name: verify-command
      type: string
      default: ""
      description: >-
        Build and test command. Empty means: the script verify--<owner>--<repo>.sh from agent-config when there is one,
        otherwise `mvn -B -ntp verify` when there is a pom.xml, otherwise nothing. `skip` disables it.
    - name: max-fix-attempts
      type: string
      default: "3"
    - name: regression-test
      type: string
      default: auto
      description: >-
        auto: for an issue labelled as a bug (regression-test.sh in agent-config), a green build also needs a new test that
        fails on the base commit and passes with the change. off: no such check (pr-comment-agent, where HEAD is not the base).
    - name: self-review-rounds
      type: string
      # 1: review, fix, build, and a last review that only reports. On mesh-manager (2026-11-25) every review asked for
      # changes and one review + fix + build round took 25-40 minutes, so a second fix round rarely fits.
      default: "1"
      description: >-
        How many times a self-review may send the change back for a fix (each fix is followed by the build and another
        review). 0 disables the self-review.
  workspaces:
    - name: work
      mountPath: /workspace
  volumes:
    - name: config                 # agent-run.sh and engine configs, used by the fix attempts
      configMap:
        name: agent-config
  steps:
    - name: verify
      image: ghcr.io/majowka/factory-agent:latest
      workingDir: /workspace
      volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
      computeResources:
        requests:
          memory: 1Gi
          cpu: 500m
        limits:
          memory: 3Gi
          cpu: "2"
      env:
        - name: REPO_FULL_NAME
          value: $(params.repo-full-name)
        - name: VERIFY_COMMAND
          value: $(params.verify-command)
        - name: MAX_FIX_ATTEMPTS
          value: $(params.max-fix-attempts)
        - name: SELF_REVIEW_ROUNDS
          value: $(params.self-review-rounds)
        - name: REGRESSION_TEST
          value: $(params.regression-test)
        - name: HOME
          value: /workspace/home
        - name: OPENCODE_API_KEY
          valueFrom:
            secretKeyRef:
              name: opencode-go
              key: api-key
              optional: true
        - name: CLAUDE_CODE_OAUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: claude-code-oauth
              key: token
              optional: true
      # Build and test the working tree after the agent step. When the build fails, the agent gets the log and fixes it
      # (up to MAX_FIX_ATTEMPTS times, within VERIFY_BUDGET_MINUTES). A green build goes to a self-review; remarks that
      # need a change go back to the agent and the build runs again (up to SELF_REVIEW_ROUNDS times). It never fails the
      # step: the outcome is written to /workspace/out/verify-note.md (always) and /workspace/out/verify-failed (when the
      # build stays red or the last review still has a blocker).
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        # The repo is cloned by the prepare step: a workingDir of /workspace/repo would be created as root by Tekton and could not be cloned into
        cd /workspace/repo

        OUT=/workspace/out
        LOG=/workspace/verify.log
        MAX_FIX_ATTEMPTS="${MAX_FIX_ATTEMPTS:-3}"
        SELF_REVIEW_ROUNDS="${SELF_REVIEW_ROUNDS:-1}"
        BUDGET_MINUTES="${VERIFY_BUDGET_MINUTES:-75}"
        rm -f "$OUT/verify-note.md" "$OUT/verify-failed" "$OUT/self-review.md" "$OUT/regression-check.md" "$OUT/no-auto-merge"
        # The agent names its regression test here; never committed
        take_regression_file() { if [ -f .agent-regression-test.txt ]; then mv .agent-regression-test.txt "$OUT/regression-test.txt"; fi; }
        take_regression_file

        if [ -f /workspace/skip ]; then echo "Nothing to do"; exit 0; fi
        if [ -z "$(git status --porcelain -uall -- . ':(exclude)**/target/**')" ]; then
          echo "No changes, nothing to verify"; exit 0
        fi

        # Command: the pipeline parameter, else the repository's script in agent-config, else Maven when there is a pom.xml
        cmd="${VERIFY_COMMAND:-}"
        script_text=""
        repo_script="/config/verify--$(printf '%s' "${REPO_FULL_NAME:-}" | tr '[:upper:]' '[:lower:]' | sed 's|/|--|').sh"
        if [ -z "$cmd" ] && [ -n "${REPO_FULL_NAME:-}" ] && [ -f "$repo_script" ]; then
          cmd="bash ${repo_script}"
          script_text="$(cat "$repo_script")"
        fi
        if [ -z "$cmd" ]; then
          if [ -f pom.xml ]; then cmd="mvn -B -ntp verify"; else echo "No build detected, skipping verification"; exit 0; fi
        fi
        if [ "$cmd" = "skip" ]; then echo "Verification disabled"; exit 0; fi
        script_note=""
        if [ -n "$script_text" ]; then
          script_note="

        The command runs this script (read-only, from the pipeline configuration; you cannot change it):
        ${script_text}"
        fi

        # What the change was for: whichever of these the pipeline wrote (issue, issue or PR conversation, plan)
        task_context() {
          local f
          for f in /workspace/issue.txt /workspace/issue-conversation.md /workspace/pr-conversation.md /workspace/out/plan.md; do
            if [ -s "$f" ]; then printf '\n----- %s -----\n' "$(basename "$f")"; head -c 40000 "$f"; printf '\n'; fi
          done
        }

        # Self-review of the change in the working tree (task REVIEW). Writes $OUT/self-review.md; returns 0 when it
        # needs no change (or the review produced nothing usable), 1 when it asks for a fix, 2 when that includes a blocker.
        self_review() {
          local round="$1" diff_file=/workspace/self-review.diff previous=
          # Stage the change (publish commits the same set) and keep a snapshot of it: the reviewer must not change the tree
          git add -A -- . ':(exclude)**/target/**'
          local snapshot; snapshot="$(git write-tree)"
          git diff --cached HEAD > "$diff_file"
          # Later rounds: check the earlier remarks against what the fix changed, instead of reviewing everything again
          if [ -n "${last_review_tree:-}" ] && [ -s "$OUT/self-review.md" ]; then
            git diff "$last_review_tree" "$snapshot" > /workspace/self-review-delta.diff
            previous="

        This is a follow-up review. The previous review is below, and /workspace/self-review-delta.diff has what changed since it. Check first whether each earlier remark was fixed correctly and whether the fix broke something; review the rest of the diff only where the fix touched it. Do not raise new points about code the fix did not touch unless they are blockers.

        Previous review:
        $(cat "$OUT/self-review.md")"
          fi
          last_review_tree="$snapshot"
          rm -f "$OUT/self-review.md"
          echo "=== Self-review round ${round} ($(wc -l < "$diff_file") diff lines) ==="
          REVIEW_PROMPT="You are a senior reviewer. Another engineer made the change below in this repository (the working tree at /workspace/repo has it applied; the diff against the last commit is in ${diff_file}). The build and tests pass: ${cmd}

        Decide whether this change can be merged as it is. A good change gets VERDICT: ok; do not look for something to say. Read the diff, then open the changed code, its callers and its tests; do not run any tests. You have 5 minutes and at most 15 tool calls: write a first version of /workspace/out/self-review.md after your first few reads, then refine it; read whole functions in one go instead of many small slices. Check, in this order:
        1. Root cause: does the change fix the cause of the problem described in the task, or only hide a symptom (a retry, a broad try/except, a guard in the wrong layer, an early return)? Follow the failing path through the real code, including other processes or workers that run the same code.
        2. Correctness of the new code: error and rollback paths, transactions and sessions, async/await and threads, None/empty values, existing callers.
        3. Tests: would the new or changed tests fail without the fix? A test that only exercises a mock or a fake of the very thing that broke proves nothing.
        4. Scope: requirements of the task that are not done; changes the task did not ask for.

        Write /workspace/out/self-review.md and nothing else (do not modify any other file, do not run git commit or gh). Its first line is exactly 'VERDICT: fix' when there is at least one blocker or major remark, otherwise exactly 'VERDICT: ok'. Then one numbered line per remark, in the form '1. [blocker] path:line: <concrete case: input or state, and the wrong result it gives>. Fix: <how>' (use [major] for a major one).
        - blocker: the change does not fix the cause of the task, or it breaks existing behaviour, loses or corrupts data, or crashes in a normal case.
        - major: a real bug in a realistic case, a requirement of the task that is not done, or a new test that would still pass without the fix.
        Not a remark at all: style, naming, comments, docs, logging, refactors, extra tests that would be nice, and anything you cannot tie to a concrete failing case you verified in the code. If you want, list such minor points after the remarks under a 'Notes:' heading; they do not change the verdict and nobody acts on them.

        The task:
        $(task_context)${previous}"
          # Hard budget: a self-review of one change must stay short; a review cut off by the timeout keeps what it wrote
          bash /config/agent-run.sh review "${SELF_REVIEW_MINUTES:-6}m" /workspace/self-review.log "$REVIEW_PROMPT" || echo "Self-review ended with an error; using what it wrote"
          # Drop anything the reviewer changed: back to the snapshot (index and files), untracked leftovers removed
          git read-tree "$snapshot" && git checkout-index -a -f && git clean -qfd -- . ':(exclude)**/target/**'
          if [ ! -s "$OUT/self-review.md" ]; then echo "Self-review wrote nothing; skipping it"; return 0; fi
          cat "$OUT/self-review.md"
          # Only numbered remarks marked [blocker] or [major] count (above the Notes heading); a 'fix' verdict without one is ok
          local remarks; remarks="$(sed '/^[[:space:]#*]*Notes:/,$d' "$OUT/self-review.md" | grep -iE '^[[:space:]]*[0-9]+[.)][[:space:]]*\[(blocker|major)\]' || true)"
          if head -n 3 "$OUT/self-review.md" | grep -qiE '^[[:space:]]*VERDICT:[[:space:]]*fix' && [ -n "$remarks" ]; then
            if grep -qiE '\[blocker\]' <<<"$remarks"; then return 2; fi
            return 1
          fi
          return 0
        }

        # Bug issues: the new test must fail on the base commit and pass with the change. Returns 0 when that holds (or
        # the check does not apply), 1 otherwise with the reason in $OUT/regression-check.md.
        source /config/regression-test.sh
        regression_needed=false
        if [ "${REGRESSION_TEST:-auto}" = "auto" ] && is_bug; then regression_needed=true; echo "Bug issue: a regression test is required"; fi
        regression_check() {
          local why="" rcmd="" f base=/workspace/regression-base
          # Run the command with the verify script's Python environment (pytest and the dependencies are there), not the system one
          local venv; venv="${HOME}/.cache/verify-venv/$(basename "$(printf '%s' "${REPO_FULL_NAME:-}" | tr '[:upper:]' '[:lower:]')")"
          local run_env=""
          if [ -x "$venv/bin/python" ]; then run_env="export VIRTUAL_ENV='$venv' PATH='$venv/bin':\"\$PATH\"; "; fi
          rm -f "$OUT/regression-check.md"
          git add -A -- . ':(exclude)**/target/**'
          local tests; tests="$(git diff --cached --name-only --diff-filter=AM HEAD | while IFS= read -r f; do if is_test_path "$f"; then echo "$f"; fi; done)"
          if [ -f "$OUT/regression-test.txt" ]; then
            rcmd="$(sed -nE 's/^[[:space:]]*command:[[:space:]]*//p' "$OUT/regression-test.txt" | head -n 1 | tr -d '\r')"
          fi
          if [ -z "$tests" ]; then
            why="The change adds or modifies no test file."
          elif [ -z "$rcmd" ]; then
            why="There is no .agent-regression-test.txt with a 'command: ...' line that runs the new test(s)."
          else
            echo "=== Regression test: ${rcmd} ==="
            echo "Test files of the change:"; printf '  %s\n' $tests
            if ! timeout 15m bash -c "${run_env}${rcmd}" > /workspace/regression-after.log 2>&1; then
              why="The regression test command fails with the change applied. Last lines:
        $(tail -n 60 /workspace/regression-after.log)"
            else
              # Base commit plus only the new and changed test files
              git worktree remove --force "$base" 2>/dev/null || true
              git worktree add -q --detach "$base" HEAD
              while IFS= read -r f; do mkdir -p "$base/$(dirname "$f")"; cp "$f" "$base/$f"; done <<<"$tests"
              if (cd "$base" && timeout 15m bash -c "${run_env}${rcmd}") > /workspace/regression-base.log 2>&1; then
                why="The regression test passes on the base commit too (the code without your fix, with your test files copied in), so it does not reproduce the bug. Make it exercise the failing path through the real code. Last lines on the base commit:
        $(tail -n 40 /workspace/regression-base.log)"
              else
                echo "Regression test fails on the base commit and passes with the change"
                tail -n 15 /workspace/regression-base.log
              fi
              git worktree remove --force "$base" 2>/dev/null || true
            fi
          fi
          if [ -n "$why" ]; then
            printf '%s\n' "$why" > "$OUT/regression-check.md"
            echo "=== Regression test check failed ==="; cat "$OUT/regression-check.md"
            return 1
          fi
          return 0
        }

        deadline=$(( $(date +%s) + BUDGET_MINUTES * 60 ))
        regression_fixes=0
        regression_ok=true
        attempt=0
        review_round=0
        review_fixes=0
        while true; do
          echo "=== Verify: ${cmd} (fix attempts used: ${attempt}/${MAX_FIX_ATTEMPTS}) ==="
          build_start=$SECONDS
          if timeout 20m bash -c "$cmd" > "$LOG" 2>&1; then
            # Section headers and their timings (the verify scripts print them), then the end of the log
            grep -E '^=== ' "$LOG" || true
            echo "=== Build passed in $((SECONDS - build_start))s ==="
            tail -n 20 "$LOG"
            if [ "$regression_needed" = true ]; then
              regression_ok=true
              if ! regression_check; then
                regression_ok=false
                if [ "$regression_fixes" -lt 2 ] && [ "$(date +%s)" -lt "$deadline" ]; then
                  regression_fixes=$((regression_fixes + 1))
                  echo "=== Asking the agent for a regression test (round ${regression_fixes}/2) ==="
                  PROMPT="The build passes, but this bug fix lacks a valid regression test. $(cat "$OUT/regression-check.md")

        ${REGRESSION_TEST_RULES}

        Keep the fix itself; do not delete or weaken other tests. The full build must still pass: ${cmd}; run only the tests that cover what you change (one file or a -k filter), never the whole build command: the pipeline runs the full build right after you. The pipeline handles git and GitHub; do not write .agent-summary.md.${script_note}

        The task:
        $(task_context)"
                  bash /config/agent-run.sh fix 20m /workspace/agent.log "$PROMPT" || echo "Continuing"
                  rm -f .agent-summary.md .agent-pr.txt
                  take_regression_file
                  continue
                fi
              fi
            fi
            verdict=0
            if [ "$review_round" -le "$SELF_REVIEW_ROUNDS" ] && [ "$SELF_REVIEW_ROUNDS" -gt 0 ] && [ "$(date +%s)" -lt "$deadline" ]; then
              review_round=$((review_round + 1))
              self_review "$review_round"; verdict=$?
              if [ "$verdict" -ne 0 ] && [ "$review_fixes" -lt "$SELF_REVIEW_ROUNDS" ] && [ "$(date +%s)" -lt "$deadline" ]; then
                review_fixes=$((review_fixes + 1))
                echo "=== Self-review asks for changes, asking the agent to fix them (round ${review_fixes}/${SELF_REVIEW_ROUNDS}) ==="
                PROMPT="A reviewer checked your change in this repository and found problems. Fix them in the code and tests; the build must still pass: ${cmd}

        Address every blocker and major remark. If a remark is wrong, leave the code as it is and say why in one line in .agent-review-reply.md. Do not delete or weaken tests. Run only the tests that cover what you change (one file or a -k filter), never the whole build command: the pipeline runs the full build right after you. The pipeline handles git and GitHub; do not write .agent-summary.md.

        The review:
        $(cat "$OUT/self-review.md")

        The task:
        $(task_context)"
                bash /config/agent-run.sh fix 20m /workspace/agent.log "$PROMPT" || echo "Continuing"
                rm -f .agent-summary.md .agent-pr.txt .agent-review-reply.md
                take_regression_file
                continue
              fi
            fi
            suffix=""
            if [ "$attempt" -gt 0 ]; then suffix=" after ${attempt} fix attempt(s)"; fi
            if [ "$review_round" -gt 0 ]; then
              suffix="${suffix}; self-review: ${review_round} round(s), ${review_fixes} fix round(s)"
            fi
            printf ':white_check_mark: Build verification passed (`%s`)%s.\n' "$cmd" "$suffix" > "$OUT/verify-note.md"
            if [ "$verdict" -ne 0 ] && [ -s "$OUT/self-review.md" ]; then
              {
                printf '\n:warning: **The last self-review still asks for changes.** Review the code before merging.\n\n'
                printf '<details><summary>Self-review</summary>\n\n'
                cat "$OUT/self-review.md"
                printf '\n</details>\n'
              } >> "$OUT/verify-note.md"
              # Remarks left after the fix rounds: a person merges (no auto-merge); a blocker also keeps the PR a draft
              touch "$OUT/no-auto-merge"
              if [ "$verdict" -eq 2 ]; then cp "$OUT/verify-note.md" "$OUT/verify-failed"; fi
            fi
            if [ "$regression_needed" = true ]; then
              if [ "$regression_ok" = true ]; then
                printf '\n:white_check_mark: Regression test fails on the base commit and passes with the change (`%s`).\n' \
                  "$(sed -nE 's/^[[:space:]]*command:[[:space:]]*//p' "$OUT/regression-test.txt" | head -n 1)" >> "$OUT/verify-note.md"
              else
                {
                  printf '\n:warning: **No valid regression test** for this bug fix:\n\n<details><summary>Why</summary>\n\n```\n'
                  cat "$OUT/regression-check.md"
                  printf '```\n\n</details>\n'
                } >> "$OUT/verify-note.md"
                cp "$OUT/verify-note.md" "$OUT/verify-failed"
              fi
            fi
            exit 0
          fi
          grep -E '^=== ' "$LOG" || true
          echo "=== Build failed after $((SECONDS - build_start))s ==="
          tail -n 100 "$LOG"
          if [ "$attempt" -ge "$MAX_FIX_ATTEMPTS" ] || [ "$(date +%s)" -ge "$deadline" ]; then break; fi

          attempt=$((attempt + 1))
          echo "=== Build failed, asking the agent to fix it (attempt ${attempt}) ==="
          PROMPT="The build and tests of this repository fail after your changes. Fix the code so that this command passes: ${cmd}

        Keep the change minimal. Do not delete or weaken tests just to make them pass. Re-run the failing tests to check your fix, not the whole command: the pipeline runs the full build right after you. The pipeline handles git and GitHub; do not write .agent-summary.md.${script_note}

        Last lines of the output:
        $(tail -n 150 "$LOG")"
          bash /config/agent-run.sh fix 15m /workspace/agent.log "$PROMPT" || echo "Continuing"
          rm -f .agent-summary.md .agent-pr.txt
          take_regression_file
        done

        {
          printf ':warning: **Build verification failed** (`%s`) after %s fix attempt(s). Review the code before merging.\n\n' "$cmd" "$attempt"
          printf '<details><summary>Last lines of the build log</summary>\n\n```\n'
          tail -n 40 "$LOG"
          printf '```\n\n</details>\n'
        } > "$OUT/verify-note.md"
        cp "$OUT/verify-note.md" "$OUT/verify-failed"
