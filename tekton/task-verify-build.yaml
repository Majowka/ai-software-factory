apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: verify-build
  namespace: agents
spec:
  description: >-
    Builds and tests the repository in the work workspace after the agent step. When the build fails, the agent gets
    the log and fixes it (the script in the verify step). Never fails: the result is left in
    /workspace/out/verify-note.md and, when the build stays red, /workspace/out/verify-failed.
  params:
    - name: repo-full-name
      type: string
      default: ""
      description: owner/repo, picks the per-repository verify script from the agent-config ConfigMap.
    - name: verify-command
      type: string
      default: ""
      description: >-
        Build and test command. Empty means: the script verify--<owner>--<repo>.sh from agent-config when there is one,
        otherwise `mvn -B -ntp verify` when there is a pom.xml, otherwise nothing. `skip` disables it.
    - name: max-fix-attempts
      type: string
      default: "3"
  workspaces:
    - name: work
      mountPath: /workspace
  volumes:
    - name: config                 # agent-run.sh and engine configs, used by the fix attempts
      configMap:
        name: agent-config
  steps:
    - name: verify
      image: ghcr.io/majowka/factory-agent:latest
      workingDir: /workspace
      volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
      computeResources:
        requests:
          memory: 1Gi
          cpu: 500m
        limits:
          memory: 3Gi
          cpu: "2"
      env:
        - name: REPO_FULL_NAME
          value: $(params.repo-full-name)
        - name: VERIFY_COMMAND
          value: $(params.verify-command)
        - name: MAX_FIX_ATTEMPTS
          value: $(params.max-fix-attempts)
        - name: HOME
          value: /workspace/home
        - name: OPENCODE_API_KEY
          valueFrom:
            secretKeyRef:
              name: opencode-go
              key: api-key
              optional: true
        - name: CLAUDE_CODE_OAUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: claude-code-oauth
              key: token
              optional: true
      # Build and test the working tree after the agent step. When the build fails, the agent gets the log and fixes it
      # (up to MAX_FIX_ATTEMPTS times, within VERIFY_BUDGET_MINUTES). It never fails the step: the outcome is written to
      # /workspace/out/verify-note.md (always) and /workspace/out/verify-failed (only when the build stays red).
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        # The repo is cloned by the prepare step: a workingDir of /workspace/repo would be created as root by Tekton and could not be cloned into
        cd /workspace/repo

        OUT=/workspace/out
        LOG=/workspace/verify.log
        MAX_FIX_ATTEMPTS="${MAX_FIX_ATTEMPTS:-3}"
        BUDGET_MINUTES="${VERIFY_BUDGET_MINUTES:-45}"
        rm -f "$OUT/verify-note.md" "$OUT/verify-failed"

        if [ -f /workspace/skip ]; then echo "Nothing to do"; exit 0; fi
        if [ -z "$(git status --porcelain -uall -- . ':(exclude)**/target/**')" ]; then
          echo "No changes, nothing to verify"; exit 0
        fi

        # Command: the pipeline parameter, else the repository's script in agent-config, else Maven when there is a pom.xml
        cmd="${VERIFY_COMMAND:-}"
        script_text=""
        repo_script="/config/verify--$(printf '%s' "${REPO_FULL_NAME:-}" | tr '[:upper:]' '[:lower:]' | sed 's|/|--|').sh"
        if [ -z "$cmd" ] && [ -n "${REPO_FULL_NAME:-}" ] && [ -f "$repo_script" ]; then
          cmd="bash ${repo_script}"
          script_text="$(cat "$repo_script")"
        fi
        if [ -z "$cmd" ]; then
          if [ -f pom.xml ]; then cmd="mvn -B -ntp verify"; else echo "No build detected, skipping verification"; exit 0; fi
        fi
        if [ "$cmd" = "skip" ]; then echo "Verification disabled"; exit 0; fi
        script_note=""
        if [ -n "$script_text" ]; then
          script_note="

        The command runs this script (read-only, from the pipeline configuration; you cannot change it):
        ${script_text}"
        fi

        deadline=$(( $(date +%s) + BUDGET_MINUTES * 60 ))
        attempt=0
        while true; do
          echo "=== Verify: ${cmd} (fix attempts used: ${attempt}/${MAX_FIX_ATTEMPTS}) ==="
          if timeout 20m bash -c "$cmd" > "$LOG" 2>&1; then
            tail -n 20 "$LOG"
            suffix=""
            if [ "$attempt" -gt 0 ]; then suffix=" after ${attempt} fix attempt(s)"; fi
            printf ':white_check_mark: Build verification passed (`%s`)%s.\n' "$cmd" "$suffix" > "$OUT/verify-note.md"
            exit 0
          fi
          tail -n 100 "$LOG"
          if [ "$attempt" -ge "$MAX_FIX_ATTEMPTS" ] || [ "$(date +%s)" -ge "$deadline" ]; then break; fi

          attempt=$((attempt + 1))
          echo "=== Build failed, asking the agent to fix it (attempt ${attempt}) ==="
          PROMPT="The build and tests of this repository fail after your changes. Fix the code so that this command passes: ${cmd}

        Keep the change minimal. Do not delete or weaken tests just to make them pass. You may run the command yourself to check. The pipeline handles git and GitHub; do not write .agent-summary.md.${script_note}

        Last lines of the output:
        $(tail -n 150 "$LOG")"
          bash /config/agent-run.sh fix 15m /workspace/agent.log "$PROMPT" || echo "Continuing"
          rm -f .agent-summary.md .agent-pr.txt
        done

        {
          printf ':warning: **Build verification failed** (`%s`) after %s fix attempt(s). Review the code before merging.\n\n' "$cmd" "$attempt"
          printf '<details><summary>Last lines of the build log</summary>\n\n```\n'
          tail -n 40 "$LOG"
          printf '```\n\n</details>\n'
        } > "$OUT/verify-note.md"
        cp "$OUT/verify-note.md" "$OUT/verify-failed"
