<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1F2A44"/></marker></defs>
<rect width="1400" height="560" fill="#FFFFFF"/>
<text x="24" y="38" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2A44">AI Software Factory</text>
<text x="24" y="62" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6678">GitHub issue or comment  -&gt;  Tekton on OpenShift  -&gt;  coding agent  -&gt;  model on vLLM  -&gt;  pull request  -&gt;  human approval</text>
