<text x="130" y="432" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2A44">Pull request</text>
<text x="130" y="456" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6678">branch, plan and</text>
<text x="130" y="476" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6678">summary comments</text>
<rect x="380" y="380" width="270" height="140" rx="14" fill="#FFFFFF" stroke="#1F9D55" stroke-width="3.6"/>
