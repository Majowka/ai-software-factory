<text x="470" y="432" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2A44">Human review</text>
<text x="470" y="456" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6678">approves the</text>
<text x="470" y="476" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6678">pull request</text>
