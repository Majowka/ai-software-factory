<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="812" viewBox="0 0 1520 812">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1F2A44"/></marker></defs>
<rect width="1520" height="812" fill="#FFFFFF"/>
<text x="24" y="38" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2A44">AI Software Factory</text>
<text x="24" y="62" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6678">Two ways in: a GitHub event, or a scheduled scan of requirements issues  -&gt;  Tekton on OpenShift  -&gt;  coding agent  -&gt;  model on vLLM  -&gt;  pull request  -&gt;  human approval</text>
<rect x="30" y="100" width="210" height="476" rx="14" fill="#FFFFFF" stroke="#24292F" stroke-width="2.4"/>
<g transform="translate(46,112) scale(0.7)"><circle cx="13" cy="9" r="5.5" fill="none" stroke="#24292F" stroke-width="3.5"/><circle cx="13" cy="39" r="5.5" fill="none" stroke="#24292F" stroke-width="3.5"/><circle cx="35" cy="17" r="5.5" fill="none" stroke="#24292F" stroke-width="3.5"/><path d="M13 15 V33 M35 23 Q35 29 13 31" fill="none" stroke="#24292F" stroke-width="3.5" stroke-linecap="round"/></g>
<text x="92" y="138" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2A44">GitHub</text>
<rect x="46" y="164" width="178" height="110" rx="14" fill="#FFFFFF" stroke="#24292F" stroke-width="2.4"/>
<g transform="translate(60,180) scale(0.9167)"><rect x="6" y="5" width="36" height="38" rx="6" fill="none" stroke="#24292F" stroke-width="3.5"/><path d="M14 16 H34 M14 24 H34 M14 32 H26" stroke="#24292F" stroke-width="3.5" stroke-linecap="round"/></g>
<text x="104" y="200" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2A44">Requirements</text>
<text x="104" y="222" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6678">issue with the</text>
<text x="104" y="240" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6678">label requirements,</text>
<text x="104" y="258" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6678">plan in a comment</text>
<rect x="46" y="374" width="178" height="110" rx="14" fill="#FFFFFF" stroke="#24292F" stroke-width="2.4"/>
<g transform="translate(60,390) scale(0.9167)"><circle cx="13" cy="9" r="5.5" fill="none" stroke="#24292F" stroke-width="3.5"/><circle cx="13" cy="39" r="5.5" fill="none" stroke="#24292F" stroke-width="3.5"/><circle cx="35" cy="17" r="5.5" fill="none" stroke="#24292F" stroke-width="3.5"/><path d="M13 15 V33 M35 23 Q35 29 13 31" fill="none" stroke="#24292F" stroke-width="3.5" stroke-linecap="round"/></g>
<text x="104" y="410" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2A44">Issues</text>
<text x="104" y="432" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6678">new issues, @ai</text>
<text x="104" y="450" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6678">comments, reviews,</text>
<text x="104" y="468" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6678">the task issues</text>
<rect x="270" y="100" width="1210" height="476" rx="18" fill="#FFF6F6" stroke="#EE0000" stroke-width="2.2"/>
<text x="288" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B91C1C">OPENSHIFT CLUSTER</text>
<text x="290" y="150" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5B6678">SCHEDULED</text>
<text x="290" y="362" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5B6678">EVENT-DRIVEN</text>
<line x1="290" y1="330" x2="1170" y2="330" stroke="#E8B4B4" stroke-width="1.4" stroke-dasharray="6 6"/>
<rect x="290" y="162" width="230" height="110" rx="14" fill="#FFFFFF" stroke="#326CE5" stroke-width="2.4"/>
<g transform="translate(304,178) scale(0.9167)"><circle cx="24" cy="24" r="19" fill="none" stroke="#326CE5" stroke-width="4"/><path d="M24 12 V25 L33 30" fill="none" stroke="#326CE5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="358" y="198" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2A44">CronJob</text>
<text x="358" y="220" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">every hour, no AI:</text>
<text x="358" y="238" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">analyze, release</text>
<text x="358" y="256" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">or review</text>
<rect x="570" y="162" width="270" height="110" rx="14" fill="#FFFFFF" stroke="#1E6FD9" stroke-width="2.4"/>
<g transform="translate(584,178) scale(0.9167)"><path d="M5 8 H43 L28 26 V41 L20 36 V26 Z" fill="#1E6FD9" stroke="#1E6FD9" stroke-width="2" stroke-linejoin="round"/></g>
<text x="638" y="198" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2A44">requirements-agent</text>
<text x="638" y="220" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">Tekton pipeline:</text>
<text x="638" y="238" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">analyze, then</text>
<text x="638" y="256" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">create-issues</text>
<rect x="890" y="162" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3.4"/>
<g transform="translate(904,178) scale(0.9167)"><rect x="0" y="0" width="48" height="48" rx="11" fill="#211E1E"/><path d="M12 10 H36 V38 H12 Z M19 17 V31 H29 V17 Z" fill="#FFFFFF" fill-rule="evenodd"/><rect x="19" y="24" width="10" height="7" fill="#9B9B9B"/></g>
<text x="958" y="198" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2A44">Coding agent</text>
<text x="958" y="220" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">OpenCode +</text>
<text x="958" y="238" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">requirements-breakdown</text>
<text x="958" y="256" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">skill, reads the code</text>
<rect x="290" y="374" width="230" height="110" rx="14" fill="#FFFFFF" stroke="#1E6FD9" stroke-width="2.4"/>
<g transform="translate(304,390) scale(0.9167)"><path d="M5 8 H43 L28 26 V41 L20 36 V26 Z" fill="#1E6FD9" stroke="#1E6FD9" stroke-width="2" stroke-linejoin="round"/></g>
<text x="358" y="410" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2A44">Tekton Triggers</text>
<text x="358" y="432" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">EventListener with</text>
<text x="358" y="450" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">CEL filters start</text>
<text x="358" y="468" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">a PipelineRun</text>
<rect x="570" y="374" width="270" height="110" rx="14" fill="#FFFFFF" stroke="#1E6FD9" stroke-width="2.4"/>
<g transform="translate(584,390) scale(0.9167)"><path d="M5 8 H43 L28 26 V41 L20 36 V26 Z" fill="#1E6FD9" stroke="#1E6FD9" stroke-width="2" stroke-linejoin="round"/></g>
<text x="638" y="410" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2A44">Pipelines</text>
<text x="638" y="432" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">issue-agent,</text>
<text x="638" y="450" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">issue-comment-agent,</text>
<text x="638" y="468" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">pr-comment-agent</text>
<rect x="890" y="374" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3.4"/>
<g transform="translate(904,390) scale(0.9167)"><rect x="0" y="0" width="48" height="48" rx="11" fill="#211E1E"/><path d="M12 10 H36 V38 H12 Z M19 17 V31 H29 V17 Z" fill="#FFFFFF" fill-rule="evenodd"/><rect x="19" y="24" width="10" height="7" fill="#9B9B9B"/></g>
<text x="958" y="410" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2A44">Coding agent</text>
<text x="958" y="432" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">OpenCode in its own</text>
<text x="958" y="450" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">pod, no GitHub</text>
<text x="958" y="468" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">credentials</text>
<rect x="1190" y="162" width="270" height="322" rx="14" fill="#FFFFFF" stroke="#1F9D55" stroke-width="2.4"/>
<g transform="translate(1210,184) scale(1.1667)"><path d="M16 3 V11 M16 37 V45 M3 16 H11 M37 16 H45" stroke="#1F9D55" stroke-width="3.5" stroke-linecap="round"/><path d="M24 3 V11 M24 37 V45 M3 24 H11 M37 24 H45" stroke="#1F9D55" stroke-width="3.5" stroke-linecap="round"/><path d="M32 3 V11 M32 37 V45 M3 32 H11 M37 32 H45" stroke="#1F9D55" stroke-width="3.5" stroke-linecap="round"/><rect x="10" y="10" width="28" height="28" rx="5" fill="#1F9D55"/><rect x="17" y="17" width="14" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.85"/></g>
<text x="1278" y="214" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2A44">vLLM</text>
<text x="1278" y="238" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6678">Qwen3.8 Flash</text>
<text x="1210" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6678">One model server for both</text>
<text x="1210" y="320" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6678">flows, on a GPU node</text>
<text x="1210" y="340" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6678">(g7e.12xlarge, 2 GPUs).</text>
<text x="1210" y="440" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678" font-style="italic">Pipelines wait for the</text>
<text x="1210" y="458" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678" font-style="italic">model when it is busy.</text>
