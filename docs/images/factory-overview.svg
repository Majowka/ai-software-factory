<text x="300" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2A44">creates the task issues (label req-N), at most 3 open at a time</text>
<path d="M705 486 V540 H425 V618" fill="none" stroke="#1F2A44" stroke-width="3" marker-end="url(#ah)"/>
<rect x="440" y="518" width="150" height="22" rx="11" fill="#FFF6F6"/>
<text x="515" y="534" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2A44">opens the PR</text>
<rect x="290" y="620" width="270" height="130" rx="14" fill="#FFFFFF" stroke="#24292F" stroke-width="2.4"/>
<g transform="translate(304,636) scale(0.9167)"><path d="M10 4 H29 L40 15 V44 H10 Z" fill="#24292F"/><path d="M29 4 V15 H40" fill="#FFFFFF" fill-opacity="0.45"/><path d="M16 24 H34 M16 30 H34 M16 36 H27" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></g>
<text x="358" y="656" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2A44">Pull request</text>
<text x="358" y="678" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">branch, plan and</text>
<text x="358" y="696" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">summary comments</text>
<text x="358" y="714" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">(Closes #task)</text>
<rect x="620" y="620" width="270" height="130" rx="14" fill="#FFFFFF" stroke="#1F9D55" stroke-width="3.6"/>
<g transform="translate(634,636) scale(0.9167)"><circle cx="24" cy="15" r="9" fill="#1F9D55"/><path d="M6 44 Q6 27 24 27 Q42 27 42 44 Z" fill="#1F9D55"/></g>
<text x="688" y="656" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2A44">Human review</text>
<text x="688" y="678" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">approves the</text>
<text x="688" y="696" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">pull request</text>
<rect x="950" y="620" width="270" height="130" rx="14" fill="#FFFFFF" stroke="#24292F" stroke-width="2.4"/>
<g transform="translate(964,636) scale(0.9167)"><rect x="5" y="5" width="38" height="38" rx="7" fill="#1F9D55"/><path d="M12 16 L15 19 L20 13 M12 26 L15 29 L20 23 M12 36 L15 39 L20 33" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 16 H37 M26 26 H37 M26 36 H37" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></g>
<text x="1018" y="656" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2A44">Merge</text>
<text x="1018" y="678" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">after approval and</text>
<text x="1018" y="696" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">required checks:</text>
<text x="1018" y="714" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">the task issue closes</text>
<line x1="560" y1="685" x2="618" y2="685" stroke="#1F2A44" stroke-width="3" marker-end="url(#ah)"/>
<line x1="890" y1="685" x2="948" y2="685" stroke="#1F2A44" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1250" y="620" width="230" height="130" rx="14" fill="#F9FAFB" stroke="#C9CED6" stroke-width="1.6"/>
<text x="1268" y="646" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2A44">Along the way</text>
<text x="1268" y="668" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">Agents never hold GitHub</text>
<text x="1268" y="686" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">credentials: the pipeline does</text>
<text x="1268" y="704" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678">git, PRs and comments.</text>
<text x="1268" y="732" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1D7A45">A human decides what is merged.</text>
<path d="M1085 752 V786 H1502 V84 H490 V160" fill="none" stroke="#5B6678" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="9 7"/>
<text x="1495" y="803" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6678" font-style="italic">a merged PR closes its task issue; the next scan releases the tasks whose dependencies are done</text>
<g id="flow"><circle r="6.5" fill="#EE0000" stroke="#FFFFFF" stroke-width="2"><animateMotion dur="7s" begin="0s" repeatCount="indefinite" path="M226 217 H1186"/></circle><circle r="6.5" fill="#EE0000" stroke="#FFFFFF" stroke-width="2"><animateMotion dur="7s" begin="1.8s" repeatCount="indefinite" path="M226 429 H1186"/></circle><circle r="6.5" fill="#EE0000" stroke="#FFFFFF" stroke-width="2"><animateMotion dur="5s" begin="3.2s" repeatCount="indefinite" path="M705 274 V306 H135 V372"/></circle><circle r="6.5" fill="#EE0000" stroke="#FFFFFF" stroke-width="2"><animateMotion dur="4s" begin="2.4s" repeatCount="indefinite" path="M705 486 V540 H425 V618"/></circle><circle r="6.5" fill="#EE0000" stroke="#FFFFFF" stroke-width="2"><animateMotion dur="14s" begin="0s" repeatCount="indefinite" path="M1085 752 V786 H1502 V84 H490 V160"/></circle></g>
