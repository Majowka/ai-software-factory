<g transform="translate(58,152) scale(1.1667)"><circle cx="13" cy="9" r="5.5" fill="none" stroke="#24292F" stroke-width="3.5"/><circle cx="13" cy="39" r="5.5" fill="none" stroke="#24292F" stroke-width="3.5"/><circle cx="35" cy="17" r="5.5" fill="none" stroke="#24292F" stroke-width="3.5"/><path d="M13 15 V33 M35 23 Q35 29 13 31" fill="none" stroke="#24292F" stroke-width="3.5" stroke-linecap="round"/></g>
<text x="130" y="182" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2A44">GitHub</text>
<text x="130" y="206" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6678">issues, comments,</text>
<text x="130" y="226" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6678">reviews, PRs</text>
<rect x="340" y="130" width="250" height="150" rx="14" fill="#FFFFFF" stroke="#1E6FD9" stroke-width="2.4"/>
<g transform="translate(358,152) scale(1.1667)"><path d="M5 8 H43 L28 26 V41 L20 36 V26 Z" fill="#1E6FD9" stroke="#1E6FD9" stroke-width="2" stroke-linejoin="round"/></g>
<text x="430" y="182" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2A44">Tekton</text>
<text x="430" y="206" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6678">Triggers filter events,</text>
<text x="430" y="226" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6678">Pipelines run the work</text>
