<text x="700" y="232" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2A44">Coding agent</text>
<text x="700" y="254" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6678">OpenCode (or Claude Code)</text>
