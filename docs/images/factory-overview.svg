<circle cx="344" cy="424" r="14" fill="#EE0000" stroke="#FFFFFF" stroke-width="2"/><text x="344" y="429" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
<circle cx="684" cy="424" r="14" fill="#EE0000" stroke="#FFFFFF" stroke-width="2"/><text x="684" y="429" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">6</text>
<rect x="1010" y="380" width="350" height="140" rx="14" fill="#F9FAFB" stroke="#C9CED6" stroke-width="1.6"/>
<text x="1030" y="410" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2A44">Along the way</text>
<text x="1030" y="438" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6678">The agent posts a plan as a checklist.</text>
<text x="1030" y="460" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6678">Skills come from a Quay.io artifact.</text>
<text x="1030" y="482" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6678">The agent never holds GitHub credentials.</text>
<text x="1030" y="504" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D7A45">A human always decides what gets merged.</text>
